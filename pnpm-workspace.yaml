# Tells pnpm which folders are packages in this monorepo.
# Docs: https://pnpm.io/pnpm-workspace_yaml
packages:
  - apps/*
  - packages/*

# -----------------------------------------------------------------------------
# Supply-chain security. Read SECURITY.md before changing anything below.
# -----------------------------------------------------------------------------

# Refuse package versions published less than 1 day (1440 minutes) ago.
# Malicious versions are usually spotted and removed within hours.
minimumReleaseAge: 1440

# Refuse a version whose publishing trust is weaker than earlier versions of
# the same package (for example, provenance suddenly missing), a common sign
# of a hijacked maintainer account.
trustPolicy: no-downgrade

# Dependencies of dependencies may not come from git repositories or tarball URLs.
blockExoticSubdeps: true

# Fail the install when a dependency wants to run an install script that is
# not listed in allowBuilds below.
strictDepBuilds: true

# Install scripts are code that runs on your machine during `pnpm install`.
# Each entry below was reviewed: `true` lets the script run, `false` blocks it.
# Keep this list short, and explain every new entry in its pull request.
allowBuilds:
  # Prepares the local PostgreSQL server files used by `pnpm db:start`.
  # Each operating system downloads its own package, so each one is listed.
  "@embedded-postgres/windows-x64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/darwin-x64": true
  # Downloads the Prisma engine that applies database migrations.
  "@prisma/engines": true
  # Only checks the Node.js version before installing. Not needed.
  prisma: false
  # Only double-checks its own binary. esbuild works without it.
  esbuild: false
  # Only copies the mock worker file, which we keep in apps/web/public instead.
  msw: false

# openapi-typescript 7 declares support for TypeScript 5 only, but it works with
# TypeScript 6; CI proves it on every run with `pnpm contracts:check`.
# Remove this rule once openapi-typescript officially supports TypeScript 6.
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: "6"

# Exact, reviewed exceptions to trustPolicy. Each needs a reason.
# semver@6.3.1 (July 2023) is a security fix for the old 6.x line, published by an
# npm team member without provenance. pnpm reports it as a trust downgrade, a known
# false positive (pnpm issue 10202). The shadcn CLI depends on it.
trustPolicyExclude:
  - semver@6.3.1

# Security fix for a vulnerable dependency of a dependency.
# prisma@7.9.1 pins mysql2 3.15.3 (GHSA-3f6p-5ww8-9rcr, GHSA-rgwj-5xj2-c3m3). SAMTEC never
# uses MySQL, but we still move it to a patched 3.x release. The version range means
# this override stops applying once Prisma ships a patched mysql2 itself.
overrides:
  "mysql2@<3.23.1": "3.24.4"

# Advisories reviewed and accepted, each with its reason. Remove an entry once it is fixed upstream.
auditConfig:
  ignoreGhsas:
    # deepmerge-ts 7.1.5 (GHSA-ggr8-5vv4-36mx): stack exhaustion when merging recursive objects.
    # Only the Prisma CLI uses it, to merge our own prisma.config.ts, which is neither attacker
    # input nor recursive. The fix is deepmerge-ts 8, a major version that Prisma 7.9.1 pins against.
    - GHSA-ggr8-5vv4-36mx
