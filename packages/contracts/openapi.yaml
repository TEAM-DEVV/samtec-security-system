      description: >-
        **Roles:** ADMIN. Every terminal and kiosk of the company, sorted by
        name, with its health: when it was last seen, how far its clock is
        off, and how often someone tried to sign requests as it with the wrong
        secret. The secret itself is never returned.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of devices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Devices]
      operationId: registerDevice
      summary: Register a clock-in device
      description: >-
        **Roles:** ADMIN. A device belongs to one site for life; to move a
        terminal, register it again. The response carries the device's secret,
        shown **only this once**: it goes into the device (or its gateway) and
        signs every request the device sends. From a kiosk sign-in (Phase 3)
        only a `FACE_KIOSK` can be registered, and it starts `INACTIVE` until an
        ADMIN switches it on from the dashboard, so a kiosk session alone can
        never make a working key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
            examples:
              gate:
                summary: The main gate terminal at Ridge Towers
                value:
                  name: Ridge Towers main gate
                  siteId: 01927c3e-1111-7aaa-8bbb-0c0c0c0c0c01
                  kind: ZKTECO
      responses:
        "201":
          description: The device was registered, with its one-time secret.
          headers:
            Location:
              description: URL of the new device.
              schema:
                type: string
                format: uri-reference
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceWithSecret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /devices/{deviceId}:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    get:
      tags: [Devices]
      operationId: getDevice
      summary: Get one device
      description: "**Roles:** ADMIN."
      responses:
        "200":
          description: The device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Devices]
      operationId: updateDevice
      summary: Rename a device, switch it off, or change its Phase 3 settings
      description: >-
        **Roles:** ADMIN. Send only the fields you want to change. A device is
        never deleted; `INACTIVE` refuses everything it sends from then on.
        Phase 3 adds `serialNumber` (a ZKTeco terminal's serial, which its
        gateway uses) and `passkeysEnabled` (switches on the device's own
        fingerprint sensor; only a `FACE_KIOSK` can have it).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeviceRequest"
      responses:
        "200":
          description: The updated device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /devices/{deviceId}/rotate-secret:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    post:
      tags: [Devices]
      operationId: rotateDeviceSecret
      summary: Give a device a new secret
      description: >-
        **Roles:** ADMIN. The old secret stops working **at once**; there is no
        overlap. The device keeps any batch that was not acknowledged and sends
        it again once it has the new secret, so no punch is lost. The new
        secret is shown only this once. From a kiosk sign-in (Phase 3) only a
        `FACE_KIOSK` can be rotated (for a kiosk that lost its storage), and it
        becomes `INACTIVE` until an ADMIN switches it on again from the
        dashboard. Its fingerprint keys stay, because the device ID stays.
      responses:
        "200":
          description: The device and its new one-time secret.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceWithSecret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /devices/{deviceId}/finger-enrollment-windows:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    post:
      tags: [Devices]
      operationId: openFingerEnrollmentWindow
      summary: Let one worker enroll a finger on this terminal
      description: >-
        **Roles:** ADMIN. Opens a 30-minute window for one worker on one
        `ZKTECO` terminal. A finger the terminal reports inside that window
        becomes that worker's, with the duplicate check recorded as
        `NOT_CHECKED` — this server never sees a terminal's fingerprint
        template, so it cannot compare one. A finger reported outside any
        window is refused and raises `UNEXPECTED_DEVICE_ENROLLMENT`, because
        a terminal must never be able to enroll somebody by itself
        (docs/plan/13 section 5).

        Opening a second window for the same worker on the same terminal
        replaces the first, so an ADMIN who taps twice does not get two.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenFingerEnrollmentWindowRequest"
      responses:
        "201":
          description: The window is open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FingerEnrollmentWindow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The device is not a ZKTeco terminal, or the worker may not be
            enrolled: they are not posted to this device's site, they have
            given no consent, or their record is blocked as a duplicate.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /ingest/punches:
    post:
      tags: [Ingest]
      operationId: ingestPunches
      summary: Send a batch of punches from a device
      description: |
        **Signed by a device, not a user.** Every request carries the three
        `X-Samtec-*` headers described in the `deviceSignature` security
        scheme. User access tokens are not accepted here.

        - **Idempotent.** A punch is identified by its device and its
          `deviceEventId`. Sending it again answers `DUPLICATE` and changes
          nothing. The same `deviceEventId` with different content answers
          `CONFLICT`: it is not stored, and the attempt is audited.
        - **Up to 100 punches per batch.** A `deviceEventId` repeated inside
          one batch is a `400`.
        - **Rate limit:** 60 signed requests per minute per device (`429`
          with `Retry-After`).

        **What an ingest client does with each answer:**
        `200` — every listed item is final (conflicts included): clear the
        batch. `429` — wait `Retry-After` seconds. `401`, `5xx` or no answer —
        keep the batch and send it again unchanged; that is always safe.
        `400` or `413` — a software bug: do not resend the same batch forever.
      security:
        - deviceSignature: []
      parameters:
        - $ref: "#/components/parameters/DeviceHeader"
        - $ref: "#/components/parameters/TimestampHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestPunchesRequest"
            examples:
              morning:
                summary: Two guards clock in at the main gate
                value:
                  deviceClockAt: "2026-09-22T06:02:10Z"
                  punches:
                    - deviceEventId: "4471"
                      deviceUserRef: "42"
                      deviceTime: "2026-09-22T05:58:31Z"
                      direction: IN
                      method: FINGERPRINT
                    - deviceEventId: "4472"
                      deviceUserRef: "17"
                      deviceTime: "2026-09-22T06:01:05Z"
                      direction: IN
                      method: FACE
      responses:
        "200":
          description: The batch was processed; each punch has its own result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestPunchesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/DeviceNotTrusted"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Busy"

  /ingest/heartbeat:
    post:
      tags: [Ingest]
      operationId: sendHeartbeat
      summary: Tell the API a device is alive
      description: >-
        **Signed by a device** (see `ingestPunches`). Marks the device as seen,
        records how far its clock is off (`deviceClockAt`), and lets the API
        notice clock-ins that never got a clock-out. Send one every few
        minutes. The answer carries the server's clock, so the device can
        correct its own.

        The heartbeat also carries the **biometric retention sweep**: once a
        day, the first heartbeat switches off the fingerprint keys of anyone
        past their termination date, and wipes the face templates of anyone
        who left 90 days ago (and of a face that has waited 90 days for a
        duplicate review). The review itself stays open, a record blocked as
        a duplicate stays blocked, and no row is ever deleted. The work is
        done 50 people at a time, so a heartbeat is never slow, and the
        answer is the same either way.
      security:
        - deviceSignature: []
      parameters:
        - $ref: "#/components/parameters/DeviceHeader"
        - $ref: "#/components/parameters/TimestampHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatRequest"
      responses:
        "200":
          description: The heartbeat was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/DeviceNotTrusted"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Busy"

  /ingest/roster:
    post:
      tags: [Ingest]
      operationId: getTerminalRoster
      summary: Who should be on this terminal
      description: >-
        **Signed by a `ZKTECO` device** (route name `ingest/roster`). The
        gateway asks every 5 minutes and compares the answer with the
        terminal's own user list, adding and removing users to match. It is
        safe to repeat and changes nothing on the server, so no command table
        is needed (docs/plan/13 section 5).

        The answer holds everyone posted to this terminal's site who is
        `ACTIVE` or `PENDING_ENROLLMENT`, and **leaves out anyone whose
        biometric record is blocked as a duplicate**, so their fingers come
        off the terminals too. It carries a staff number and a display name
        and nothing else: never a Ghana Card number, never a template.
      security:
        - deviceSignature: []
      parameters:
        - $ref: "#/components/parameters/DeviceHeader"
        - $ref: "#/components/parameters/TimestampHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalRosterRequest"
      responses:
        "200":
          description: Everyone this terminal should know about.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalRosterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/DeviceNotTrusted"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ingest/enrollments:
    post:
      tags: [Ingest]
      operationId: reportTerminalEnrollments
      summary: A terminal reports a finger it enrolled
      description: >-
        **Signed by a `ZKTECO` device** (route name `ingest/enrollments`).
        The gateway sends only *that* user enrolled a finger on *this*
        terminal at *that* time. **The fingerprint template itself is
        discarded by the gateway and never reaches this API**
        (docs/plan/13 section 5).

        A finger reported inside a window an ADMIN opened for that worker
        (`POST /devices/{deviceId}/finger-enrollment-windows`) becomes an
        `ACTIVE` fingerprint credential whose duplicate check is
        `NOT_CHECKED`, because this server cannot compare a terminal's
        templates. **Anything else is refused and raises
        `UNEXPECTED_DEVICE_ENROLLMENT`** — a terminal never activates
        anybody by itself.

        Repeating a report changes nothing: the same terminal, user and
        moment answers `DUPLICATE`.
      security:
        - deviceSignature: []
      parameters:
        - $ref: "#/components/parameters/DeviceHeader"
        - $ref: "#/components/parameters/TimestampHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalEnrollmentsRequest"
      responses:
        "200":
          description: Each report, with what became of it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalEnrollmentsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/DeviceNotTrusted"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Busy"

  /attendance/segments:
    get:
      tags: [Attendance]
      operationId: listWorkSegments
      summary: List worked shifts
      description: >-
        **Roles:** every signed-in role, scoped. ADMIN and HR_PAYROLL see the
        whole company; a SUPERVISOR sees only their own sites; a GUARD sees
        only themselves. A site or employee the caller may not see answers
        `404`. A work segment is one clock-in paired with its clock-out (or a
        shift added by hand when an exception is resolved); its hours belong to the Ghana date
        it started, so a 22:00–06:00 night shift counts on the first day.
        Sorted by start time.
      parameters:
        - name: from
          in: query
          required: true
          description: The first work date, like `2026-09-01`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: The last work date. At most 31 days after `from`.
          schema:
            type: string
            format: date
        - name: siteId
          in: query
          schema:
            type: string
            format: uuid
        - name: employeeId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Only this status. Leave it out for CONFIRMED and DISPUTED together.
          schema:
            $ref: "#/components/schemas/SegmentStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of work segments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSegmentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /attendance/exceptions:
    get:
      tags: [Attendance]
      operationId: listAttendanceExceptions
      summary: The attendance exception queue
      description: >-
        **Roles:** ADMIN, HR_PAYROLL, SUPERVISOR (only exceptions whose every
        site is theirs: an overlap that reaches a site they do not run is for
        an ADMIN). Things a person must look at: a clock-in with no clock-out, a clock-out with
        no clock-in, a user number that matches nobody, a punch from someone
        who may not clock in, and one person on two shifts at once. Newest
        first. Each item lists the actions the caller may take on it.
      parameters:
        - name: status
          in: query
          description: Defaults to OPEN.
          schema:
            $ref: "#/components/schemas/AttendanceExceptionStatus"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/AttendanceExceptionType"
        - name: siteId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of exceptions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceExceptionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /attendance/exceptions/{exceptionId}:
    parameters:
      - $ref: "#/components/parameters/ExceptionId"
    get:
      tags: [Attendance]
      operationId: getAttendanceException
      summary: Get one exception with its evidence
      description: "**Roles:** ADMIN, HR_PAYROLL, SUPERVISOR (only when every site it touches is theirs; others answer `404`)."
      responses:
        "200":
          description: The exception.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceException"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /attendance/exceptions/{exceptionId}/resolve:
    parameters:
      - $ref: "#/components/parameters/ExceptionId"
    post:
      tags: [Attendance]
      operationId: resolveAttendanceException
      summary: Resolve an exception
      description: |
        **Roles:** ADMIN for any site; SUPERVISOR for their own sites (both
        sites, for an overlap; otherwise they cannot see it). HR_PAYROLL may read the queue but never
        resolve it: the people who run payroll must not also create hours.
        **Nobody resolves an exception about their own attendance** (`403`).

        Every resolution needs a `note` (3–500 characters) and is audited.
        The allowed actions depend on the type (see `allowedActions`):

        - `DISMISS` — checked, nothing to change.
        - `ADD_SEGMENT` (missing clock-in or clock-out) — records the shift
          by hand. The window must contain the real punch's time, be at most
          16 hours long and end in the past, so hours are only ever
          completed around real biometric evidence. Hours that would overlap
          another live (counted or disputed) shift of the same person answer
          `409`.
        - `KEEP_SEGMENT` (overlap) — keeps one of the two shifts and voids
          the other.
        - `VOID_ALL` (overlap) — voids both shifts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveExceptionRequest"
            examples:
              addSegment:
                summary: A guard forgot to clock out after a night shift
                value:
                  action: ADD_SEGMENT
                  startedAt: "2026-09-21T22:01:00Z"
                  endedAt: "2026-09-22T06:00:00Z"
                  note: Relief guard confirms the handover at 06:00.
      responses:
        "200":
          description: The resolved exception.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceException"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Busy"

  /kiosk/identify:
    post:
      tags: [Kiosk]
      operationId: kioskIdentify
      summary: Find who is in front of the kiosk camera
      description: |
        **Signed by a `FACE_KIOSK` device** (route name `kiosk/identify`); any
        other kind of device answers `401`. The kiosk sends one face
        sample taken after its liveness challenge (a random head turn). The
        server checks the anti-spoofing scores again and compares the face
        with every enrolled face in the company.

        - `MATCHED`: the best match is at least the threshold **and** clearly
          ahead of the next person. The kiosk shows the name for 2 seconds
          ("Not me" calls `POST /kiosk/not-me`), then calls
          `POST /kiosk/confirm`.
        - `AMBIGUOUS`, `NOT_RECOGNISED`, `LOW_LIVENESS`: nothing is recorded
          except the attempt; try again. Enough failures unlock the
          fallbacks: `POST /kiosk/fingerprint-options` (its description has
          the exact rule) or a supervisor's co-sign.

        No punch is made here. The answer never contains a score, so it
        cannot be used to probe the stored faces. `purpose: CO_SIGN` is a
        site supervisor confirming one named worker (their staff number is
        in the request) who cannot use the face path. The answer names the
        supervisor. The staff number is only recorded here, never checked,
        so this answer cannot reveal who works where; `POST
        /kiosk/assisted-punches` checks it. When the supervisor has a
        fingerprint key on this device, the answer carries a challenge and
        the co-sign needs the supervisor's finger too.
      security:
        - deviceSignature: []
      parameters:
        - $ref: "#/components/parameters/DeviceHeader"
        - $ref: "#/components/parameters/TimestampHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KioskIdentifyRequest"
      responses:
        "200":
          description: The outcome of this attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskIdentifyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/DeviceNotTrusted"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Busy"

  /kiosk/confirm:
    post:
      tags: [Kiosk]
      operationId: kioskConfirm
      summary: Record the clock-in or clock-out of an identified worker
      description: |
        **Signed by the same `FACE_KIOSK` device** that made the attempt
        (route name `kiosk/confirm`). The attempt must be a `CLOCK` attempt
        that is `MATCHED`, or a fingerprint attempt from
        `POST /kiosk/fingerprint-options` (never a co-sign), and at most 60
        seconds old. When the attempt asked for a fingerprint, the
        `assertion` from the device's built-in sensor is required and must
        come from that worker's passkey on this device.

        The punch goes through the same rules as every other punch (it is
        stored once, paired into shifts, and checked). The server chooses
        the method: `FACE`, `FACE_PASSKEY` (face, then fingerprint) or
        `STAFF_PASSKEY` (staff number, then fingerprint; flagged). The time
        is the server's time of the attempt, so a kiosk cannot backdate.
        Sending the same confirmation again answers `DUPLICATE`.
      security:
        - deviceSignature: []
      parameters:
        - $ref: "#/components/parameters/DeviceHeader"
        - $ref: "#/components/parameters/TimestampHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KioskConfirmRequest"
      responses:
        "200":
          description: The punch was recorded (or had been already).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskPunchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/DeviceNotTrusted"
        "409":
          description: >-
            The attempt cannot be confirmed: it is not a match, it is a
            co-sign, it belongs to another device, it is older than 60
            seconds, the worker pressed "Not me", or its fingerprint check
            failed. Start again.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Busy"

  /kiosk/not-me:
    post:
      tags: [Kiosk]
      operationId: kioskNotMe
      summary: The worker says the kiosk named the wrong person
      description: >-
        **Signed by the same `FACE_KIOSK` device** that made the attempt
        (route name `kiosk/not-me`). Records a `NOT_ME` attempt: the matched
        attempt can no longer be confirmed, it counts as a failed attempt,
        and the pilot uses these counts to tune the face thresholds.
      security:
        - deviceSignature: []
      parameters:
        - $ref: "#/components/parameters/DeviceHeader"
        - $ref: "#/components/parameters/TimestampHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KioskNotMeRequest"
      responses:
        "204":
          description: Recorded. The kiosk starts again.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/DeviceNotTrusted"
        "409":
          description: >-
            The attempt cannot be cancelled: it is not a match from this
            device in the last 60 seconds, or it was already confirmed or
            cancelled.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /kiosk/fingerprint-options:
    post:
      tags: [Kiosk]
      operationId: kioskFingerprintOptions
      summary: Fall back to staff number plus fingerprint
      description: >-
        **Signed by a `FACE_KIOSK` device** (route name
        `kiosk/fingerprint-options`).

        - **Unlocked** when the 3 newest `CLOCK` attempts on this device
          since its last fallback all failed (`AMBIGUOUS`, `NOT_RECOGNISED`,
          `LOW_LIVENESS` or `NOT_ME`), the newest under 2 minutes old. A match
          cancelled with "Not me" is skipped, so the pair counts as one
          failure. A fallback is any `STAFF_PASSKEY` attempt, or a co-sign
          that made a punch.
        - **Every call uses up the unlock**, whatever the answer, and is
          recorded as a `STAFF_PASSKEY` attempt with the staff number tried
          (`FALLBACK_REFUSED` when it is refused). So one unlock can never be
          used to try staff numbers one after another.
        - It works only on a device with fingerprints switched on, for an
          ACTIVE worker posted to this site who has a passkey on it. The answer carries the challenge for the
        device's fingerprint sensor; send the result to `POST /kiosk/confirm`. The punch is marked
        `STAFF_PASSKEY` and counted by the ghost rules, because any finger
        saved on the device can unlock any worker's key.
      security:
        - deviceSignature: []
      parameters:
        - $ref: "#/components/parameters/DeviceHeader"
        - $ref: "#/components/parameters/TimestampHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KioskFingerprintOptionsRequest"
      responses:
        "200":
          description: A fingerprint attempt, waiting for the sensor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskFingerprintOptionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/DeviceNotTrusted"
        "409":
          description: >-
            The fallback is not available. Every reason (not unlocked,
            fingerprints off, an unknown staff number, a worker with no
            passkey here or not posted here) gets this same answer, so the
            kiosk cannot be used to learn who works where.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /kiosk/assisted-punches:
    post:
      tags: [Kiosk]
      operationId: kioskAssistedPunch
      summary: Record a punch confirmed by a site supervisor's face
      description: >-
        **Signed by a `FACE_KIOSK` device** (route name
        `kiosk/assisted-punches`). For a worker who is exempt from
        biometrics (an `APPROVED` exemption, which a second ADMIN always
        decided: they go straight to "Ask your supervisor", with no face
        scan); a worker whose withdrawal of consent is waiting for that
        decision (still `PENDING_ENROLLMENT`: the punch is stored and paired
        but raises `INACTIVE_EMPLOYEE`, and is paid only after approval); or
        a worker with a face in use (`ACTIVE`) whose face failed on this
        device (the same unlock as `POST /kiosk/fingerprint-options`, which a
        co-sign uses up). The worker types their staff number; a SUPERVISOR who is ACTIVE, posted to this device's
        site and not the worker themselves passes `POST /kiosk/identify`
        with `purpose: CO_SIGN`, that staff number and the direction, on
        **this same device**, at most 60 seconds earlier. When that identify
        asked for the supervisor's finger, `assertion` is required. The
        worker must be ACTIVE (or waiting for a withdrawal's decision) and
        posted to this site. **A co-sign is used up
        by its first punch:** the punch's ID comes from the co-sign attempt,
        so sending it again answers `DUPLICATE` and can never make a second
        punch. The punch is marked
        `PIN_FALLBACK`, the reason is audited, and the ghost rules count
        these per worker and per supervisor.
      security:
        - deviceSignature: []
      parameters:
        - $ref: "#/components/parameters/DeviceHeader"
        - $ref: "#/components/parameters/TimestampHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KioskAssistedPunchRequest"
      responses:
        "200":
          description: The punch was recorded (or had been already).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskPunchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/DeviceNotTrusted"
        "409":
          description: >-
            The co-sign cannot be used. Every reason gets this same answer, so
            the kiosk cannot reveal who works where: it is not a matched
            `CO_SIGN` attempt from this device in the last 60 seconds, the
            supervisor's finger is missing or wrong, it names the supervisor
            themselves, the staff number is unknown or not posted here, or the
            worker is neither exempt, nor waiting for a withdrawal's decision,
            nor ACTIVE with a face in use and unlocked by failed face attempts.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Busy"

  /kiosk/consents:
    post:
      tags: [Kiosk]
      operationId: kioskRecordConsent
      summary: Record a worker's consent before enrollment
      description: >-
        **An ADMIN on a `FACE_KIOSK` device:** needs both a kiosk sign-in's
        access token (a dashboard token answers `401`, like a missing
        signature) and the device's
        signature (route name `kiosk/consents`). The same holds for every
        kiosk ADMIN operation. The
        worker reads the consent text from `GET /biometrics/consent-text` on
        the kiosk and taps "I agree". The ADMIN first checks the worker's
        physical Ghana Card: the last 4 digits must match the employee
        record (a wrong answer is a `400` on `ghanaCardLast4` and is
        audited). After 5 wrong answers in a row for one worker within an
        hour, that worker waits an hour (`429`); a right answer clears the
        count. The full number never
        reaches the kiosk. This check catches mistakes (the wrong person in
        front of the kiosk); it cannot stop a dishonest ADMIN, who can read
        the full number on the dashboard, which is why every enrollment is
        audited and checked for duplicates. Consent must be freely given; a
        worker who refuses can be exempted instead.

        If the worker already has a current consent to this text version (for
        example when enrolling again), the card check still runs and the
        answer is `200` with that consent, so every enrollment starts with
        the card.
      security:
        - bearerAuth: []
          deviceSignature: []
      parameters:
        - $ref: "#/components/parameters/DeviceHeader"
        - $ref: "#/components/parameters/TimestampHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordConsentRequest"
      responses:
        "200":
          description: The worker's current consent to this version, already recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiometricConsent"
        "201":
          description: The consent is recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiometricConsent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The device signature or the ADMIN's access token is missing or not valid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The employee is terminated, or has an open question that a second
            ADMIN must settle first: an open duplicate-enrollment review, an
            exemption request waiting, or a face blocked as a duplicate. A
            worker who withdrew may consent again.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /kiosk/face-enrollments:
    post:
      tags: [Kiosk]
      operationId: kioskEnrollFace
      summary: Enroll a worker's face, with the duplicate check
      description: |
        **An ADMIN on a `FACE_KIOSK` device** (token and signature, route name
        `kiosk/face-enrollments`). Needs the worker's current consent
        (otherwise `409`). The kiosk sends three samples taken half a
        second apart after a head-turn challenge; each must look real and
        live, and the three must be the same face.

        A worker has **one face at a time**. Enrolling again replaces it: the
        old face is wiped, and an `ACTIVE` worker goes back to
        `PENDING_ENROLLMENT` until the new face passes.

        **Duplicate check:** the new face is compared with every other
        enrolled face in the company, whatever its status. A likely match is
        a `COLLISION`: the worker stays `PENDING_ENROLLMENT` and a
        *different* ADMIN reviews it (`/biometric-collisions`). Otherwise
        the face is `PASSED`. A `PASSED` face activates only a worker who is
        `PENDING_ENROLLMENT` (a `SUSPENDED` worker stays suspended), and it
        ends any exemption. No image is ever stored: only the numbers,
        encrypted.
      security:
        - bearerAuth: []
          deviceSignature: []
      parameters:
        - $ref: "#/components/parameters/DeviceHeader"
        - $ref: "#/components/parameters/TimestampHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollFaceRequest"
      responses:
        "201":
          description: The face is stored, with the result of the duplicate check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaceEnrollmentResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The device signature or the ADMIN's access token is missing or not valid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            No current consent, the employee is terminated, or the worker has
            an open question that a second ADMIN must settle first (an open
            duplicate-enrollment review, an exemption request waiting, or a
            face blocked as a duplicate). So nobody can retry captures until
            a score slips under the threshold.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Busy"

  /kiosk/passkey-options:
    post:
      tags: [Kiosk]
      operationId: kioskPasskeyOptions
      summary: Start saving a worker's fingerprint on this device
      description: >-
        **An ADMIN on a `FACE_KIOSK` device with fingerprints switched on**
        (token and signature, route name `kiosk/passkey-options`). The
        worker's face must be enrolled first, and their finger must already
        be saved in the device's own settings. The answer carries the
        options for the device's built-in sensor (WebAuthn) and a sealed
        ticket; send both results to `POST /kiosk/passkeys` within 2
        minutes. The device keeps a key that only an enrolled finger can
        unlock; SAMTEC keeps only the public half, never a fingerprint.
      security:
        - bearerAuth: []
          deviceSignature: []
      parameters:
        - $ref: "#/components/parameters/DeviceHeader"
        - $ref: "#/components/parameters/TimestampHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyOptionsRequest"
      responses:
        "200":
          description: Options for the device's fingerprint sensor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyOptionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The device signature or the ADMIN's access token is missing or not valid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Fingerprints are off on this device, or the worker has no face in use (`ACTIVE`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /kiosk/passkeys:
    post:
      tags: [Kiosk]
      operationId: kioskRegisterPasskey
      summary: Save the worker's fingerprint key on this device
      description: >-
        **An ADMIN on a `FACE_KIOSK` device** (token and signature, route
        name `kiosk/passkeys`). Checks the ticket, the origin, that the key
        lives on this device itself (not a phone or security key held
        nearby) and that the finger was verified. It replaces any earlier
        key of this worker on this device. `synced` says whether the device
        may copy the key to its cloud account, which the report must
        mention. The key's user name is the staff number only and its user
        ID is a random value, because a synced key can appear in the
        kiosk's cloud account. Without attestation, "on this device itself"
        is what the browser reports: a safety net, not a proof.
      security:
        - bearerAuth: []
          deviceSignature: []
      parameters:
        - $ref: "#/components/parameters/DeviceHeader"
        - $ref: "#/components/parameters/TimestampHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPasskeyRequest"
      responses:
        "201":
          description: The key is saved for this worker on this device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePasskey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The device signature or the ADMIN's access token is missing or not valid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The ticket has expired or was already used. Start again.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /biometrics/consent-text:
    get:
      tags: [Biometrics]
      operationId: getBiometricConsentText
      summary: The consent text a worker reads before enrollment
      description: >-
        **Roles:** every signed-in role. The one official wording, so the
        kiosk and the dashboard always show the same words. Its `version`
        and `sha256` are what a consent record points to.
      responses:
        "200":
          description: The current consent text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiometricConsentText"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /employees/{employeeId}/biometrics:
    parameters:
      - $ref: "#/components/parameters/EmployeeId"
    get:
      tags: [Biometrics]
      operationId: getEmployeeBiometrics
      summary: An employee's biometric status
      description: >-
        **Roles:** ADMIN, HR_PAYROLL, SUPERVISOR (own sites only; others answer
        `404`). Status only: consent, the face's state and duplicate-check
        result, the fingerprint keys by device, and any exemption. Never a
        template, an embedding or a score.
      responses:
        "200":
          description: The employee's biometric status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeBiometrics"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /employees/{employeeId}/biometrics/revoke:
    parameters:
      - $ref: "#/components/parameters/EmployeeId"
    post:
      tags: [Biometrics]
      operationId: revokeEmployeeBiometrics
      summary: Delete an employee's face and fingerprint keys
      description: >-
        **Roles:** ADMIN. Wipes the stored face at once and switches off every
        fingerprint key, for example after a wrong enrollment. The employee
        goes back to `PENDING_ENROLLMENT` if they were `ACTIVE` (a
        `SUSPENDED` or `TERMINATED` employee is unchanged) and must be
        enrolled again. It also ends an approved exemption, so a worker who
        was `ACTIVE` only through an exemption needs two ADMINs again.
        Refused while the worker has an open question: an open
        duplicate-enrollment review, or an exemption request waiting (a
        second ADMIN decides either first, so a revoke can never wipe away a
        question), and for a record blocked as a duplicate (that block is
        final).
        Audited with the reason; the history rows stay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BiometricReasonRequest"
      responses:
        "200":
          description: The new status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeBiometrics"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The worker has an open duplicate-enrollment review or an exemption
            request waiting (decide it first), or the record is blocked as a
            duplicate.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /employees/{employeeId}/biometric-exemption:
    parameters:
      - $ref: "#/components/parameters/EmployeeId"
    post:
      tags: [Biometrics]
      operationId: requestBiometricExemption
      summary: Ask for a worker who refuses biometrics to work without them
      description: >-
        **Roles:** ADMIN. Consent must be a free choice, so a worker may
        refuse. Only for a worker still `PENDING_ENROLLMENT` with no open
        question (no open duplicate-enrollment review, no enrolled face, and
        no face blocked as a duplicate). This only **asks**: a second ADMIN
        checks the worker's Ghana Card in person and approves or rejects it
        (`POST /employees/{employeeId}/biometric-exemption/review`), so no
        single person can activate a worker without a face. While the
        request waits, consent and enrollment are refused. Once approved,
        the worker is `ACTIVE` and clocks in only with a supervisor's
        co-sign (`PIN_FALLBACK`), so every hour they work is flagged for
        review. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestExemptionRequest"
      responses:
        "200":
          description: The new status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeBiometrics"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The employee is not waiting for enrollment, has an open question
            (a review, an enrolled face, or a face blocked as a duplicate), or
            already has an exemption waiting or approved.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /employees/{employeeId}/biometric-exemption/review:
    parameters:
      - $ref: "#/components/parameters/EmployeeId"
    post:
      tags: [Biometrics]
      operationId: reviewBiometricExemption
      summary: Approve or reject a request to work without biometrics
      description: >-
        **Roles:** ADMIN, but never the one who asked (for `CONSENT_WITHDRAWN`,
        whoever recorded the withdrawal), anyone who enrolled a face for this
        worker, or anyone who revoked or withdrew one (`403`). Check the worker's Ghana
        Card in person first. `APPROVE` checks the rules again: the worker
        must still be `PENDING_ENROLLMENT` with no open question (`409`
        otherwise), and it makes the worker `ACTIVE`. `REJECT` is always
        possible while a request waits, and leaves the worker
        `PENDING_ENROLLMENT` (they can then be enrolled, or asked for again).
        A note is required, and the decision is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewExemptionRequest"
      responses:
        "200":
          description: The new status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeBiometrics"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            There is no request waiting, or (for `APPROVE`) the worker no
            longer qualifies: not `PENDING_ENROLLMENT`, or an open question
            has appeared.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /employees/{employeeId}/biometric-consents/withdraw:
    parameters:
      - $ref: "#/components/parameters/EmployeeId"
    post:
      tags: [Biometrics]
      operationId: withdrawBiometricConsent
      summary: Record that a worker withdrew their consent
      description: |
        **Roles:** ADMIN. Wipes the face and switches off the fingerprint keys
        at once, as the law requires. It never activates anyone.

        - If the face was `ACTIVE` and the worker is `ACTIVE`, the worker goes
          back to `PENDING_ENROLLMENT` and the API **files** an exemption
          request for them (`CONSENT_WITHDRAWN`). The ADMIN who recorded the
          withdrawal is its asker, so a **different** ADMIN decides it
          (`POST /employees/{employeeId}/biometric-exemption/review`): every
          exemption takes two ADMIN accounts. Once it is approved, the worker
          is `ACTIVE` again and clocks in by co-sign.
        - While the request waits, the worker can still clock in by a
          supervisor's co-sign. Those punches are stored and paired, but they
          raise `INACTIVE_EMPLOYEE` like any punch of a worker waiting for
          enrollment, and payroll counts them only once a second ADMIN has
          approved. So the worker's presence is on record from the first day,
          and nothing is paid on one person's say-so: a wiped face is no
          longer in the duplicate check, so only a second person may vouch for
          it.
        - An exemption already approved is kept. Any other face (waiting for
          review, or blocked as a duplicate) gives no request. An open
          duplicate-enrollment review **stays open**: a second ADMIN still
          decides it from the Ghana Cards and the record of who the face
          looked like. A face blocked as a duplicate **stays blocked**.

        Audited; the consent history stays, and the worker may consent again
        later, unless the record is blocked as a duplicate. HR may take the
        worker's written request, but an ADMIN records it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BiometricReasonRequest"
      responses:
        "200":
          description: The new status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeBiometrics"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: There is no consent to withdraw.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /biometric-collisions:
    get:
      tags: [Biometrics]
      operationId: listBiometricCollisions
      summary: Faces that look like someone already enrolled
      description: >-
        **Roles:** ADMIN. The duplicate-enrollment queue: each item is a new
        face that looked like another employee's face (a possible ghost
        worker enrolled twice). Newest first.
      parameters:
        - name: status
          in: query
          description: Defaults to OPEN.
          schema:
            $ref: "#/components/schemas/CollisionStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of collisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiometricCollisionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /biometric-collisions/{credentialId}/resolve:
    parameters:
      - $ref: "#/components/parameters/CredentialId"
    post:
      tags: [Biometrics]
      operationId: resolveBiometricCollision
      summary: Decide whether two faces are the same person
      description: |
        **Roles:** ADMIN, but never the ADMIN who enrolled this face, nor
        anyone who revoked or withdrew a face of either record (`403`). Wiping
        a face is the step an insider needs in order to reuse it, and it is
        rare in normal work, so this rule seldom leaves nobody to decide.
        Other links (the decider created a record, or enrolled the other
        face) are allowed but flagged by the ghost rules (R11) for the
        payroll checker. Check both people's Ghana Cards in person first.

        - `DIFFERENT_PEOPLE`: two people who look alike. The new face is
          cleared.
        - `SAME_PERSON`: one person with two records. `keepEmployeeId` names
          the record that belongs to the person whose card you checked. If you
          keep the new record, its face is cleared. The **other record is
          blocked**:
          - its face is wiped (`BLOCKED`) and its fingerprint keys are revoked;
          - any exemption ends;
          - an `ACTIVE` employee goes back to `PENDING_ENROLLMENT`.

          The decision is final: the blocked record can only be terminated, so
          consent, enrollment and exemption are refused for it.

        A cleared face activates the worker only if they are
        `PENDING_ENROLLMENT`, and only if the face was not wiped in the
        meantime (a worker who withdrew consent is then free to enroll again
        or ask for an exemption). A note is required, and everything is
        audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveCollisionRequest"
      responses:
        "200":
          description: The resolved collision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiometricCollision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This collision has already been decided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /attendance/punches:
    get:
      tags: [Attendance]
      operationId: listPunches
      summary: The live list of clock-ins and clock-outs
      description: >-
        **Roles:** ADMIN, HR_PAYROLL, SUPERVISOR (own sites only; others answer
        `404`). Every punch from every device, newest first by the time the
        API received it, with its method, so the dashboard can show a live
        board (refresh every few seconds). Flagged methods (`STAFF_PASSKEY`,
        `PIN_FALLBACK`) deserve a different colour.
      parameters:
        - name: siteId
          in: query
          schema:
            type: string
            format: uuid
        - name: since
          in: query
          description: Only punches received at or after this moment.
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of punches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunchFeedList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /attendance/clock-in-attempts:
    get:
      tags: [Attendance]
      operationId: listClockInAttempts
      summary: Every face and fingerprint attempt at the kiosks
      description: >-
        **Roles:** ADMIN. Successes and failures, newest first, so an ADMIN can
        see a kiosk that keeps failing, or someone trying face after face.
        Never a score or an embedding.
      parameters:
        - name: deviceId
          in: query
          schema:
            type: string
            format: uuid
        - name: outcome
          in: query
          schema:
            $ref: "#/components/schemas/AttemptOutcome"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClockInAttemptList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # --- Payroll (Phase 4) --- Samuel adds /payroll paths here, and nowhere else.

  /payroll/periods:
    get:
      tags: [Payroll]
      operationId: listPayrollPeriods
      summary: List payroll months
      description: >-
        **Roles:** ADMIN, HR_PAYROLL. A SUPERVISOR sees no payroll at all
        (`403`), and so does a GUARD, who may read only their own payslips. A
        payroll period is one calendar month: `year` and `month` name it, and
        `startDate` and `endDate` are its first and last day, worked out by the
        API. Newest month first. Filter by `status` to find the months still
        `OPEN`, or by `year` for one year.
      parameters:
        - name: status
          in: query
          description: Only months with this status. Leave it out for every month.
          schema:
            $ref: "#/components/schemas/PayrollPeriodStatus"
        - name: year
          in: query
          description: Only months in this calendar year, like `2026`.
          schema:
            type: integer
            minimum: 2020
            maximum: 2100
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of payroll months.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollPeriodList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Payroll]
      operationId: createPayrollPeriod
      summary: Open a payroll month
      description: >-
        **Roles:** ADMIN, HR_PAYROLL. A SUPERVISOR sees no payroll at all
        (`403`), and so does a GUARD. Opens the month that payroll runs are
        calculated for. Send only the `year` and the `month`; the API works out
        `startDate` and `endDate` itself, so a period is always exactly one
        whole calendar month and nobody can open half a month by hand. A new
        period starts `OPEN`. There is only ever one period per month: a month
        that already has one answers `409`. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePayrollPeriodRequest"
            examples:
              september2026:
                summary: Open September 2026
                value:
                  year: 2026
                  month: 9
      responses:
        "201":
          description: The payroll month was opened.
          headers:
            Location:
              description: URL of the payroll periods list.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollPeriod"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /payroll/periods/{periodId}/close:
    parameters:
      - $ref: "#/components/parameters/PayrollPeriodId"
    post:
      tags: [Payroll]
      operationId: closePayrollPeriod
      summary: Close a payroll month
      description: >-
        **Roles:** ADMIN, HR_PAYROLL. A SUPERVISOR sees no payroll at all
        (`403`), and so does a GUARD. Marks the month finished. The period moves
        `OPEN` to `CLOSED` and never goes back, and the API records who closed
        it and when, together. Afterwards no new run may be calculated for the
        month, and a draft still sitting in it can no longer be submitted,
        approved or rejected; a run that is already `LOCKED` may still be marked
        paid and its bank file downloaded, because the money often leaves after
        month end. A correction for a closed month becomes an adjustment line on
        the next month's run. Closing a period changes nothing in attendance:
        punches, work segments and the exception queue carry on exactly as
        before, because a run is a snapshot of what it read. A period that is
        already `CLOSED` answers `409`. Audited.
      responses:
        "200":
          description: The period, now `CLOSED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollPeriod"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /payroll/runs:
    get:
      tags: [Payroll]
      operationId: listPayrollRuns
      summary: List payroll runs
      description: >-
        **Roles:** ADMIN, HR_PAYROLL. A SUPERVISOR sees no payroll at all
        (`403`), and so does a GUARD. Every run of the company, newest first.
        Each one carries its totals, its summary and the full evidence of every
        status it has been through. A period may hold several runs, drafts and
        rejected ones, but only ever one that is `LOCKED` or `PAID`. Narrow the
        list with `periodId` and `status`. No bank or mobile money details
        appear here; they exist only inside a run's bank export.
      parameters:
        - name: periodId
          in: query
          description: Only runs for this payroll period.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Only runs in this status. Leave it out for every status.
          schema:
            $ref: "#/components/schemas/PayrollRunStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of payroll runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRunList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Payroll]
      operationId: createPayrollRun
      summary: Calculate a draft payroll run
      description: >-
        **Roles:** ADMIN, HR_PAYROLL, and **the caller becomes the maker**, so
        they may never approve this run. A SUPERVISOR sees no payroll at all
        (`403`), and so does a GUARD. Calculates a new `DRAFT` run for an `OPEN`
        period from the work segments and pay terms visible right now, and
        copies every input into its lines. Everyone employed for at least one
        day of the period who has pay terms effective by its last day gets a
        line, `PENDING_ENROLLMENT` workers included: being employed and being
        enrolled in biometrics are different things. A `SUSPENDED` worker, and
        anyone with no pay terms yet, is left off and listed in
        `summary.excluded` with the reason, so nobody is silently dropped. Only
        `CONFIRMED` work segments are paid, and a segment belongs to the period
        its work date falls in, so a night shift that starts on the last day of
        the month is paid in the month it started. Calculating again makes
        **another** draft. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePayrollRunRequest"
            examples:
              calculateSeptember2026:
                summary: Calculate September 2026
                value:
                  periodId: 01927c3e-9f00-7abc-8def-0000000000a1
      responses:
        "201":
          description: The draft run was calculated.
          headers:
            Location:
              description: URL of the new run.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /payroll/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/PayrollRunId"
    get:
      tags: [Payroll]
      operationId: getPayrollRun
      summary: Get one payroll run
      description: >-
        **Roles:** ADMIN, HR_PAYROLL. A SUPERVISOR sees no payroll at all
        (`403`), and so does a GUARD. One run with its totals, its summary and
        the full evidence of every status it has been through: who calculated
        it, who submitted it and when, who approved or rejected it and why, and
        who recorded the payment. The workers deliberately left off the run are
        in `summary.excluded`. A run of another company answers `404`.
      responses:
        "200":
          description: The payroll run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /payroll/runs/{runId}/lines:
    parameters:
      - $ref: "#/components/parameters/PayrollRunId"
    get:
      tags: [Payroll]
      operationId: listPayrollLines
      summary: List the lines of a payroll run
      description: >-
        **Roles:** ADMIN, HR_PAYROLL. A SUPERVISOR sees no payroll at all
        (`403`), and so does a GUARD, who reads their own payslip instead. One
        page of the run's lines, sorted by staff number, with an employee's
        adjustment lines after their ordinary line. Every line copies each input
        it was calculated from, so a locked run can be re-checked years later
        without reading anything else. Bank and mobile money details are never
        on a line; they appear only in the bank export. Filter to one person
        with `employeeId`.
      parameters:
        - name: employeeId
          in: query
          description: Only this employee's lines on this run.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of payroll lines.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollLineList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /payroll/runs/{runId}/submit:
    parameters:
      - $ref: "#/components/parameters/PayrollRunId"
    post:
      tags: [Payroll]
      operationId: submitPayrollRun
      summary: Submit a draft run for approval
      description: >-
        **Roles:** ADMIN or HR_PAYROLL, but only **the maker**, the person who
        calculated this run; anybody else answers `403`. A SUPERVISOR sees no
        payroll at all (`403`), and so does a GUARD. Moves a `DRAFT` run to
        `PENDING_APPROVAL` and records the submitter and the time together. From
        Phase 5, detection rule R3 will refuse a submission whose paid hours and
        punched hours disagree without explanation; version 1 records
        `punchedMinutes` and `scheduledMinutes` on every line as the evidence a
        checker needs, and lets the submission through. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitPayrollRunRequest"
            examples:
              withANote:
                summary: Submit, telling the checker what to look at
                value:
                  note: Three guards have overtime this month; the Tema post was short-staffed.
              noNote:
                summary: Submit with nothing to add
                value: {}
      responses:
        "200":
          description: The run, now waiting for approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /payroll/runs/{runId}/approve:
    parameters:
      - $ref: "#/components/parameters/PayrollRunId"
    post:
      tags: [Payroll]
      operationId: approvePayrollRun
      summary: Approve a run and lock it
      description: >-
        **Roles:** ADMIN, but **never the person who submitted it** (`403`): the
        maker is never the checker, and the same rule is a `CHECK` in the
        database. HR_PAYROLL, SUPERVISOR and GUARD may never approve (`403`). An
        ADMIN may prepare a run, and then a different ADMIN must approve it.
        Moves a `PENDING_APPROVAL` run to `LOCKED`, records the approver and the
        time together, and generates one payslip PDF for every line in the same
        transaction, so what was sent is exactly what exists. A locked run can
        never be changed again: a database trigger refuses every update and
        delete on it and on its lines, and a correction becomes an adjustment
        line on the next period's run. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovePayrollRunRequest"
            examples:
              withANote:
                summary: Approve, recording what was checked
                value:
                  note: Checked every overtime line against the exception queue.
              noNote:
                summary: Approve with nothing to add
                value: {}
      responses:
        "200":
          description: The run, now locked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /payroll/runs/{runId}/reject:
    parameters:
      - $ref: "#/components/parameters/PayrollRunId"
    post:
      tags: [Payroll]
      operationId: rejectPayrollRun
      summary: Reject a run with a reason
      description: >-
        **Roles:** ADMIN, but **never the person who submitted it** (`403`).
        HR_PAYROLL, SUPERVISOR and GUARD may never reject (`403`). Moves a
        `PENDING_APPROVAL` run to `REJECTED` and records the checker, the time
        and the reason they gave. `REJECTED` is terminal and nothing ever moves
        backwards: the maker fixes the cause, such as a wrong pay term or a
        missing clock-out still sitting in the exception queue, and calculates a
        **new** run. The rejected run stays for the record and is never deleted.
        Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectPayrollRunRequest"
            examples:
              aWrongOvertimeRate:
                summary: Send it back to the maker
                value:
                  reason: SMT-00042 is on the old overtime rate. Fix the pay terms and calculate again.
      responses:
        "200":
          description: The run, now rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /payroll/runs/{runId}/mark-paid:
    parameters:
      - $ref: "#/components/parameters/PayrollRunId"
    post:
      tags: [Payroll]
      operationId: markPayrollRunPaid
      summary: Record that a locked run has been paid
      description: >-
        **Roles:** ADMIN. HR_PAYROLL, SUPERVISOR and GUARD may never mark a run
        paid (`403`). Moves a `LOCKED` run to `PAID` after the bank file has
        been sent, recording who marked it, when, the day the money actually
        left and the bank's reference. No second person is required here,
        because the money has already gone: the control that matters is the
        approval before it. Nothing about the run or its lines changes, and it
        works after the period has been closed. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkPayrollRunPaidRequest"
            examples:
              paidByBankTransfer:
                summary: Paid on the last working day
                value:
                  paidOn: "2026-09-28"
                  paymentReference: GCB-TRF-2026-09-0042
                  note: One transfer for the whole run.
      responses:
        "200":
          description: The run, now marked paid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /payroll/runs/{runId}/bank-export:
    parameters:
      - $ref: "#/components/parameters/PayrollRunId"
    get:
      tags: [Payroll]
      operationId: downloadPayrollRunBankExport
      summary: Download the bank transfer file
      description: >-
        **Roles:** ADMIN, HR_PAYROLL. A SUPERVISOR sees no payroll at all
        (`403`), and so does a GUARD; this file carries account numbers and must
        never reach either. Downloads the bank transfer file for a `LOCKED` or
        `PAID` run as **`text/csv`**, one of only two answers in this contract
        that are not JSON. One row per employee, sorted by staff number,
        carrying their net pay summed across every line of the run so a person
        is paid once, and their bank or mobile money details. A run that has not
        been approved has no bank file (`409`): the file exists only after a
        checker has signed it off. Rows totalling zero or less are left out,
        because a bank file cannot take a negative payment; that money is
        recovered by an adjustment line in a later run, and the line and the
        payslip still show it. An employee whose payment details are missing
        still gets a row with the bank columns empty, so the payroll officer can
        see who to chase.

        **Every cell is quoted and escaped as RFC 4180 says**: the value is
        wrapped in double quotes and any double quote inside it is doubled, so
        a name or an account holder containing a comma, a quote or a line break
        can never break a row apart or add one. A cell whose value begins with
        `=`, `+`, `-`, `@`, a tab or a carriage return is written with a
        leading apostrophe, so a spreadsheet treats it as text instead of
        running it as a formula.

        The last column, `details_changed_after_approval`, is `yes` when that
        employee's bank or mobile money details were changed **after** the run
        was approved. The approval covers what each worker is owed, not where
        it is sent, so whoever uploads this file can see at a glance that a
        destination moved after the checker signed it off, and stop.

        The answer is never cached, and no account number is ever written to a
        log or an error message. **Audited:** who downloaded the file, for which
        run, and when.
      responses:
        "200":
          description: The bank transfer file.
          headers:
            Content-Disposition:
              description: >-
                Always `attachment`, with the file name
                `payroll-run-<runId>.csv`, so the browser saves the file instead
                of showing it.
              schema:
                type: string
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            text/csv:
              schema:
                type: string
              example: |
                "staff_number","full_name","bank_name","account_name","account_number","momo_number","net_pay_pesewas","net_pay_ghs","employee_reference","details_changed_after_approval"
                "SMT-00042","Kwame Mensah","Akwaaba Bank","Kwame Mensah","1234567890123","","148750","1487.50","SAMTEC-2026-09-SMT-00042","no"
                "SMT-00043","Ama Boateng","","","","+233241234567","96320","963.20","SAMTEC-2026-09-SMT-00043","yes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /payroll/runs/{runId}/statutory-summary:
    parameters:
      - $ref: "#/components/parameters/PayrollRunId"
    get:
      tags: [Payroll]
      operationId: getPayrollRunStatutorySummary
      summary: What the run owes SSNIT and the GRA
      description: >-
        **Roles:** ADMIN, HR_PAYROLL. A SUPERVISOR sees no payroll at all
        (`403`), and so does a GUARD. What the company owes the statutory funds
        for this run: the workers' own SSNIT contribution (5.5% of basic,
        deducted from their pay), the employer's contribution (13% of basic, a
        company cost), how that 18.5% splits into Tier 1 (13.5%) and Tier 2
        (5%) — **both worked out from basic**, so the 5% is not a slice of the
        employer's 13% — and the total PAYE withheld and due to the GRA. Every
        percentage comes from the run's own tax table version and is shown in
        basis points beside the amount it produced, so a figure can be checked
        by hand. On a run that is not yet `LOCKED` these figures can still
        change. Version 1 reports these amounts; paying them stays manual.
      responses:
        "200":
          description: The statutory amounts for this run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollStatutorySummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /payroll/payslips:
    get:
      tags: [Payroll]
      operationId: listPayslips
      summary: List payslips
      description: >-
        **Roles:** ADMIN and HR_PAYROLL for the whole company; a GUARD only for
        themselves. A SUPERVISOR sees no payroll at all (`403`). A payslip
        exists only once its run is `LOCKED`, because the PDF is made in the
        same transaction that locks the run, so a draft, a run waiting for
        approval and a rejected run have none. A guard's list is always scoped
        to their own employee record whatever they ask for, and an `employeeId`,
        `periodId` or `runId` the caller may not see answers `404`, never `403`.
        A guard account with no employee record sees an empty page. Newest
        period first.
      parameters:
        - name: employeeId
          in: query
          description: >-
            Only this employee's payslips. A GUARD may pass only their own;
            anyone else's answers `404`.
          schema:
            type: string
            format: uuid
        - name: periodId
          in: query
          description: Only payslips from runs covering this payroll period.
          schema:
            type: string
            format: uuid
        - name: runId
          in: query
          description: Only payslips from this payroll run.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of payslips.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayslipList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /payroll/payslips/{payslipId}:
    parameters:
      - $ref: "#/components/parameters/PayslipId"
    get:
      tags: [Payroll]
      operationId: getPayslip
      summary: Get one payslip
      description: >-
        **Roles:** the owning guard, ADMIN, HR_PAYROLL. A guard reading another
        guard's payslip gets `404`, never `403`, so nobody can learn which
        payslips exist. A SUPERVISOR sees no payroll at all (`403`). Everything
        needed to check the pay by hand is on the payslip itself — the pay terms
        used, the hours, the tax table version, and every step from gross to net
        — so the run does not have to be fetched as well. It was frozen when the
        run locked and never changes; only `runStatus` and `paidAt` are read
        live from the run.
      responses:
        "200":
          description: The payslip.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payslip"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /payroll/payslips/{payslipId}/pdf:
    parameters:
      - $ref: "#/components/parameters/PayslipId"
    get:
      tags: [Payroll]
      operationId: downloadPayslipPdf
      summary: Download a payslip as a PDF
      description: >-
        **Roles:** the owning guard, ADMIN, HR_PAYROLL. A guard asking for
        another guard's payslip gets `404`, never `403`. A SUPERVISOR sees no
        payroll at all (`403`). Returns the stored PDF byte for byte. It was
        generated once, inside the transaction that locked the run, and is never
        regenerated, so what was sent to the worker is exactly what exists here.
        The answer is `application/pdf`, one of only two in this contract that
        are not JSON, and it always carries `Content-Disposition: attachment`,
        so a browser saves the file rather than opening it in a tab. Only the
        `200` is binary: an error is still `application/problem+json`, so a
        client must check the status before treating the body as a PDF.
        **Audited:** who downloaded which payslip, and when.
      responses:
        "200":
          description: The stored payslip PDF.
          headers:
            Content-Disposition:
              description: >-
                Always `attachment`. The file name is
                `payslip-<staffNumber>-<YYYY-MM>.pdf`, and an adjustment payslip
                adds `-adjustment-<first 8 characters of the payslip id>` before
                the extension, because a worker can hold two payslips for one
                month.
              schema:
                type: string
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /payroll/tax-tables:
    get:
      tags: [Payroll]
      operationId: listTaxTables
      summary: List the statutory tax table versions
      description: >-
        **Roles:** ADMIN. HR_PAYROLL, SUPERVISOR and GUARD may never call it
        (`403`): HR prepares runs but does not maintain the rates, which is why
        the tax year is copied onto every run, line and payslip. Every version
        of Ghana's statutory rates this company has: the four SSNIT percentages,
        the graduated PAYE bands, and where each figure came from. Newest
        `effectiveFrom` first. A run uses the version with the latest
        `effectiveFrom` on or before its period's **last** day, so a period that
        straddles a rate change uses the newer one; give `effectiveOn` to see
        exactly which version a given day falls under. A version is **frozen**
        once a run has used it, which is why there is no `PUT` and no `DELETE`
        anywhere on this resource: a rate change is a new version, and a locked
        run's arithmetic can always be reproduced.
      parameters:
        - name: taxYear
          in: query
          description: Only versions for this tax year, like `2026`.
          schema:
            type: integer
            minimum: 2020
            maximum: 2100
        - name: effectiveOn
          in: query
          description: >-
            Only the one version a period ending on this day would use: the
            latest `effectiveFrom` on or before it. At most one item comes back.
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of tax table versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxTableList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Payroll]
      operationId: createTaxTable
      summary: Add a new version of the statutory rates
      description: >-
        **Roles:** ADMIN. Every other role answers `403`. Rates change with
        every national budget, so a change is a **new** version and never an
        edit: nothing on this resource can be updated or deleted, and a version
        a run has used is frozen by the database itself. Send the four SSNIT
        percentages as basis points — 550 employee, 1300 employer, 1350 Tier 1,
        500 Tier 2 — remembering that the Tier 2 5% is of **basic pay**, not a
        slice of the employer's 13%, and that only the employee's 5.5% is ever
        deducted from a worker. Send the PAYE monthly bands in order, each
        covering the next slice of chargeable income, with `widthPesewas: null`
        on the top band because it has no upper limit; `ordinal` runs from 1
        with no gaps, and only the last band may leave its width out.
        `sourceName`, `sourceUrl` and `sourceCheckedOn` are required, because a
        rate nobody can trace is a rate nobody can defend. A later version
        supersedes an earlier one without touching it, so leave `effectiveTo`
        out unless this version is already known to stop on a given day. Two
        versions may not start on the same day (`409`). Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaxTableRequest"
            examples:
              ghana2026:
                summary: The 2026 PAYE and SSNIT rates
                value:
                  taxYear: 2026
                  effectiveFrom: "2026-01-01"
                  ssnitEmployeeBasisPoints: 550
                  ssnitEmployerBasisPoints: 1300
                  ssnitTier1BasisPoints: 1350
                  ssnitTier2BasisPoints: 500
                  bands:
                    - ordinal: 1
                      widthPesewas: 49000
                      rateBasisPoints: 0
                    - ordinal: 2
                      widthPesewas: 10000
                      rateBasisPoints: 500
                    - ordinal: 3
                      widthPesewas: 50000
                      rateBasisPoints: 1000
                    - ordinal: 4
                      widthPesewas: 200000
                      rateBasisPoints: 1750
                    - ordinal: 5
                      widthPesewas: 200000
                      rateBasisPoints: 2500
                    - ordinal: 6
                      widthPesewas: 1491000
                      rateBasisPoints: 3000
                    - ordinal: 7
                      widthPesewas: null
                      rateBasisPoints: 3500
                  sourceName: GRA PAYE rates 2026
                  sourceUrl: https://gra.gov.gh/domestic-tax/tax-types/paye/
                  sourceCheckedOn: "2026-01-05"
      responses:
        "201":
          description: The tax table version was stored.
          headers:
            Location:
              description: URL of the tax table list.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxTable"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /employees/{employeeId}/pay-terms:
    parameters:
      - $ref: "#/components/parameters/EmployeeId"
    get:
      tags: [Payroll]
      operationId: listEmployeePayTerms
      summary: An employee's pay terms, newest first
      description: >-
        **Roles:** ADMIN, HR_PAYROLL. A SUPERVISOR sees no payroll at all
        (`403`), and so does a GUARD, who may read their own payslips but not
        their pay terms. What this employee is paid, and what they were paid
        before. Pay terms are effective-dated and **never edited**, so every
        change is its own row and an old payslip can always be explained. A run
        reads the row with the latest `effectiveFrom` on or before the period's
        **last** day and copies every value into the payroll line; give
        `effectiveOn` to get just that one row. An employee with no pay terms
        yet answers `200` with an empty list: they are simply left off a run and
        listed in its summary. An employee this caller may not see answers
        `404`.
      parameters:
        - name: effectiveOn
          in: query
          description: >-
            Only the row a run would use for a period ending on this day: the
            latest `effectiveFrom` on or before it. At most one item comes back.
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of this employee's pay terms.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeePayTermsList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Payroll]
      operationId: setEmployeePayTerms
      summary: Set an employee's pay from a date
      description: >-
        **Roles:** ADMIN, HR_PAYROLL. A SUPERVISOR sees no payroll at all
        (`403`), and so does a GUARD. **This never changes an existing row.** Pay
        terms are effective-dated history: every call stores a **new** row and
        the row before it stays exactly as it was, so a payslip from March can
        always be explained by the terms in force in March — which is why the
        answer is `201` and not `200`. Send every field: the new row states the
        whole of what the worker is paid from `effectiveFrom`, and nothing is
        carried over, so an allowance left out is not an allowance that keeps
        its old value. A locked run keeps the values it copied into its lines,
        so back-dating a correction never rewrites a payslip that has already
        been sent; calculate the open draft again to pick the new terms up. Two
        rows for the same employee may not start on the same day (`409`).
        Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetEmployeePayTermsRequest"
            examples:
              guardFromOctober:
                summary: A guard's pay from 1 October 2026
                value:
                  effectiveFrom: "2026-10-01"
                  basicMonthlyPesewas: 120000
                  overtimeHourlyPesewas: 900
                  taxableAllowancePesewas: 15000
                  nonTaxableAllowancePesewas: 5000
                  otherDeductionPesewas: 2000
      responses:
        "201":
          description: The new pay terms row. The row before it is unchanged.
          headers:
            Location:
              description: URL of this employee's pay terms.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeePayTerms"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /employees/{employeeId}/payment-details:
    parameters:
      - $ref: "#/components/parameters/EmployeeId"
    put:
      tags: [Payroll]
      operationId: setEmployeePaymentDetails
      summary: Set where an employee's salary is paid
      description: >-
        **Roles:** ADMIN, HR_PAYROLL. A SUPERVISOR sees no payroll at all
        (`403`), and so does a GUARD. The bank account and mobile money number
        the bank export pays into. One row per employee, and unlike pay terms
        this row **is** edited in place, which is why the answer is `200`: what
        you send replaces what was there. Send all four fields, with `null` for
        anything the worker does not have, so a detail is only ever cleared on
        purpose and never by being left out. A worker with no details is simply
        missing from the bank file; nothing else changes. **This is personal
        data.** It is never written to a log, never put in an error message and
        never returned by any list endpoint, so no run, line or payslip carries
        it; a rejected field is named, never quoted. The audit entry records
        that the details changed and who changed them, never the values, and the
        answer carries `Cache-Control: no-store`. There is no `GET`: these
        details exist to be paid into, and the only other place they are read is
        the run's bank export.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetEmployeePaymentDetailsRequest"
            examples:
              bankAndMomo:
                summary: A bank account and a mobile money number
                value:
                  bankName: Akwaaba Bank
                  accountName: Kwame Mensah
                  accountNumber: "1234567890123"
                  momoNumber: "+233241234567"
              momoOnly:
                summary: Mobile money only
                value:
                  bankName: null
                  accountName: null
                  accountNumber: null
                  momoNumber: "+233241234567"
      responses:
        "200":
          description: The stored payment details.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeePaymentDetails"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /detection/alerts:
    get:
      tags: [Detection]
      operationId: listDetectionAlerts
      summary: The ghost-detection queue
      description: >-
        **Roles:** ADMIN, HR_PAYROLL. A supervisor never sees this queue: a
        supervisor is themselves a subject of rule R7, so it would show them
        their own file (docs/plan/08 §6).

        Newest first. An alert is a **pattern about a person or a device**,
        not a single event — single events live in the attendance exception
        queue, and detection counts them rather than repeating them.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DetectionAlertStatus"
        - name: ruleCode
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DetectionRuleCode"
        - name: severity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DetectionSeverity"
        - name: employeeId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of alerts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionAlertList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /detection/alerts/{alertId}:
    parameters:
      - name: alertId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Detection]
      operationId: getDetectionAlert
      summary: One alert, with everything the rule cited
      description: >-
        **Roles:** ADMIN, HR_PAYROLL. The evidence names the actual rows the
        rule looked at, so a person can check the finding rather than trust
        it.
      responses:
        "200":
          description: The alert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionAlert"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /detection/alerts/{alertId}/resolve:
    parameters:
      - name: alertId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Detection]
      operationId: resolveDetectionAlert
      summary: Close an alert, with a reason
      description: >-
        **Roles:** ADMIN, HR_PAYROLL. A rule never punishes anybody: a person
        decides what an alert meant. The note is required and the decision is
        audited. `CONFIRMED_FRAUD` is not an action against the worker — it
        is this company's record of what it found.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveDetectionAlertRequest"
      responses:
        "200":
          description: The alert, resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionAlert"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This alert was already resolved.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /detection/sweep:
    post:
      tags: [Detection]
      operationId: runDetectionSweep
      summary: Run every rule now
      description: >-
        **Roles:** ADMIN. The same sweep the daily schedule runs, on
        demand — which is what the exit demo uses. Repeating it changes
        nothing: each alert carries a key built from its rule, its subject
        and its window, so a finding already raised is not raised twice and
        one a person resolved is never reopened.

        A rule that fails is logged by its code and skipped; one broken rule
        never stops the other ten.
      responses:
        "200":
          description: What the sweep found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionSweepResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Busy"

  /detection/daily-sweep:
    get:
      tags: [Detection]
      operationId: runDailyDetectionSweep
      summary: The daily run, for the hosting platform's scheduler
      description: >-
        **Public, and deliberately so.** Called once a day by the Vercel
        schedule in `apps/api/vercel.json`. It sweeps every company whose
        last sweep is more than twenty hours old, oldest first, and claims
        each company before sweeping it, so two calls at once never sweep the
        same company twice.


        It needs no secret because it can do nothing a secret would protect:
        anybody who calls it causes at most the one daily sweep per company
        that was going to happen anyway, and the sweep only ever raises
        questions for a person to answer. The answer is a count — no company,
        worker or rule is named.
      security: []
      responses:
        "200":
          description: How many companies were swept by this call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailySweepResult"

  /detection/rules:
    get:
      tags: [Detection]
      operationId: listDetectionRules
      summary: The rules and their thresholds
      description: >-
        **Roles:** ADMIN, HR_PAYROLL. Thresholds live in rows, not in the
        code, so they can be tuned without a deploy — and so the report's
        tuning table can be built by moving them.
      responses:
        "200":
          description: Every rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionRuleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /detection/rules/{ruleCode}:
    parameters:
      - name: ruleCode
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/DetectionRuleCode"
    patch:
      tags: [Detection]
      operationId: updateDetectionRule
      summary: Switch a rule off, or move a threshold
      description: >-
        **Roles:** ADMIN. Audited, with the old and the new value. A rule
        switched off stops raising new alerts; the ones it already raised
        stay, because they are a record of what was found.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDetectionRuleRequest"
      responses:
        "200":
          description: The rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /detection/risk-scores:
    get:
      tags: [Detection]
      operationId: listRiskScores
      summary: Who the open alerts point at
      description: >-
        **Roles:** ADMIN, HR_PAYROLL. Severity times recurrence, added up per
        employee over their open alerts, highest first. It is worked out when
        you ask, never stored, so it can never be stale.
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The riskiest employees.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskScoreList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        The access token from `POST /auth/login`, sent in the header
        `Authorization: Bearer <token>`.
    refreshCookie:
      type: apiKey
      in: cookie
      name: samtec_refresh
      description: >-
        The refresh token cookie set by the API, with the attributes
        `HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=604800`.
        JavaScript cannot read it, it lasts 7 days, and the browser sends it
        only over HTTPS, only to the auth endpoints, and never with requests
        started by another website. `SameSite=Strict` needs the dashboard and
        the API on the same site, as described in
        docs/plan/03-system-architecture.md.
    deviceSignature:
      type: apiKey
      in: header
      name: X-Samtec-Signature
      description: |
        Every request from a device is signed with that device's own secret
        (shown once when the device is registered). Send three headers:

        - `X-Samtec-Device`: the device ID.
        - `X-Samtec-Timestamp`: the current time in Unix seconds. It must be
          within 5 minutes of the server's clock.
        - `X-Samtec-Signature`: lowercase hex HMAC-SHA256, keyed with the
          secret (its UTF-8 bytes), of this exact text:

              v1\n<timestamp>\n<route>\n<body>

          where `<route>` is the operation's route name (`ingest/punches`,
          `ingest/heartbeat`, or a `kiosk/…` name given in each kiosk
          operation) and `<body>` is the exact JSON text sent as the request body.

        Each signed route accepts only some device kinds (see `DeviceKind`):
        the kiosk operations take only `FACE_KIOSK`, and `/ingest/punches`
        never does, so a kiosk key can never post raw punches. The kiosk's
        ADMIN operations need a kiosk sign-in's access token **and** the
        signature.

        Serialise the body once, sign that string, and send the same string.
        A wrong signature, an unknown or switched-off device, a device kind
        the route does not accept, and a stale timestamp all answer the same
        `401`.

        **Test vector** to check an implementation: secret `secret`,
        timestamp `1700000000`, route `ingest/heartbeat`, body `{}` gives
        `d03b57774ab52beacc6fa6485509d670f55eeff763faa674fa5f7a0372f85ae3`.


  headers:
    NoStore:
      description: >-
        Always `no-store`: the response carries a one-time secret or personal
        data, so no browser or proxy may keep a copy.
      schema:
        type: string
        const: no-store

  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: The device's ID.
      schema:
        type: string
        format: uuid
    ExceptionId:
      name: exceptionId
      in: path
      required: true
      description: The exception's ID.
      schema:
        type: string
        format: uuid
    DeviceHeader:
      name: X-Samtec-Device
      in: header
      required: true
      description: The signing device's ID (see the `deviceSignature` security scheme).
      schema:
        type: string
        format: uuid
    TimestampHeader:
      name: X-Samtec-Timestamp
      in: header
      required: true
      description: The signing time in Unix seconds, within 5 minutes of the server clock.
      schema:
        type: string
        pattern: "^[0-9]{1,12}$"
    Cursor:
      name: cursor
      in: query
      description: The `nextCursor` value from the previous page. Leave it out to get the first page.
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      description: How many items to return in one page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    EmployeeId:
      name: employeeId
      in: path
      required: true
      description: The employee's ID.
      schema:
        type: string
        format: uuid
    SiteId:
      name: siteId
      in: path
      required: true
      description: The site's ID.
      schema:
        type: string
        format: uuid
    PostId:
      name: postId
      in: path
      required: true
      description: The post's ID.
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      description: The sign-in account's ID.
      schema:
        type: string
        format: uuid
    ShiftPatternId:
      name: shiftPatternId
      in: path
      required: true
      description: The shift pattern's ID.
      schema:
        type: string
        format: uuid

    CredentialId:
      name: credentialId
      in: path
      required: true
      description: The enrolled face's ID.
      schema:
        type: string
        format: uuid

    # --- Payroll (Phase 4) ---
    PayrollPeriodId:
      name: periodId
      in: path
      required: true
      description: The payroll period's ID.
      schema:
        type: string
        format: uuid

    PayrollRunId:
      name: runId
      in: path
      required: true
      description: The payroll run's ID.
      schema:
        type: string
        format: uuid

    PayslipId:
      name: payslipId
      in: path
      required: true
      description: The payslip's ID.
      schema:
        type: string
        format: uuid

    # --- Detection (Phase 5) --- Francis adds detection path parameters here.

  responses:
    DeviceNotTrusted:
      description: >-
        The signature is wrong, the device is unknown or switched off, the
        route does not accept this kind of device, or the timestamp is more
        than 5 minutes from the server clock. Always the same answer, so
        nobody can learn which device IDs exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PayloadTooLarge:
      description: The request body is larger than 100 kB. Send smaller batches.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Busy:
      description: >-
        The API is busy with another batch for the same company. Nothing was
        stored; send the same request again in a few seconds.
      headers:
        Retry-After:
          description: How many seconds to wait before trying again.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    BadRequest:
      description: The request is invalid. The `errors` list says which fields are wrong.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            validationError:
              summary: A field failed validation
              value:
                type: "urn:samtec:problem:validation-error"
                title: Validation failed
                status: 400
                detail: One or more fields are invalid.
                instance: /api/v1/employees
                traceId: 01927c3e-9f00-7abc-8def-000000000001
                errors:
                  - path: ghanaCardNumber
                    message: Must look like GHA-123456789-0.
    Unauthorized:
      description: No valid access token was sent, or it has expired. Refresh the session or sign in again.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            notSignedIn:
              summary: Missing or expired token
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Sign in to continue.
                traceId: 01927c3e-9f00-7abc-8def-000000000002
    InvalidCredentials:
      description: >-
        The sign-in details are wrong. The message never says whether the email
        or the password was wrong, so attackers cannot discover which emails
        have accounts.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            wrongPassword:
              summary: Wrong email or password
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Email or password is incorrect.
                traceId: 01927c3e-9f00-7abc-8def-000000000003
    Forbidden:
      description: You are signed in, but your role is not allowed to do this.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            wrongRole:
              summary: Role not allowed
              value:
                type: about:blank
                title: Forbidden
                status: 403
                detail: Your role does not allow this action.
                traceId: 01927c3e-9f00-7abc-8def-000000000004
    NotFound:
      description: >-
        Nothing was found with this ID, or you are not allowed to see it. Both
        cases look the same on purpose.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            unknownEmployee:
              summary: No such employee
              value:
                type: about:blank
                title: Not Found
                status: 404
                detail: No employee exists with this ID.
                traceId: 01927c3e-9f00-7abc-8def-000000000005
    Conflict:
      description: The request clashes with data that already exists.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            duplicateGhanaCard:
              summary: Ghana Card number already registered
              value:
                type: "urn:samtec:problem:conflict"
                title: Conflict
                status: 409
                detail: An employee with this Ghana Card number is already registered.
                traceId: 01927c3e-9f00-7abc-8def-000000000006
    TooManyRequests:
      description: Too many attempts in a short time. Wait before trying again.
      headers:
        Retry-After:
          description: How many seconds to wait before trying again.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            slowDown:
              summary: Rate limit reached
              value:
                type: about:blank
                title: Too Many Requests
                status: 429
                detail: Too many attempts. Try again in 60 seconds.
                traceId: 01927c3e-9f00-7abc-8def-000000000007

  schemas:
    HealthResponse:
      type: object
      description: >-
        The result of a health check. Public, so it holds only what a health
        check needs. Version details will come from an admin-only endpoint in
        Phase 1.
      required: [status, time, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: "`ok` when everything works, `degraded` when a dependency is down."
        time:
          type: string
          format: date-time
          description: The server's current time in UTC.
        checks:
          type: object
          required: [database]
          properties:
            database:
              type: string
              enum: [up, down]

    SystemInfo:
      type: object
      description: Details about the running API. Only administrators may read them.
      required: [version, environment, uptimeSeconds]
      properties:
        version:
          type: string
          description: The version of the API that is running.
          examples: ["0.1.0"]
        environment:
          type: string
          enum: [development, test, production]
        uptimeSeconds:
          type: integer
          minimum: 0
          description: Seconds since the API process started.

    ProblemDetails:
      type: object
      description: >-
        A standard error response (RFC 9457). Show `detail` to the user, and
        include `traceId` when reporting a bug so the backend developer can find
        the exact request in the logs.
      required: [type, title, status, traceId]
      properties:
        type:
          type: string
          format: uri-reference
          description: >-
            The kind of error. `about:blank` means a plain HTTP error.
            Values starting with `urn:samtec:problem:` are SAMTEC-specific.
          examples: ["urn:samtec:problem:validation-error"]
        title:
          type: string
          description: A short summary of the error type.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: The HTTP status code.
        detail:
          type: string
          description: A human-readable explanation of this specific error.
        instance:
          type: string
          format: uri-reference
          description: The request path that failed.
        traceId:
          type: string
          description: The ID of the request, also written to the server logs.
        errors:
          type: array
          description: Present on validation errors, with one entry per invalid field.
          items:
            $ref: "#/components/schemas/ValidationIssue"

    ValidationIssue:
      type: object
      required: [path, message]
      properties:
        path:
          type: string
          description: The invalid field as a dot path, for example `phone` or `address.city`.
        message:
          type: string
          description: What is wrong, written for the user.

    UserRole:
      type: string
      description: |
        What a user account is allowed to do.
        - `ADMIN` — full access, including user management and approving payroll.
        - `HR_PAYROLL` — manages employees and prepares payroll runs, but cannot approve a run they prepared.
        - `SUPERVISOR` — manages attendance and rosters for their assigned sites.
        - `GUARD` — sees only their own attendance and payslips.
      enum: [ADMIN, HR_PAYROLL, SUPERVISOR, GUARD]

    CurrentUser:
      type: object
      required: [id, email, fullName, role, twoFactorEnabled, employeeId]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        twoFactorEnabled:
          type: boolean
        employeeId:
          type: [string, "null"]
          format: uuid
          description: The linked employee record for guards and supervisors, or `null` for office-only accounts.

    UserAccountStatus:
      type: string
      description: |
        - `AWAITING_PASSWORD` — created or reset; waiting for the person to
          choose a password with their one-time link. Cannot sign in yet.
        - `ACTIVE` — has a password and can sign in. A new ADMIN or HR_PAYROLL
          account sets up two-factor authentication at its first sign-in;
          `twoFactorEnabled` shows whether that has happened yet.
        - `DEACTIVATED` — switched off by an administrator, or because the
          linked employee left. Cannot sign in. Kept for history.
      enum: [AWAITING_PASSWORD, ACTIVE, DEACTIVATED]

    UserAccount:
      type: object
      description: A sign-in account as administrators see it. Never contains a password or secret.
      required: [id, email, fullName, role, status, twoFactorEnabled, employeeId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          $ref: "#/components/schemas/UserAccountStatus"
        twoFactorEnabled:
          type: boolean
        employeeId:
          type: [string, "null"]
          format: uuid
          description: The linked employee for SUPERVISOR and GUARD accounts; `null` for ADMIN and HR_PAYROLL.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserAccountList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserAccount"
        nextCursor:
          type: [string, "null"]
          description: Pass this as `cursor` to get the next page. It is `null` on the last page.

    PasswordSetupToken:
      type: string
      minLength: 1
      maxLength: 512
      description: >-
        A one-time token that lets one person choose their password. It works
        once, for 72 hours. Hand it over only in person or by private message.

    PasswordSetup:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          $ref: "#/components/schemas/PasswordSetupToken"
        expiresAt:
          type: string
          format: date-time

    UserAccountWithPasswordSetup:
      type: object
      description: An account plus its one-time password link token, shown only in this one response.
      required: [user, passwordSetup]
      properties:
        user:
          $ref: "#/components/schemas/UserAccount"
        passwordSetup:
          $ref: "#/components/schemas/PasswordSetup"

    PersonFullName:
      type: string
      minLength: 2
      maxLength: 120
      examples: [Yaw Asante]

    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, fullName, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Stored lower-case. Unique within the company.
        fullName:
          $ref: "#/components/schemas/PersonFullName"
        role:
          $ref: "#/components/schemas/UserRole"
        employeeId:
          type: string
          format: uuid
          description: Required for SUPERVISOR and GUARD; not allowed for ADMIN and HR_PAYROLL.

    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Only the fields you send are changed.
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        fullName:
          $ref: "#/components/schemas/PersonFullName"
        role:
          $ref: "#/components/schemas/UserRole"
        employeeId:
          type: [string, "null"]
          format: uuid
          description: Link a different employee, or `null` to unlink (for ADMIN and HR_PAYROLL).

    NewPassword:
      type: string
      minLength: 12
      maxLength: 128
      writeOnly: true
      description: At least 12 characters. A short sentence is easy to remember and hard to guess.

    SetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          $ref: "#/components/schemas/PasswordSetupToken"
        newPassword:
          $ref: "#/components/schemas/NewPassword"

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        newPassword:
          $ref: "#/components/schemas/NewPassword"

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true

    LoginResponse:
      description: >-
        A finished sign-in, a request for a two-factor code, or a request to
        set up two-factor authentication. Check `status` to tell them apart.
      oneOf:
        - $ref: "#/components/schemas/AuthenticatedSession"
        - $ref: "#/components/schemas/TwoFactorChallenge"
        - $ref: "#/components/schemas/TwoFactorSetupRequired"
      discriminator:
        propertyName: status
        mapping:
          AUTHENTICATED: "#/components/schemas/AuthenticatedSession"
          TWO_FACTOR_REQUIRED: "#/components/schemas/TwoFactorChallenge"
          TWO_FACTOR_SETUP_REQUIRED: "#/components/schemas/TwoFactorSetupRequired"

    AuthenticatedSession:
      type: object
      required: [status, accessToken, expiresInSeconds, user]
      properties:
        status:
          type: string
          const: AUTHENTICATED
        accessToken:
          type: string
          description: Send it in the `Authorization` header. Keep it in memory only, never in localStorage.
        expiresInSeconds:
          type: integer
          minimum: 1
          examples: [900]
        user:
          $ref: "#/components/schemas/CurrentUser"

    TwoFactorChallenge:
      type: object
      required: [status, challengeToken, expiresInSeconds]
      properties:
        status:
          type: string
          const: TWO_FACTOR_REQUIRED
        challengeToken:
          $ref: "#/components/schemas/OneTimeToken"
        expiresInSeconds:
          type: integer
          minimum: 1
          examples: [300]

    TwoFactorSetupRequired:
      type: object
      required: [status, setupToken, expiresInSeconds]
      properties:
        status:
          type: string
          const: TWO_FACTOR_SETUP_REQUIRED
        setupToken:
          $ref: "#/components/schemas/OneTimeToken"
        expiresInSeconds:
          type: integer
          minimum: 1
          examples: [600]

    OneTimeToken:
      type: string
      minLength: 1
      maxLength: 512
      description: >-
        Proves the password was correct. It expires quickly, works for one
        account only, and is used up by the step it was issued for. Keep it in
        memory only.

    TwoFactorCode:
      type: string
      pattern: '^\d{6}$'
      description: The 6-digit code from the authenticator app.
      examples: ["492039"]

    VerifyTwoFactorRequest:
      type: object
      additionalProperties: false
      required: [challengeToken, code]
      properties:
        challengeToken:
          $ref: "#/components/schemas/OneTimeToken"
        code:
          $ref: "#/components/schemas/TwoFactorCode"

    TwoFactorSetupRequest:
      type: object
      additionalProperties: false
      required: [setupToken]
      properties:
        setupToken:
          $ref: "#/components/schemas/OneTimeToken"

    TwoFactorSetup:
      type: object
      description: >-
        The new two-factor secret. Both fields contain the secret itself, so
        show them only on the setup screen, and never store or log them.
      required: [otpauthUri, manualEntryKey]
      properties:
        otpauthUri:
          type: string
          description: Show this link as a QR code for the authenticator app to scan.
          examples: ["otpauth://totp/SAMTEC:ama.boateng%40samtec.example?secret=EXAMPLESECRET&issuer=SAMTEC"]
        manualEntryKey:
          type: string
          description: The same secret as text, for people who cannot scan the QR code.
          examples: [EXAMPLESECRET]

    EnableTwoFactorRequest:
      type: object
      additionalProperties: false
      required: [setupToken, code]
      properties:
        setupToken:
          $ref: "#/components/schemas/OneTimeToken"
        code:
          $ref: "#/components/schemas/TwoFactorCode"

    AccessTokenResponse:
      type: object
      required: [accessToken, expiresInSeconds]
      properties:
        accessToken:
          type: string
        expiresInSeconds:
          type: integer
          minimum: 1
          examples: [900]

    EmployeeStatus:
      type: string
      description: |
        Where the employee is in their working life with the company.
        - `PENDING_ENROLLMENT` — registered, but biometrics are not enrolled yet. Any punch is stored but raises `INACTIVE_EMPLOYEE` and is not paid; the one exception is a worker whose withdrawal of consent waits for a second ADMIN, whose hours are paid once it is approved.
        - `ACTIVE` — enrolled and verified. Can clock in and appears on payroll.
        - `SUSPENDED` — temporarily blocked from clocking in and from payroll.
        - `TERMINATED` — has left the company. Kept for history and never deleted.
      enum: [PENDING_ENROLLMENT, ACTIVE, SUSPENDED, TERMINATED]

    TerminationReason:
      type: string
      description: |
        Why the employee left.
        - `RESIGNED` — the employee chose to leave.
        - `DISMISSED` — the company ended the employment.
        - `CONTRACT_ENDED` — a fixed-term contract finished.
        - `ABSCONDED` — stopped reporting for duty without notice.
        - `DECEASED` — the employee passed away.
        - `OTHER` — explain in `note`.
      enum: [RESIGNED, DISMISSED, CONTRACT_ENDED, ABSCONDED, DECEASED, OTHER]

    StaffNumber:
      type: string
      pattern: '^SMT-\d{5}$'
      description: The employee number printed on ID cards. Generated by the API.
      examples: [SMT-00042]

    GhanaCardNumber:
      type: string
      pattern: '^GHA-\d{9}-\d$'
      description: >-
        The personal ID number on the Ghana Card, issued by the National
        Identification Authority. It also serves as the SSNIT number.
        Sensitive, so show it only to roles that need it.
      examples: [GHA-123456789-0]

    GhanaPhoneNumber:
      type: string
      pattern: '^\+233\d{9}$'
      description: A Ghanaian phone number in international format, +233 followed by 9 digits.
      examples: ["+233241234567"]

    PersonName:
      type: string
      minLength: 1
      maxLength: 60

    SiteCode:
      type: string
      pattern: '^[A-Z]{3}-\d{2}$'
      description: A short site code made of three letters for the town and a two-digit number.
      examples: [ACC-01]

    SiteSummary:
      type: object
      description: The short form of a site, used inside other objects.
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          $ref: "#/components/schemas/SiteCode"
        name:
          type: string
          examples: [Ridge Towers Office Complex]

    EmployeeListItem:
      type: object
      description: The short form of an employee used in lists. Sensitive identity fields are left out on purpose.
      required: [id, staffNumber, fullName, position, status, biometricEnrolledAt, currentSite, hireDate]
      properties:
        id:
          type: string
          format: uuid
        staffNumber:
          $ref: "#/components/schemas/StaffNumber"
        fullName:
          type: string
          examples: [Kwame Kofi Mensah]
        position:
          type: string
          examples: [Security Guard]
        status:
          $ref: "#/components/schemas/EmployeeStatus"
        biometricEnrolledAt:
          $ref: "#/components/schemas/BiometricEnrolledAt"
        currentSite:
          description: The site the employee is posted to today, or `null` if unassigned.
          oneOf:
            - $ref: "#/components/schemas/SiteSummary"
            - type: "null"
        hireDate:
          type: string
          format: date

    EmployeeList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeListItem"
        nextCursor:
          type: [string, "null"]
          description: Pass this as `cursor` to get the next page. It is `null` on the last page.

    BiometricEnrolledAt:
      type: [string, "null"]
      format: date-time
      description: >-
        When fingerprint or face templates were enrolled and passed the
        duplicate check, or `null` if the employee is not enrolled.

    Employee:
      type: object
      description: The full employee record. Contains sensitive identity data.
      required:
        - id
        - staffNumber
        - firstName
        - lastName
        - otherNames
        - fullName
        - phone
        - email
        - position
        - status
        - biometricEnrolledAt
        - hireDate
        - terminationDate
        - currentSite
        - currentPost
        - currentShiftPattern
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        staffNumber:
          $ref: "#/components/schemas/StaffNumber"
        firstName:
          $ref: "#/components/schemas/PersonName"
        lastName:
          $ref: "#/components/schemas/PersonName"
        otherNames:
          description: Middle or other names, or `null`.
          oneOf:
            - $ref: "#/components/schemas/PersonName"
            - type: "null"
        fullName:
          type: string
          description: First, other and last names joined together, ready to display.
        phone:
          $ref: "#/components/schemas/GhanaPhoneNumber"
        email:
          type: [string, "null"]
          format: email
        ghanaCardNumber:
          $ref: "#/components/schemas/GhanaCardNumber"
          description: >-
            Only included for ADMIN and HR_PAYROLL, and for a guard viewing
            their own record. Missing for everyone else (data minimisation), so
            the dashboard must handle it being absent.
        position:
          type: string
          examples: [Security Guard]
        status:
          $ref: "#/components/schemas/EmployeeStatus"
        biometricEnrolledAt:
          $ref: "#/components/schemas/BiometricEnrolledAt"
        hireDate:
          type: string
          format: date
        terminationDate:
          type: [string, "null"]
          format: date
        currentSite:
          description: The site the employee is posted to today, or `null` if unassigned.
          oneOf:
            - $ref: "#/components/schemas/SiteSummary"
            - type: "null"
        currentPost:
          description: The post at that site, or `null` when none is set.
          oneOf:
            - $ref: "#/components/schemas/PostSummary"
            - type: "null"
        currentShiftPattern:
          description: The shift pattern they work, or `null` when none is set.
          oneOf:
            - $ref: "#/components/schemas/ShiftPatternSummary"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateEmployeeRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName, phone, ghanaCardNumber, position, hireDate]
      properties:
        firstName:
          $ref: "#/components/schemas/PersonName"
        lastName:
          $ref: "#/components/schemas/PersonName"
        otherNames:
          $ref: "#/components/schemas/PersonName"
        phone:
          $ref: "#/components/schemas/GhanaPhoneNumber"
        email:
          type: string
          format: email
          maxLength: 254
        ghanaCardNumber:
          $ref: "#/components/schemas/GhanaCardNumber"
        position:
          type: string
          minLength: 2
          maxLength: 60
        hireDate:
          type: string
          format: date
        siteId:
          type: string
          format: uuid
          description: Optional. Post the employee to this site straight away.
        postId:
          type: string
          format: uuid
          description: Optional, only with `siteId`. The post at that site.
        shiftPatternId:
          type: string
          format: uuid
          description: Optional, only with `siteId`. The shift pattern they work.

    UpdateEmployeeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Only the fields you send are changed. Send `null` to clear an optional field.
      properties:
        firstName:
          $ref: "#/components/schemas/PersonName"
        lastName:
          $ref: "#/components/schemas/PersonName"
        otherNames:
          oneOf:
            - $ref: "#/components/schemas/PersonName"
            - type: "null"
        phone:
          $ref: "#/components/schemas/GhanaPhoneNumber"
        email:
          type: [string, "null"]
          format: email
          maxLength: 254
        position:
          type: string
          minLength: 2
          maxLength: 60
        siteId:
          type: [string, "null"]
          format: uuid
          description: Move the employee to this site, or send `null` to unassign them.
        postId:
          type: [string, "null"]
          format: uuid
          description: >-
            Set or change the post. Only with `siteId`, because a posting
            change starts a fresh assignment. `null` clears the post.
        shiftPatternId:
          type: [string, "null"]
          format: uuid
          description: >-
            Set or change the shift pattern. Only with `siteId`, because a
            posting change starts a fresh assignment. `null` clears it.

    TerminateEmployeeRequest:
      type: object
      additionalProperties: false
      required: [effectiveDate, reason]
      properties:
        effectiveDate:
          type: string
          format: date
          description: The employee's last working day.
        reason:
          $ref: "#/components/schemas/TerminationReason"
        note:
          type: string
          minLength: 1
          maxLength: 500
          description: Extra detail. Required when `reason` is `OTHER`.

    SiteStatus:
      type: string
      description: |
        - `ACTIVE` — guards are currently posted here.
        - `INACTIVE` — the contract has ended or is paused. Kept for history.
      enum: [ACTIVE, INACTIVE]

    GhanaRegion:
      type: string
      description: One of Ghana's 16 administrative regions.
      enum:
        - AHAFO
        - ASHANTI
        - BONO
        - BONO_EAST
        - CENTRAL
        - EASTERN
        - GREATER_ACCRA
        - NORTH_EAST
        - NORTHERN
        - OTI
        - SAVANNAH
        - UPPER_EAST
        - UPPER_WEST
        - VOLTA
        - WESTERN
        - WESTERN_NORTH

    Site:
      type: object
      required: [id, code, name, clientName, region, city, status, activeGuardCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          $ref: "#/components/schemas/SiteCode"
        name:
          type: string
          examples: [Ridge Towers Office Complex]
        clientName:
          type: string
          description: The client company that pays for guarding this site.
          examples: [Ridge Towers Management Ltd]
        region:
          $ref: "#/components/schemas/GhanaRegion"
        city:
          type: string
          examples: [Accra]
        status:
          $ref: "#/components/schemas/SiteStatus"
        activeGuardCount:
          type: integer
          minimum: 0
          description: The number of ACTIVE employees posted here today.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SiteList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Site"
        nextCursor:
          type: [string, "null"]
          description: Pass this as `cursor` to get the next page. It is `null` on the last page.

    ShiftTime:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      description: A time of day in 24-hour form, like `06:00` or `18:30`.
      examples: ["18:00"]

    PostStatus:
      type: string
      description: |
        - `ACTIVE` — the client pays for this post; guards are assigned to it.
        - `INACTIVE` — no longer staffed. Kept for history, never deleted.
      enum: [ACTIVE, INACTIVE]

    PostSummary:
      type: object
      description: Just enough of a post to show on an employee.
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Main Gate]

    Post:
      type: object
      required: [id, siteId, name, requiredGuards, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        name:
          type: string
          description: What the position is called at the site. Unique per site.
          examples: [Main Gate]
        requiredGuards:
          type: integer
          minimum: 1
          maximum: 50
          description: How many guards this post needs on duty per shift.
        status:
          $ref: "#/components/schemas/PostStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PostList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        nextCursor:
          type: [string, "null"]
          description: Pass this as `cursor` to get the next page. It is `null` on the last page.

    CreatePostRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
        requiredGuards:
          type: integer
          minimum: 1
          maximum: 50
          default: 1

    UpdatePostRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Only the fields you send are changed.
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
        requiredGuards:
          type: integer
          minimum: 1
          maximum: 50
        status:
          $ref: "#/components/schemas/PostStatus"

    ShiftPatternSummary:
      type: object
      description: Just enough of a shift pattern to show on an employee.
      required: [id, name, startTime, endTime]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Night Shift]
        startTime:
          $ref: "#/components/schemas/ShiftTime"
        endTime:
          $ref: "#/components/schemas/ShiftTime"

    ShiftPattern:
      type: object
      required: [id, name, startTime, endTime, crossesMidnight, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: What the company calls this pattern. Unique per company.
          examples: [Night Shift]
        startTime:
          $ref: "#/components/schemas/ShiftTime"
        endTime:
          $ref: "#/components/schemas/ShiftTime"
        crossesMidnight:
          type: boolean
          description: >-
            `true` when the shift ends on the next calendar day, like 18:00 to
            06:00. Worked out by the API — the end time is not after the start.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ShiftPatternList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShiftPattern"
        nextCursor:
          type: [string, "null"]
          description: Pass this as `cursor` to get the next page. It is `null` on the last page.

    CreateShiftPatternRequest:
      type: object
      additionalProperties: false
      required: [name, startTime, endTime]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
        startTime:
          $ref: "#/components/schemas/ShiftTime"
        endTime:
          $ref: "#/components/schemas/ShiftTime"

    UpdateShiftPatternRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Only the fields you send are changed.
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
        startTime:
          $ref: "#/components/schemas/ShiftTime"
        endTime:
          $ref: "#/components/schemas/ShiftTime"

    DeviceKind:
      type: string
      description: |
        What sends the punches. Every kind signs its requests the same way,
        and each signed route accepts only some kinds (any other answers the
        same `401`): `/ingest/punches` takes `ZKTECO`, and `MOCK` only where
        the simulator is allowed (development and TEST); the `/kiosk` routes
        take only `FACE_KIOSK`; `/ingest/heartbeat` takes every kind.
        - `MOCK` — the simulator, for development and the demo.
        - `ZKTECO` — a ZKTeco fingerprint or face terminal (through its gateway, Phase 3).
        - `FACE_KIOSK` — the SAMTEC face kiosk (Phase 3).
      enum: [MOCK, ZKTECO, FACE_KIOSK]

    DeviceStatus:
      type: string
      description: "`INACTIVE` refuses every request the device sends. Devices are never deleted."
      enum: [ACTIVE, INACTIVE]

    Device:
      type: object
      required:
        - id
        - name
        - siteId
        - kind
        - status
        - lastSeenAt
        - lastClockDriftSeconds
        - failedSignatureCount
        - lastFailedSignatureAt
        - serialNumber
        - passkeysEnabled
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Ridge Towers main gate]
        siteId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/DeviceKind"
        status:
          $ref: "#/components/schemas/DeviceStatus"
        lastSeenAt:
          type: [string, "null"]
          format: date-time
          description: The last correctly signed request, or `null` if none yet.
        lastClockDriftSeconds:
          type: [integer, "null"]
          description: >-
            How far the device's clock was from the server's at its last report
            (positive = the device runs fast). More than 300 seconds either way
            means its punch times are suspect.
        failedSignatureCount:
          type: integer
          minimum: 0
          description: >-
            Minutes in which someone sent requests as this device with a wrong
            signature (counted at most once a minute). Anything above zero is
            worth a look.
        lastFailedSignatureAt:
          type: [string, "null"]
          format: date-time
        serialNumber:
          type: [string, "null"]
          description: >-
            Typed by an ADMIN from the terminal's label. Only `ZKTECO` devices
            have one, and it is unique in the company; the gateway accepts only
            terminals whose serial is listed. `null` for every other device.
        passkeysEnabled:
          type: boolean
          description: >-
            Workers may save a fingerprint on this device's own sensor. Only
            for kiosks with a fingerprint sensor (an Android phone or a
            laptop with a fingerprint reader). Switching it off revokes every
            fingerprint key saved on the device.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DeviceList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Device"
        nextCursor:
          type: [string, "null"]
          description: Pass this as `cursor` to get the next page. It is `null` on the last page.

    RegisterDeviceRequest:
      type: object
      additionalProperties: false
      required: [name, siteId, kind]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
          description: Unique within the company.
        siteId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/DeviceKind"

    UpdateDeviceRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
        status:
          $ref: "#/components/schemas/DeviceStatus"
        serialNumber:
          type: [string, "null"]
          pattern: "^[A-Za-z0-9-]{1,64}$"
          description: >-
            Typed from the terminal's label: letters, digits and dashes. Only
            for `ZKTECO` devices (any other kind answers `400`), and unique in
            the company (`409`). `null` removes it.
        passkeysEnabled:
          type: boolean
          description: >-
            Only kiosks (`FACE_KIOSK`) can switch this on. Switching it off
            revokes every fingerprint key saved on this device, so the change
            is always visible: it is audited, and the workers' clock-ins there
            become face-only (`FACE`) until their fingers are saved again.

    DeviceWithSecret:
      type: object
      description: A device plus its secret, shown only in this one response.
      required: [device, secret]
      properties:
        device:
          $ref: "#/components/schemas/Device"
        secret:
          type: string
          description: >-
            32 random bytes, base64url-encoded. Put it into the device or its
            gateway; the API keeps only an encrypted copy and never shows it again.
          examples: [3q2-7wQkXv9m0y1ZbTn8LpRsUe4GhJcA5dKfWxYz6iB]

    PunchDirection:
      type: string
      description: "`UNKNOWN` when the device does not say; pairing then works it out."
      enum: [IN, OUT, UNKNOWN]

    PunchMethod:
      type: string
      description: |
        How the person proved who they were:
        - `FINGERPRINT`: a fingerprint terminal matched the finger itself.
        - `FACE`: the kiosk camera matched the face.
        - `FACE_PASSKEY`: the face matched, then the device's own fingerprint sensor confirmed it.
        - `STAFF_PASSKEY`: a typed staff number, then the device's fingerprint sensor. **Flagged:** any finger saved on the device can unlock any worker's key.
        - `PIN_FALLBACK`: a PIN or a supervisor's co-sign. **Flagged:** it proves nothing about who was there.
      enum: [FINGERPRINT, FACE, FACE_PASSKEY, STAFF_PASSKEY, PIN_FALLBACK]

    IngestPunch:
      type: object
      additionalProperties: false
      required: [deviceEventId, deviceUserRef, deviceTime, direction, method]
      properties:
        deviceEventId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[!-~]+$"
          description: >-
            The device's own ID for this punch (printable ASCII, no spaces).
            Together with the device it identifies the punch forever.
        deviceUserRef:
          type: string
          minLength: 1
          maxLength: 32
          description: >-
            The user number the device matched: the digits of the staff
            number (`42` or `00042` for SMT-00042), or the staff number itself.
        deviceTime:
          type: string
          format: date-time
          description: When the punch happened, by the device's clock, with its UTC offset.
        direction:
          $ref: "#/components/schemas/PunchDirection"
        method:
          $ref: "#/components/schemas/IngestPunchMethod"

    IngestPunchesRequest:
      type: object
      additionalProperties: false
      required: [punches]
      properties:
        deviceClockAt:
          type: string
          format: date-time
          description: The device's clock at the moment it sent the batch, used to measure drift.
        punches:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/IngestPunch"

    PunchResultStatus:
      type: string
      description: |
        - `ACCEPTED` — stored now.
        - `DUPLICATE` — already stored earlier, identical. Nothing changed.
        - `CONFLICT` — this `deviceEventId` was stored earlier with different
          content. The new version was not stored; the attempt is audited.
      enum: [ACCEPTED, DUPLICATE, CONFLICT]

    PunchResult:
      type: object
      required: [deviceEventId, status, punchId]
      properties:
        deviceEventId:
          type: string
        status:
          $ref: "#/components/schemas/PunchResultStatus"
        punchId:
          type: string
          format: uuid
          description: The stored punch (for `CONFLICT`, the one stored earlier).

    IngestPunchesResponse:
      type: object
      required: [serverTime, accepted, duplicates, conflicts, results]
      properties:
        serverTime:
          type: string
          format: date-time
        accepted:
          type: integer
          minimum: 0
        duplicates:
          type: integer
          minimum: 0
        conflicts:
          type: integer
          minimum: 0
        results:
          type: array
          items:
            $ref: "#/components/schemas/PunchResult"

    HeartbeatRequest:
      type: object
      additionalProperties: false
      properties:
        deviceClockAt:
          type: string
          format: date-time

    HeartbeatResponse:
      type: object
      required: [serverTime]
      properties:
        serverTime:
          type: string
          format: date-time

    EmployeeRef:
      type: object
      description: Just enough of an employee to name them.
      required: [id, staffNumber, fullName]
      properties:
        id:
          type: string
          format: uuid
        staffNumber:
          $ref: "#/components/schemas/StaffNumber"
        fullName:
          type: string

    SegmentBasis:
      type: string
      description: |
        - `BIOMETRIC` — both punches were `FINGERPRINT`, `FACE` or
          `FACE_PASSKEY` (face, then the kiosk's fingerprint sensor).
        - `PIN_FALLBACK` — at least one of the two punches was `PIN_FALLBACK`
          (a PIN or a supervisor's co-sign) or `STAFF_PASSKEY` (staff number,
          then fingerprint): flagged, because neither proves who the worker is.
        - `MANUAL` — recorded by a person while resolving an exception.
      enum: [BIOMETRIC, PIN_FALLBACK, MANUAL]

    SegmentStatus:
      type: string
      description: |
        - `CONFIRMED` — counts as worked time.
        - `DISPUTED` — overlaps another shift of the same person; counts only
          once a person resolves the overlap.
        - `VOIDED` — no longer counts (replaced by later punches, or voided by a person).
      enum: [CONFIRMED, DISPUTED, VOIDED]

    WorkSegment:
      type: object
      required:
        - id
        - employee
        - siteId
        - workDate
        - startedAt
        - endedAt
        - workedMinutes
        - basis
        - status
        - clockInPunchId
        - clockOutPunchId
      properties:
        id:
          type: string
          format: uuid
        employee:
          $ref: "#/components/schemas/EmployeeRef"
        siteId:
          type: string
          format: uuid
        workDate:
          type: string
          format: date
          description: The Ghana (Africa/Accra) date the shift started on. All its hours belong to it.
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        workedMinutes:
          type: integer
          minimum: 0
          maximum: 960
        basis:
          $ref: "#/components/schemas/SegmentBasis"
        status:
          $ref: "#/components/schemas/SegmentStatus"
        clockInPunchId:
          type: [string, "null"]
          format: uuid
          description: "`null` for MANUAL segments."
        clockOutPunchId:
          type: [string, "null"]
          format: uuid

    WorkSegmentList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkSegment"
        nextCursor:
          type: [string, "null"]
          description: Pass this as `cursor` to get the next page. It is `null` on the last page.

    AttendanceExceptionType:
      type: string
      description: |
        - `MISSING_CLOCK_OUT` — a clock-in with no clock-out within 16 hours.
        - `MISSING_CLOCK_IN` — a clock-out with no clock-in in the 16 hours before it.
        - `UNKNOWN_EMPLOYEE` — a device user number that matches nobody
          (grouped per device, number and day).
        - `INACTIVE_EMPLOYEE` — a punch from someone who may not clock in:
          waiting for enrollment, suspended, or after their termination date
          (grouped per person and day).
        - `OVERLAP` — one person on two shifts at the same time (often at two sites).
        - `UNEXPECTED_DEVICE_ENROLLMENT` — a ZKTeco terminal reported a finger
          nobody asked for: outside any window an ADMIN opened, or for a user
          number that matches nobody (grouped per device, number and day).
      enum:
        [
          MISSING_CLOCK_OUT,
          MISSING_CLOCK_IN,
          UNKNOWN_EMPLOYEE,
          INACTIVE_EMPLOYEE,
          OVERLAP,
          UNEXPECTED_DEVICE_ENROLLMENT,
        ]

    OpenFingerEnrollmentWindowRequest:
      type: object
      additionalProperties: false
      required: [employeeId]
      properties:
        employeeId:
          type: string
          format: uuid

    FingerEnrollmentWindow:
      type: object
      required: [id, deviceId, employeeId, staffNumber, opensAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        staffNumber:
          $ref: "#/components/schemas/StaffNumber"
        opensAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: 30 minutes after it opened.

    TerminalRosterRequest:
      type: object
      additionalProperties: false
      properties:
        deviceClockAt:
          type: string
          format: date-time
          description: The terminal's own clock, when the gateway knows it.

    TerminalRosterResponse:
      type: object
      required: [users, serverTime]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/TerminalRosterUser"
        serverTime:
          type: string
          format: date-time

    TerminalRosterUser:
      type: object
      required: [deviceUserRef, staffNumber, displayName]
      properties:
        deviceUserRef:
          type: string
          description: What the terminal calls this person — the staff number.
        staffNumber:
          $ref: "#/components/schemas/StaffNumber"
        displayName:
          type: string
          description: >-
            A first name and the surname's initial, as a terminal screen shows
            it. Never a full name, never a Ghana Card number.

    TerminalEnrollmentsRequest:
      type: object
      additionalProperties: false
      required: [enrollments]
      properties:
        enrollments:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/TerminalEnrollment"

    TerminalEnrollment:
      type: object
      additionalProperties: false
      required: [deviceUserRef, enrolledAt]
      properties:
        deviceUserRef:
          type: string
          maxLength: 32
          description: The terminal's user number or staff number.
        fingerIndex:
          type: integer
          minimum: 0
          maximum: 9
          description: Which finger the terminal used. Kept for the report only.
        enrolledAt:
          type: string
          format: date-time
          description: The terminal's own time, read as UTC.

    TerminalEnrollmentsResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/TerminalEnrollmentResult"

    TerminalEnrollmentResult:
      type: object
      required: [deviceUserRef, enrolledAt, status]
      properties:
        deviceUserRef:
          type: string
        enrolledAt:
          type: string
          format: date-time
        status:
          type: string
          description: |
            - `ACCEPTED` — inside a window an ADMIN opened; the finger is now
              in use, with its duplicate check recorded as `NOT_CHECKED`.
            - `DUPLICATE` — this same report was already recorded.
            - `REFUSED` — no open window, or the user number matches nobody.
              An `UNEXPECTED_DEVICE_ENROLLMENT` exception is raised, and the
              gateway is told no more than that.
          enum: [ACCEPTED, DUPLICATE, REFUSED]

    AttendanceExceptionStatus:
      type: string
      description: |
        - `OPEN` — waiting for a person.
        - `RESOLVED` — a person dealt with it (see `resolution`).
        - `AUTO_CLOSED` — later punches cleared it (for example a late clock-out arrived).
      enum: [OPEN, RESOLVED, AUTO_CLOSED]

    ExceptionResolutionAction:
      type: string
      enum: [DISMISS, ADD_SEGMENT, KEEP_SEGMENT, VOID_ALL]

    PunchSummary:
      type: object
      description: The evidence behind an exception.
      required: [id, deviceId, deviceName, deviceUserRef, deviceTime, serverTime, direction, method, clockSuspect]
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        deviceName:
          type: string
        deviceUserRef:
          type: string
        deviceTime:
          type: string
          format: date-time
        serverTime:
          type: string
          format: date-time
          description: When the API received it. Much later than `deviceTime` means the device was offline.
        direction:
          $ref: "#/components/schemas/PunchDirection"
        method:
          $ref: "#/components/schemas/PunchMethod"
        clockSuspect:
          type: boolean
          description: The device's clock was more than 5 minutes off, or the time is impossible.

    ExceptionResolution:
      type: object
      required: [action, note, resolvedAt, resolvedByUserId]
      properties:
        action:
          $ref: "#/components/schemas/ExceptionResolutionAction"
        note:
          type: string
        resolvedAt:
          type: string
          format: date-time
        resolvedByUserId:
          type: string
          format: uuid

    AttendanceException:
      type: object
      required:
        - id
        - type
        - status
        - siteId
        - secondSiteId
        - employee
        - workDate
        - occurredAt
        - punch
        - segments
        - resolution
        - resolutionSegmentId
        - allowedActions
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/AttendanceExceptionType"
        status:
          $ref: "#/components/schemas/AttendanceExceptionStatus"
        siteId:
          type: string
          format: uuid
        secondSiteId:
          type: [string, "null"]
          format: uuid
          description: For an OVERLAP at two sites, the other site.
        employee:
          description: "`null` for UNKNOWN_EMPLOYEE."
          oneOf:
            - $ref: "#/components/schemas/EmployeeRef"
            - type: "null"
        workDate:
          type: string
          format: date
        occurredAt:
          type: string
          format: date-time
        punch:
          description: The punch it is about; `null` for OVERLAP.
          oneOf:
            - $ref: "#/components/schemas/PunchSummary"
            - type: "null"
        segments:
          type: array
          maxItems: 2
          description: For OVERLAP, the two shifts; otherwise empty.
          items:
            $ref: "#/components/schemas/WorkSegment"
        resolution:
          oneOf:
            - $ref: "#/components/schemas/ExceptionResolution"
            - type: "null"
        resolutionSegmentId:
          type: [string, "null"]
          format: uuid
          description: The MANUAL segment an `ADD_SEGMENT` resolution created.
        allowedActions:
          type: array
          description: What the caller may do now. Empty when it is not OPEN or the caller may not resolve it.
          items:
            $ref: "#/components/schemas/ExceptionResolutionAction"
        createdAt:
          type: string
          format: date-time

    AttendanceExceptionList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceException"
        nextCursor:
          type: [string, "null"]
          description: Pass this as `cursor` to get the next page. It is `null` on the last page.

    ResolutionNote:
      type: string
      minLength: 3
      maxLength: 500
      description: Why. Shown to other reviewers; never copied into the audit log.

    DismissResolution:
      type: object
      additionalProperties: false
      required: [action, note]
      properties:
        action:
          type: string
          const: DISMISS
        note:
          $ref: "#/components/schemas/ResolutionNote"

    AddSegmentResolution:
      type: object
      additionalProperties: false
      required: [action, startedAt, endedAt, note]
      properties:
        action:
          type: string
          const: ADD_SEGMENT
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        note:
          $ref: "#/components/schemas/ResolutionNote"

    KeepSegmentResolution:
      type: object
      additionalProperties: false
      required: [action, segmentId, note]
      properties:
        action:
          type: string
          const: KEEP_SEGMENT
        segmentId:
          type: string
          format: uuid
          description: The one of the exception's two segments to keep.
        note:
          $ref: "#/components/schemas/ResolutionNote"

    VoidAllResolution:
      type: object
      additionalProperties: false
      required: [action, note]
      properties:
        action:
          type: string
          const: VOID_ALL
        note:
          $ref: "#/components/schemas/ResolutionNote"

    ResolveExceptionRequest:
      oneOf:
        - $ref: "#/components/schemas/DismissResolution"
        - $ref: "#/components/schemas/AddSegmentResolution"
        - $ref: "#/components/schemas/KeepSegmentResolution"
        - $ref: "#/components/schemas/VoidAllResolution"
      discriminator:
        propertyName: action
        mapping:
          DISMISS: "#/components/schemas/DismissResolution"
          ADD_SEGMENT: "#/components/schemas/AddSegmentResolution"
          KEEP_SEGMENT: "#/components/schemas/KeepSegmentResolution"
          VOID_ALL: "#/components/schemas/VoidAllResolution"

    IngestPunchMethod:
      type: string
      description: >-
        The methods a terminal or its gateway may report. The kiosk methods
        (`FACE_PASSKEY`, `STAFF_PASSKEY`) are set only by the server, so a
        device can never claim them.
      enum: [FINGERPRINT, FACE, PIN_FALLBACK]

    FaceSample:
      type: object
      additionalProperties: false
      description: >-
        What the kiosk's face model measured in one camera frame: numbers
        only, never an image. `real` (anti-spoofing) and `live` (liveness)
        are 0 to 1; higher means more likely a real, live person. The server
        checks them again, which catches a faulty kiosk but not a dishonest
        one: the kiosk app is trusted (docs/plan/13-biometrics-design.md, section 9).
      required: [model, embedding, real, live]
      properties:
        model:
          type: string
          const: human-faceres-1
          description: The face model that made the numbers. Faces from different models can never be compared.
        embedding:
          type: array
          minItems: 1024
          maxItems: 1024
          items:
            type: number
        real:
          type: number
          minimum: 0
          maximum: 1
        live:
          type: number
          minimum: 0
          maximum: 1

    AttemptPurpose:
      type: string
      description: |
        - `CLOCK`: a worker clocking in or out by face.
        - `CO_SIGN`: a site supervisor confirming one named worker's punch.
        - `STAFF_PASSKEY`: a worker using staff number plus fingerprint.
      enum: [CLOCK, CO_SIGN, STAFF_PASSKEY]

    KioskDirection:
      type: string
      description: "Which button the worker pressed: Start shift (`IN`) or End shift (`OUT`)."
      enum: [IN, OUT]

    KioskIdentifyRequest:
      description: >-
        A worker clocking in or out (`CLOCK`), or a site supervisor
        confirming one named worker's clock-in or clock-out (`CO_SIGN`).
      oneOf:
        - $ref: "#/components/schemas/KioskClockIdentifyRequest"
        - $ref: "#/components/schemas/KioskCoSignIdentifyRequest"
      discriminator:
        propertyName: purpose
        mapping:
          CLOCK: "#/components/schemas/KioskClockIdentifyRequest"
          CO_SIGN: "#/components/schemas/KioskCoSignIdentifyRequest"

    KioskClockIdentifyRequest:
      type: object
      additionalProperties: false
      required: [purpose, direction, sample]
      properties:
        purpose:
          type: string
          const: CLOCK
        direction:
          $ref: "#/components/schemas/KioskDirection"
        sample:
          $ref: "#/components/schemas/FaceSample"

    KioskCoSignIdentifyRequest:
      type: object
      additionalProperties: false
      required: [purpose, staffNumber, direction, sample]
      properties:
        purpose:
          type: string
          const: CO_SIGN
        staffNumber:
          $ref: "#/components/schemas/StaffNumber"
          description: The worker the supervisor is confirming (typed on the kiosk).
        direction:
          $ref: "#/components/schemas/KioskDirection"
        sample:
          $ref: "#/components/schemas/FaceSample"
          description: The supervisor's face.

    AttemptOutcome:
      type: string
      description: |
        - `MATCHED`: one person, clearly.
        - `AMBIGUOUS`: two people scored too close to tell apart.
        - `NOT_RECOGNISED`: nobody scored high enough.
        - `LOW_LIVENESS`: the face did not look real or live enough.
        - `FINGERPRINT_REQUESTED`: the staff-number fallback asked for a fingerprint.
        - `NOT_ME`: the worker pressed "Not me" because the kiosk named the
          wrong person; the matched attempt can no longer be confirmed. A
          `NOT_ME` row has the purpose `CLOCK`.
        - `FALLBACK_REFUSED`: the staff-number fallback was refused (not
          unlocked, fingerprints off, or a staff number that does not qualify).
      enum: [MATCHED, AMBIGUOUS, NOT_RECOGNISED, LOW_LIVENESS, FINGERPRINT_REQUESTED, NOT_ME, FALLBACK_REFUSED]

    KioskWorker:
      type: object
      description: >-
        How the kiosk names a worker on a shared screen: first name and the
        initial of the last name, and the staff number.
      required: [displayName, staffNumber]
      properties:
        displayName:
          type: string
          examples: [Kwame A.]
        staffNumber:
          $ref: "#/components/schemas/StaffNumber"

    KioskIdentifyResponse:
      type: object
      required: [attemptId, outcome, worker, fingerprint]
      properties:
        attemptId:
          type: string
          format: uuid
        outcome:
          $ref: "#/components/schemas/AttemptOutcome"
        worker:
          description: The matched person; `null` unless `outcome` is `MATCHED`.
          oneOf:
            - $ref: "#/components/schemas/KioskWorker"
            - type: "null"
        fingerprint:
          description: >-
            Set when the matched person (the worker, or the supervisor for
            `CO_SIGN`) has a fingerprint key on this device. The finger is then
            required: send the result to `POST /kiosk/confirm`, or for a
            `CO_SIGN` as `assertion` in `POST /kiosk/assisted-punches`.
          oneOf:
            - $ref: "#/components/schemas/FingerprintChallenge"
            - type: "null"

    FingerprintChallenge:
      type: object
      required: [options]
      properties:
        options:
          $ref: "#/components/schemas/PasskeyRequestOptions"

    KioskConfirmRequest:
      type: object
      additionalProperties: false
      required: [attemptId]
      properties:
        attemptId:
          type: string
          format: uuid
        assertion:
          $ref: "#/components/schemas/PasskeyAssertion"

    KioskPunchResponse:
      type: object
      required: [punchId, status, method, direction, recordedAt, worker]
      properties:
        punchId:
          type: string
          format: uuid
        status:
          type: string
          description: "`DUPLICATE` when this confirmation was already recorded."
          enum: [ACCEPTED, DUPLICATE]
        method:
          $ref: "#/components/schemas/PunchMethod"
        direction:
          $ref: "#/components/schemas/KioskDirection"
        recordedAt:
          type: string
          format: date-time
        worker:
          $ref: "#/components/schemas/KioskWorker"

    KioskFingerprintOptionsRequest:
      type: object
      additionalProperties: false
      required: [staffNumber, direction]
      properties:
        staffNumber:
          $ref: "#/components/schemas/StaffNumber"
        direction:
          $ref: "#/components/schemas/KioskDirection"

    KioskFingerprintOptionsResponse:
      type: object
      required: [attemptId, worker, options]
      properties:
        attemptId:
          type: string
          format: uuid
        worker:
          $ref: "#/components/schemas/KioskWorker"
        options:
          $ref: "#/components/schemas/PasskeyRequestOptions"

    KioskNotMeRequest:
      type: object
      additionalProperties: false
      required: [attemptId]
      properties:
        attemptId:
          type: string
          format: uuid

    KioskAssistedPunchRequest:
      type: object
      additionalProperties: false
      required: [coSignAttemptId, reason]
      properties:
        coSignAttemptId:
          type: string
          format: uuid
          description: >-
            The supervisor's `CO_SIGN` attempt from `POST /kiosk/identify`. It
            already names the worker and the direction.
        assertion:
          $ref: "#/components/schemas/PasskeyAssertion"
          description: The supervisor's fingerprint, when the co-sign asked for it.
        reason:
          type: string
          minLength: 3
          maxLength: 200
          description: Why the worker could not use their face or fingerprint. Audited.

    BiometricConsentText:
      type: object
      required: [version, text, sha256]
      properties:
        version:
          type: string
          examples: [bio-v1]
        text:
          type: string
          description: The whole consent text, in plain English.
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 of `text`, so a consent record proves exactly which words were shown.

    RecordConsentRequest:
      type: object
      additionalProperties: false
      required: [employeeId, ghanaCardLast4, textVersion]
      properties:
        employeeId:
          type: string
          format: uuid
        ghanaCardLast4:
          type: string
          pattern: "^[0-9]{4}$"
          description: >-
            The last 4 digits of the Ghana Card number, read off the worker's
            physical card (ignore the dashes), to prove the right person is
            being enrolled.
          writeOnly: true
        textVersion:
          type: string
          description: The `version` of the consent text the worker agreed to.

    BiometricConsentStatus:
      type: string
      enum: [NONE, GIVEN, WITHDRAWN]

    BiometricConsent:
      type: object
      required: [id, employeeId, status, textVersion, textSha256, recordedAt, recordedByUserId, deviceId]
      properties:
        id:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        status:
          type: string
          enum: [GIVEN, WITHDRAWN]
        textVersion:
          type: string
        textSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        recordedAt:
          type: string
          format: date-time
        recordedByUserId:
          type: string
          format: uuid
        deviceId:
          type: [string, "null"]
          format: uuid
          description: The kiosk it was given on; `null` for a withdrawal recorded on the dashboard.

    EnrollFaceRequest:
      type: object
      additionalProperties: false
      required: [employeeId, consentId, samples]
      properties:
        employeeId:
          type: string
          format: uuid
        consentId:
          type: string
          format: uuid
        samples:
          type: array
          minItems: 3
          maxItems: 3
          description: Three frames, half a second apart, after the head-turn challenge.
          items:
            $ref: "#/components/schemas/FaceSample"

    DedupeResult:
      type: string
      description: |
        The duplicate check at enrollment:
        - `PASSED`: looks like nobody else.
        - `COLLISION`: looks like someone already enrolled; an ADMIN must decide.
        - `CLEARED`: was a collision, and a second ADMIN decided this face may be used.
        - `NOT_CHECKED`: enrolled on a terminal that keeps its own fingerprints.
      enum: [PASSED, COLLISION, CLEARED, NOT_CHECKED]

    FaceEnrollmentResult:
      type: object
      required: [credentialId, dedupe, employeeStatus]
      properties:
        credentialId:
          type: string
          format: uuid
        dedupe:
          $ref: "#/components/schemas/DedupeResult"
        employeeStatus:
          $ref: "#/components/schemas/EmployeeStatus"

    PasskeyOptionsRequest:
      type: object
      additionalProperties: false
      required: [employeeId]
      properties:
        employeeId:
          type: string
          format: uuid

    PasskeyOptionsResponse:
      type: object
      required: [ticket, options]
      properties:
        ticket:
          type: string
          description: A sealed, 2-minute ticket that only the server can read. Send it back unchanged.
        options:
          $ref: "#/components/schemas/PasskeyCreationOptions"

    RegisterPasskeyRequest:
      type: object
      additionalProperties: false
      required: [employeeId, ticket, response]
      properties:
        employeeId:
          type: string
          format: uuid
        ticket:
          type: string
        response:
          $ref: "#/components/schemas/PasskeyRegistrationResponse"

    DevicePasskey:
      type: object
      required: [id, deviceId, deviceName, registeredAt, synced, revokedAt]
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        deviceName:
          type: string
        registeredAt:
          type: string
          format: date-time
        synced:
          type: boolean
          description: The device said it may copy this key to its cloud account (a synced passkey).
        revokedAt:
          type: [string, "null"]
          format: date-time

    PasskeyCreationOptions:
      type: object
      description: >-
        WebAuthn options for creating a key (`PublicKeyCredentialCreationOptionsJSON`
        in the W3C WebAuthn specification). Pass them unchanged to the browser.

    PasskeyRegistrationResponse:
      type: object
      description: >-
        The browser's answer to `PasskeyCreationOptions`
        (`RegistrationResponseJSON` in the W3C WebAuthn specification), unchanged.

    PasskeyRequestOptions:
      type: object
      description: >-
        WebAuthn options for using a key (`PublicKeyCredentialRequestOptionsJSON`
        in the W3C WebAuthn specification). Pass them unchanged to the browser.

    PasskeyAssertion:
      type: object
      description: >-
        The browser's answer to `PasskeyRequestOptions`
        (`AuthenticationResponseJSON` in the W3C WebAuthn specification), unchanged.

    FaceStatus:
      type: string
      description: |
        - `NONE`: no face enrolled.
        - `PENDING`: enrolled but waiting for a second ADMIN's review.
        - `ACTIVE`: in use for clock-ins.
        - `BLOCKED`: a second ADMIN found one person with two records, and
          this record's face was wiped. Final: the record can only be
          terminated, and nothing turns it back into `REVOKED` or `NONE`.
        - `REVOKED`: wiped by an ADMIN, a withdrawal of consent, or the
          retention sweep. Never replaces `BLOCKED`.
      enum: [NONE, PENDING, ACTIVE, BLOCKED, REVOKED]

    EmployeeBiometrics:
      type: object
      required: [employeeId, consent, face, passkeys, exemption]
      properties:
        employeeId:
          type: string
          format: uuid
        consent:
          type: object
          required: [status, textVersion, at]
          properties:
            status:
              $ref: "#/components/schemas/BiometricConsentStatus"
            textVersion:
              type: [string, "null"]
            at:
              type: [string, "null"]
              format: date-time
        face:
          type: object
          required: [status, dedupe, enrolledAt, deviceName]
          properties:
            status:
              $ref: "#/components/schemas/FaceStatus"
            dedupe:
              oneOf:
                - $ref: "#/components/schemas/DedupeResult"
                - type: "null"
            enrolledAt:
              type: [string, "null"]
              format: date-time
            deviceName:
              type: [string, "null"]
              description: The kiosk it was enrolled on.
        passkeys:
          type: array
          description: Fingerprint keys, one per device at most.
          items:
            $ref: "#/components/schemas/DevicePasskey"
        exemption:
          description: The latest request to let this worker work without biometrics, if any.
          oneOf:
            - $ref: "#/components/schemas/BiometricExemption"
            - type: "null"

    ExemptionReason:
      type: string
      description: |
        - `DECLINED`: the worker said no to biometrics.
        - `CANNOT_ENROLL`: the kiosk cannot read the worker's face.
        - `CONSENT_WITHDRAWN`: filed by the API when an ADMIN records an `ACTIVE` worker's withdrawal of consent; a different ADMIN decides it.
      enum: [DECLINED, CANNOT_ENROLL, CONSENT_WITHDRAWN]

    ExemptionStatus:
      type: string
      description: |
        - `REQUESTED`: waiting for a second ADMIN.
        - `APPROVED`: the worker may work without biometrics.
        - `REJECTED`: the second ADMIN said no.
        - `ENDED`: no longer applies: a face passed the duplicate check later, an approved exemption was revoked, or the record was blocked as a duplicate.
      enum: [REQUESTED, APPROVED, REJECTED, ENDED]

    BiometricExemption:
      type: object
      required: [status, reason, note, requestedAt, requestedByUserId, reviewedAt, reviewedByUserId]
      properties:
        status:
          $ref: "#/components/schemas/ExemptionStatus"
        reason:
          $ref: "#/components/schemas/ExemptionReason"
        note:
          type: [string, "null"]
          description: The free-text note; `null` for a SUPERVISOR, who sees only the reason code.
        requestedAt:
          type: string
          format: date-time
        requestedByUserId:
          type: string
          format: uuid
        reviewedAt:
          type: [string, "null"]
          format: date-time
        reviewedByUserId:
          type: [string, "null"]
          format: uuid
          description: "`null` until a second ADMIN decides. Every `APPROVED` exemption has one."

    RequestExemptionRequest:
      type: object
      additionalProperties: false
      required: [reason, note]
      properties:
        reason:
          type: string
          enum: [DECLINED, CANNOT_ENROLL]
        note:
          type: string
          minLength: 3
          maxLength: 500
          description: >-
            What happened, briefly and factually. Never write down religion
            or health details: the reason code is enough.

    ReviewExemptionRequest:
      type: object
      additionalProperties: false
      required: [decision, note]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        note:
          type: string
          minLength: 3
          maxLength: 500

    BiometricReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: Why. Kept with the audit record.

    CollisionStatus:
      type: string
      description: |
        - `OPEN`: waiting for a second ADMIN. Only a second ADMIN can close it;
          wiping the face (a withdrawal of consent, or the retention sweep)
          leaves it open.
        - `RESOLVED`: decided (see `resolution`).
      enum: [OPEN, RESOLVED]

    CollisionVerdict:
      type: string
      description: "`DIFFERENT_PEOPLE`: two real people who look alike. `SAME_PERSON`: one person enrolled twice."
      enum: [DIFFERENT_PEOPLE, SAME_PERSON]

    BiometricCollision:
      type: object
      required: [credentialId, status, employee, lookedLike, similarity, enrolledAt, enrolledByUserId, deviceId, resolution]
      properties:
        credentialId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/CollisionStatus"
        employee:
          $ref: "#/components/schemas/EmployeeRef"
        lookedLike:
          $ref: "#/components/schemas/EmployeeRef"
        similarity:
          type: number
          minimum: 0
          maximum: 1
          description: How alike the two faces scored (1 = identical). Shown to ADMINs only, never on a kiosk.
        enrolledAt:
          type: string
          format: date-time
        enrolledByUserId:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        resolution:
          oneOf:
            - $ref: "#/components/schemas/CollisionResolution"
            - type: "null"

    CollisionResolution:
      type: object
      required: [verdict, keptEmployeeId, note, resolvedAt, resolvedByUserId]
      properties:
        verdict:
          $ref: "#/components/schemas/CollisionVerdict"
        keptEmployeeId:
          type: [string, "null"]
          format: uuid
          description: The record kept for `SAME_PERSON`; `null` for `DIFFERENT_PEOPLE`.
        note:
          type: string
        resolvedAt:
          type: string
          format: date-time
        resolvedByUserId:
          type: string
          format: uuid

    BiometricCollisionList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BiometricCollision"
        nextCursor:
          type: [string, "null"]
          description: Pass this as `cursor` to get the next page. It is `null` on the last page.

    ResolveCollisionRequest:
      oneOf:
        - $ref: "#/components/schemas/ResolveDifferentPeople"
        - $ref: "#/components/schemas/ResolveSamePerson"
      discriminator:
        propertyName: verdict
        mapping:
          DIFFERENT_PEOPLE: "#/components/schemas/ResolveDifferentPeople"
          SAME_PERSON: "#/components/schemas/ResolveSamePerson"

    ResolveDifferentPeople:
      type: object
      additionalProperties: false
      required: [verdict, note]
      properties:
        verdict:
          type: string
          const: DIFFERENT_PEOPLE
        note:
          type: string
          minLength: 3
          maxLength: 500

    ResolveSamePerson:
      type: object
      additionalProperties: false
      required: [verdict, keepEmployeeId, note]
      properties:
        verdict:
          type: string
          const: SAME_PERSON
        keepEmployeeId:
          type: string
          format: uuid
          description: >-
            The record that belongs to the person whose Ghana Card you
            checked: the collision's `employee.id` or `lookedLike.id` (`400`
            for anything else).
        note:
          type: string
          minLength: 3
          maxLength: 500

    PunchFeedItem:
      type: object
      required: [id, employee, deviceUserRef, siteId, deviceId, deviceName, deviceTime, serverTime, direction, method, clockSuspect]
      properties:
        id:
          type: string
          format: uuid
        employee:
          description: "`null` when the user number matched nobody."
          oneOf:
            - $ref: "#/components/schemas/EmployeeRef"
            - type: "null"
        deviceUserRef:
          type: string
        siteId:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        deviceName:
          type: string
        deviceTime:
          type: string
          format: date-time
        serverTime:
          type: string
          format: date-time
        direction:
          $ref: "#/components/schemas/PunchDirection"
        method:
          $ref: "#/components/schemas/PunchMethod"
        clockSuspect:
          type: boolean

    PunchFeedList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PunchFeedItem"
        nextCursor:
          type: [string, "null"]
          description: Pass this as `cursor` to get the next page. It is `null` on the last page.

    ClockInAttempt:
      type: object
      required: [id, deviceId, deviceName, purpose, direction, outcome, staffNumberTried, employee, coSignFor, cancelsAttemptId, attemptedAt, punchId]
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        deviceName:
          type: string
        purpose:
          $ref: "#/components/schemas/AttemptPurpose"
        direction:
          $ref: "#/components/schemas/KioskDirection"
        outcome:
          $ref: "#/components/schemas/AttemptOutcome"
        staffNumberTried:
          type: [string, "null"]
          description: >-
            The staff number typed on the kiosk, for `STAFF_PASSKEY` and
            `CO_SIGN` attempts (kept even when it matches nobody, so someone
            trying numbers shows up); `null` for face attempts.
        employee:
          description: >-
            Who the face (or, for `STAFF_PASSKEY`, the staff number) matched;
            for a `CO_SIGN` attempt that is the supervisor. `null` when nobody
            matched.
          oneOf:
            - $ref: "#/components/schemas/EmployeeRef"
            - type: "null"
        coSignFor:
          description: For a `CO_SIGN` attempt, the worker the supervisor confirmed, if the staff number is known.
          oneOf:
            - $ref: "#/components/schemas/EmployeeRef"
            - type: "null"
        cancelsAttemptId:
          type: [string, "null"]
          format: uuid
          description: For a `NOT_ME` attempt, the matched attempt it cancelled.
        attemptedAt:
          type: string
          format: date-time
        punchId:
          type: [string, "null"]
          format: uuid
          description: The punch this attempt led to, if it was confirmed.

    ClockInAttemptList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClockInAttempt"
        nextCursor:
          type: [string, "null"]
          description: Pass this as `cursor` to get the next page. It is `null` on the last page.

    # --- Payroll (Phase 4) --- Samuel adds payroll schemas here, and nowhere
    # else. Every name carries its module: PayrollPeriod, PayrollRun,
    # PayrollLine, TaxTable, Payslip; operationIds listPayrollRuns,
    # approvePayrollRun, and so on. The two families hanging off an employee
    # keep that resource's name on purpose — EmployeePayTerms and
    # EmployeePaymentDetails, like the existing EmployeeBiometrics.


    PayrollPeriodStatus:
      type: string
      enum: [OPEN, CLOSED]
      description: |
        Where a payroll month is in its life. There are only two values, and it
        never moves backwards.

        - `OPEN`: the month payroll is still working on. Runs may be
          calculated, submitted and approved for it.
        - `CLOSED`: the month is finished, and it never reopens. No new run may
          be calculated for it, and a late punch or a correction becomes an
          adjustment line on the next month's run. Closing changes nothing in
          attendance.

    PayrollPeriod:
      type: object
      description: >-
        One payroll month. Runs are calculated for a period, and a period is
        closed when the month is finished.
      required:
        [
          id,
          year,
          month,
          startDate,
          endDate,
          status,
          closedAt,
          closedByUserId,
          lockedRunId,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
          description: The period's ID.
        year:
          type: integer
          minimum: 2020
          maximum: 2100
          description: The calendar year, like `2026`. With `month` it names the period.
        month:
          type: integer
          minimum: 1
          maximum: 12
          description: >-
            The calendar month, `1` for January to `12` for December. There is
            only ever one period per month.
        startDate:
          type: string
          format: date
          description: The month's first day, like `2026-09-01`. Worked out by the API.
        endDate:
          type: string
          format: date
          description: >-
            The month's last day, like `2026-09-30`. A run pays the work
            segments whose work date falls between `startDate` and `endDate`,
            and reads each employee's pay terms and the tax table version
            effective on this day.
        status:
          $ref: "#/components/schemas/PayrollPeriodStatus"
        closedAt:
          type: [string, "null"]
          format: date-time
          description: >-
            When the period was closed, or `null` while it is `OPEN`. Always set
            together with `closedByUserId`.
        closedByUserId:
          type: [string, "null"]
          format: uuid
          description: >-
            The user who closed the period, or `null` while it is `OPEN`. Always
            set together with `closedAt`.
        lockedRunId:
          type: [string, "null"]
          format: uuid
          description: >-
            The one run of this month that is `LOCKED` or `PAID`, or `null` while
            none has been approved. A month never has two.
        createdAt:
          type: string
          format: date-time
          description: When the period was opened.
        updatedAt:
          type: string
          format: date-time
          description: When the period last changed.

    PayrollPeriodList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PayrollPeriod"
        nextCursor:
          type: [string, "null"]
          description: Pass this as `cursor` to get the next page. It is `null` on the last page.

    CreatePayrollPeriodRequest:
      type: object
      additionalProperties: false
      description: >-
        The month to open. It carries only the two fields that name the month:
        the first day, the last day and the status are the API's to decide, so a
        caller can never open a period that is not a whole calendar month.
      required: [year, month]
      properties:
        year:
          type: integer
          minimum: 2020
          maximum: 2100
          description: The calendar year, like `2026`.
        month:
          type: integer
          minimum: 1
          maximum: 12
          description: The calendar month, `1` for January to `12` for December.

    PayrollRunStatus:
      type: string
      enum: [DRAFT, PENDING_APPROVAL, LOCKED, PAID, REJECTED]
      description: |
        Where a payroll run is in its life. A run only ever moves forward:
        `DRAFT` to `PENDING_APPROVAL` to `LOCKED` to `PAID`, or
        `PENDING_APPROVAL` to `REJECTED`, which is the end of that run. Every
        status carries the evidence of how it got there.

        - `DRAFT`: calculated and not yet submitted. Only the maker may submit
          it, and calculating again simply makes another draft.
        - `PENDING_APPROVAL`: waiting for a checker. Carries the submitter and
          the time they submitted.
        - `LOCKED`: approved. Nothing about the run or its lines can change
          again (a database trigger refuses it) and every payslip PDF exists.
          Carries the approver and the time.
        - `PAID`: the bank file has been sent and an ADMIN recorded it. Carries
          who marked it, when, and the bank's reference.
        - `REJECTED`: the checker refused it, with a reason. Terminal: nothing
          moves backwards, so the maker fixes the cause and calculates a new run.

    PayrollRunExclusionReason:
      type: string
      enum: [SUSPENDED, NO_PAY_TERMS]
      description: |
        Why an employee who was employed during the period has no line on this
        run. Every one of them is listed, so nobody is ever silently dropped.

        - `SUSPENDED`: the worker is temporarily blocked from clocking in and
          from payroll. They are left off on purpose and paid nothing.
        - `NO_PAY_TERMS`: the worker has no pay terms effective by the period's
          last day, so there is no salary to calculate. Set their pay terms and
          calculate a new run.

    PayrollRunExclusion:
      type: object
      description: >-
        One employee who was employed during the period but has no line on this
        run, and why.
      required: [employee, reason]
      properties:
        employee:
          $ref: "#/components/schemas/EmployeeRef"
        reason:
          $ref: "#/components/schemas/PayrollRunExclusionReason"

    PayrollRunTotals:
      type: object
      description: >-
        The run's money, added up across every line. No field carries a
        `minimum`: a run made only of adjustment lines can be negative.
      required:
        [
          totalBasicPesewas,
          totalOvertimePesewas,
          totalTaxableAllowancePesewas,
          totalNonTaxableAllowancePesewas,
          totalGrossPesewas,
          totalSsnitEmployeePesewas,
          totalPayePesewas,
          totalOtherDeductionsPesewas,
          totalNetPayPesewas,
          totalSsnitEmployerPesewas,
        ]
      properties:
        totalBasicPesewas:
          type: integer
          description: >-
            Basic salary across every line, pro-rated where a worker joined or
            left inside the period.
        totalOvertimePesewas:
          type: integer
          description: Overtime pay across every line.
        totalTaxableAllowancePesewas:
          type: integer
          description: Taxable allowances across every line.
        totalNonTaxableAllowancePesewas:
          type: integer
          description: Non-taxable allowances across every line.
        totalGrossPesewas:
          type: integer
          description: "Gross pay: basic plus overtime plus both allowances."
        totalSsnitEmployeePesewas:
          type: integer
          description: >-
            The workers' own SSNIT contributions, 5.5% of basic, deducted from
            their pay.
        totalPayePesewas:
          type: integer
          description: PAYE withheld across every line.
        totalOtherDeductionsPesewas:
          type: integer
          description: >-
            Other deductions across every line, such as uniform or loan
            instalments.
        totalNetPayPesewas:
          type: integer
          description: >-
            What the workers are actually paid, and what the bank file adds up
            to: gross minus employee SSNIT, PAYE and other deductions.
        totalSsnitEmployerPesewas:
          type: integer
          description: >-
            The employer's SSNIT contributions, 13% of basic. A company cost,
            never deducted from anyone's pay; the Tier 1 and Tier 2 split is in
            the statutory summary.

    PayrollRunSummary:
      type: object
      description: Who is on the run, and who is deliberately not.
      required: [lineCount, employeeCount, adjustmentLineCount, excluded]
      properties:
        lineCount:
          type: integer
          minimum: 0
          description: How many lines the run has, adjustment lines included.
        employeeCount:
          type: integer
          minimum: 0
          description: How many different employees are paid on this run.
        adjustmentLineCount:
          type: integer
          minimum: 0
          description: How many of the lines correct a line on an earlier run.
        excluded:
          type: array
          description: >-
            Employees who were employed during the period but have no line, with
            the reason for each. Empty when everybody was paid.
          items:
            $ref: "#/components/schemas/PayrollRunExclusion"

    PayrollRun:
      type: object
      description: >-
        One calculation of one period's pay: a snapshot with its totals, its
        summary and the evidence of every status it has been through. Several
        runs may exist for a period, drafts and rejected ones, but only ever one
        that is `LOCKED` or `PAID`.
      required:
        [
          id,
          periodId,
          periodStartDate,
          periodEndDate,
          status,
          taxTableId,
          taxYear,
          totals,
          summary,
          calculatedAt,
          calculatedByUserId,
          submittedAt,
          submittedByUserId,
          submissionNote,
          approvedAt,
          approvedByUserId,
          approvalNote,
          rejectedAt,
          rejectedByUserId,
          rejectionReason,
          paidAt,
          paidByUserId,
          paidOn,
          paymentReference,
          paymentNote,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
          description: The run's ID.
        periodId:
          type: string
          format: uuid
          description: The payroll period this run calculates.
        periodStartDate:
          type: string
          format: date
          description: The period's first day, copied when the run was calculated.
        periodEndDate:
          type: string
          format: date
          description: >-
            The period's last day. The pay terms and the tax table version used
            are the ones effective on this day.
        status:
          $ref: "#/components/schemas/PayrollRunStatus"
        taxTableId:
          type: string
          format: uuid
          description: >-
            The tax table version every line of this run was calculated with.
            That row can never be edited once a run refers to it.
        taxYear:
          type: integer
          minimum: 2020
          maximum: 2100
          description: The tax year of that version, like `2026`.
          examples: [2026]
        totals:
          $ref: "#/components/schemas/PayrollRunTotals"
        summary:
          $ref: "#/components/schemas/PayrollRunSummary"
        calculatedAt:
          type: string
          format: date-time
          description: >-
            When the draft was calculated. A run is never created any other way,
            so there is no separate `createdAt`.
        calculatedByUserId:
          type: string
          format: uuid
          description: >-
            **The maker**: whoever calculated the draft. They are the only
            person who may submit it, and they may never approve it.
        submittedAt:
          type: [string, "null"]
          format: date-time
          description: >-
            When the maker submitted it for approval. `null` while the run is
            `DRAFT`.
        submittedByUserId:
          type: [string, "null"]
          format: uuid
          description: The maker who submitted it. `null` while the run is `DRAFT`.
        submissionNote:
          description: What the maker wanted the checker to look at, or `null`.
          oneOf:
            - $ref: "#/components/schemas/ResolutionNote"
            - type: "null"
        approvedAt:
          type: [string, "null"]
          format: date-time
          description: When the run was approved and locked. `null` until then.
        approvedByUserId:
          type: [string, "null"]
          format: uuid
          description: >-
            **The checker**: the ADMIN who approved it. Never the same person as
            `submittedByUserId` — the server compares the two, and so does a
            database `CHECK`.
        approvalNote:
          description: What the checker looked at before approving, or `null`.
          oneOf:
            - $ref: "#/components/schemas/ResolutionNote"
            - type: "null"
        rejectedAt:
          type: [string, "null"]
          format: date-time
          description: When the run was rejected. `null` unless it is `REJECTED`.
        rejectedByUserId:
          type: [string, "null"]
          format: uuid
          description: The ADMIN who rejected it. Never the submitter.
        rejectionReason:
          description: >-
            Why the checker rejected it, in their own words. `REJECTED` is
            terminal: the maker fixes the cause and calculates a new run.
          oneOf:
            - $ref: "#/components/schemas/ResolutionNote"
            - type: "null"
        paidAt:
          type: [string, "null"]
          format: date-time
          description: >-
            When an ADMIN recorded the payment in SAMTEC. `null` until the run is
            `PAID`.
        paidByUserId:
          type: [string, "null"]
          format: uuid
          description: The ADMIN who marked the run paid. `null` until then.
        paidOn:
          type: [string, "null"]
          format: date
          description: >-
            The day the money actually left the company's bank, as recorded by
            that ADMIN. `null` until the run is `PAID`.
        paymentReference:
          type: [string, "null"]
          description: >-
            The bank's reference for the transfer, so a payment can be traced.
            `null` when none was given.
        paymentNote:
          description: Anything worth recording about the payment, or `null`.
          oneOf:
            - $ref: "#/components/schemas/ResolutionNote"
            - type: "null"
        updatedAt:
          type: string
          format: date-time
          description: >-
            The run's last status change. A `LOCKED` or `PAID` run's lines never
            change again.

    PayrollRunList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PayrollRun"
        nextCursor:
          type: [string, "null"]
          description: Pass this as `cursor` to get the next page. It is `null` on the last page.

    CreatePayrollRunRequest:
      type: object
      additionalProperties: false
      description: >-
        Which period to calculate. Nothing else is accepted: who is on the run
        is decided by the rules, never by the caller.
      required: [periodId]
      properties:
        periodId:
          type: string
          format: uuid
          description: The `OPEN` payroll period to calculate a draft for.

    SubmitPayrollRunRequest:
      type: object
      additionalProperties: false
      description: >-
        Submitting a draft for approval. Nothing is required, so `{}` is a valid
        body.
      properties:
        note:
          description: >-
            Anything the checker should know before they look. Shown with the
            run; never copied into the audit log.
          allOf:
            - $ref: "#/components/schemas/ResolutionNote"

    ApprovePayrollRunRequest:
      type: object
      additionalProperties: false
      description: >-
        Approving a run and locking it. Nothing is required, so `{}` is a valid
        body.
      properties:
        note:
          description: What the checker looked at before approving. Shown with the run.
          allOf:
            - $ref: "#/components/schemas/ResolutionNote"

    RejectPayrollRunRequest:
      type: object
      additionalProperties: false
      description: Rejecting a run, with the reason the maker needs to act on.
      required: [reason]
      properties:
        reason:
          description: >-
            Why the run is wrong, written for the maker to act on. `REJECTED` is
            terminal, so this is what tells them what to fix before calculating
            a new run. Shown with the run; never copied into the audit log,
            because a person may type a staff number or an account number into
            it and the audit log can never be edited.
          allOf:
            - $ref: "#/components/schemas/ResolutionNote"

    MarkPayrollRunPaidRequest:
      type: object
      additionalProperties: false
      description: Recording that a locked run has been paid.
      required: [paidOn]
      properties:
        paidOn:
          type: string
          format: date
          description: >-
            The day the money left the company's bank. It may not be in the
            future.
        paymentReference:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            The bank's reference for the transfer, so a payment can be traced
            later. Shown with the run; never copied into the audit log.
        note:
          description: >-
            Anything worth recording about the payment, such as a second
            transfer for a late account. Shown with the run; never copied into
            the audit log.
          allOf:
            - $ref: "#/components/schemas/ResolutionNote"

    PayrollLine:
      type: object
      description: >-
        One employee's pay for one run, with every input it was calculated from
        copied into it, so a locked run can be re-checked without reading
        anything else. On an adjustment line (`adjustsLineId` is set) the money
        and minute fields are **differences** from the line being corrected and
        may be negative; on an ordinary line they never are. That is why no
        money or minute field carries a `minimum`. The day counts are never
        negative: they always describe this line's own period as calendar facts.
        Bank and mobile money details are never here.
      required:
        [
          id,
          runId,
          employee,
          employeeStatus,
          adjustsLineId,
          adjustsRunId,
          adjustmentNote,
          payTermsId,
          payTermsEffectiveFrom,
          basicMonthlyPesewas,
          overtimeHourlyPesewas,
          daysInPeriod,
          daysEmployed,
          basicPesewas,
          scheduledMinutes,
          punchedMinutes,
          regularMinutes,
          overtimeMinutes,
          overtimePesewas,
          taxableAllowancePesewas,
          nonTaxableAllowancePesewas,
          grossPesewas,
          taxableGrossPesewas,
          ssnitEmployeePesewas,
          ssnitEmployerPesewas,
          ssnitTier1Pesewas,
          ssnitTier2Pesewas,
          chargeableIncomePesewas,
          payePesewas,
          otherDeductionsPesewas,
          netPayPesewas,
          taxTableId,
          taxYear,
        ]
      properties:
        id:
          type: string
          format: uuid
          description: The line's ID.
        runId:
          type: string
          format: uuid
          description: The run this line belongs to.
        employee:
          $ref: "#/components/schemas/EmployeeRef"
        employeeStatus:
          $ref: "#/components/schemas/EmployeeStatus"
        adjustsLineId:
          type: [string, "null"]
          format: uuid
          description: >-
            The earlier line this one corrects, or `null` for an ordinary line.
        adjustsRunId:
          type: [string, "null"]
          format: uuid
          description: >-
            The run that earlier line sits on, so the dashboard can open it
            without searching. `null` for an ordinary line.
        adjustmentNote:
          description: >-
            Why the correction exists, in plain language, for example `late
            clock-out confirmed for 2026-08-30`. `null` for an ordinary line.
          oneOf:
            - $ref: "#/components/schemas/ResolutionNote"
            - type: "null"
        payTermsId:
          type: string
          format: uuid
          description: >-
            The pay terms row used: the latest one effective on or before the
            period's last day.
        payTermsEffectiveFrom:
          type: string
          format: date
          description: The day those pay terms took effect.
        basicMonthlyPesewas:
          type: integer
          description: The monthly salary from the pay terms, before any pro-rating.
        overtimeHourlyPesewas:
          type: integer
          description: What one hour of overtime pays, from the pay terms.
        daysInPeriod:
          type: integer
          minimum: 1
          description: "Calendar days in the period: the bottom of the pro-rating fraction."
        daysEmployed:
          type: integer
          minimum: 0
          description: >-
            Calendar days of the period the worker was employed for: the top of
            the pro-rating fraction. Fewer than `daysInPeriod` only when they
            joined or left inside it.
        basicPesewas:
          type: integer
          description: >-
            The basic pay this line carries: `basicMonthlyPesewas` times
            `daysEmployed` divided by `daysInPeriod`. Hours worked never reduce
            it — absence is handled by the exception queue, not by docking pay.
        scheduledMinutes:
          type: integer
          description: >-
            What the worker's shift pattern scheduled on the dates they have
            confirmed segments, 480 a day where no pattern is assigned. The
            basic pay assumes these. From Phase 5, detection rule R3 compares it
            with `punchedMinutes`.
        punchedMinutes:
          type: integer
          description: >-
            Minutes actually worked: the sum of the `CONFIRMED` work segments
            whose work date falls in the period. Disputed and voided segments
            are not paid and are not counted here.
        regularMinutes:
          type: integer
          description: >-
            The part of `punchedMinutes` inside the scheduled length of each
            work date.
        overtimeMinutes:
          type: integer
          description: >-
            The part of `punchedMinutes` beyond the scheduled length of each
            work date. `regularMinutes` plus `overtimeMinutes` is always
            `punchedMinutes`.
        overtimePesewas:
          type: integer
          description: >-
            `overtimeMinutes` divided by 60, times `overtimeHourlyPesewas`.
            There is no night or public-holiday premium in version 1.
        taxableAllowancePesewas:
          type: integer
          description: >-
            The monthly taxable allowance from the pay terms, copied whole:
            version 1 pro-rates only the basic.
        nonTaxableAllowancePesewas:
          type: integer
          description: The monthly non-taxable allowance from the pay terms, copied whole.
        grossPesewas:
          type: integer
          description: >-
            Gross pay: `basicPesewas` plus `overtimePesewas` plus both
            allowances.
        taxableGrossPesewas:
          type: integer
          description: >-
            The taxed part of the gross: `grossPesewas` minus
            `nonTaxableAllowancePesewas`.
        ssnitEmployeePesewas:
          type: integer
          description: >-
            The worker's own SSNIT contribution, 5.5% of `basicPesewas`,
            deducted from their pay.
        ssnitEmployerPesewas:
          type: integer
          description: >-
            The employer's SSNIT contribution, 13% of `basicPesewas`. A company
            cost: it is never part of the net-pay sum.
        ssnitTier1Pesewas:
          type: integer
          description: The 13.5% of `basicPesewas` that SSNIT keeps for Tier 1.
        ssnitTier2Pesewas:
          type: integer
          description: >-
            The 5% of `basicPesewas` paid into the worker's Tier 2 fund. Both
            percentages are worked out from basic; the 5% is not a slice of the
            employer's 13%.
        chargeableIncomePesewas:
          type: integer
          description: >-
            What PAYE is worked out from: `taxableGrossPesewas` minus
            `ssnitEmployeePesewas`.
        payePesewas:
          type: integer
          description: >-
            PAYE from the graduated monthly bands of the tax table version
            below. Version 1 applies no personal reliefs.
        otherDeductionsPesewas:
          type: integer
          description: >-
            The monthly deduction copied from the pay terms'
            `otherDeductionPesewas`, such as a uniform or a loan instalment.
        netPayPesewas:
          type: integer
          description: >-
            What the worker is paid: `grossPesewas` minus `ssnitEmployeePesewas`
            minus `payePesewas` minus `otherDeductionsPesewas`. A database
            `CHECK` proves this on every line, and the employer's SSNIT never
            appears in it.
        taxTableId:
          type: string
          format: uuid
          description: >-
            The tax table version used, the one effective on the period's last
            day. That row can never be edited or deleted once a run refers to
            it, so this line's arithmetic can always be reproduced.
        taxYear:
          type: integer
          minimum: 2020
          maximum: 2100
          description: The tax year of that version, like `2026`.
          examples: [2026]

    PayrollLineList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PayrollLine"
        nextCursor:
          type: [string, "null"]
          description: Pass this as `cursor` to get the next page. It is `null` on the last page.

    PayrollStatutorySummary:
      type: object
      description: >-
        What one run owes the statutory funds, SSNIT and the GRA. Every amount
        is the sum of the matching field across the run's lines, and every
        percentage is shown in basis points beside the amount it produced, so a
        figure can be checked by hand. Version 1 reports these amounts; paying
        them stays manual.
      required:
        [
          runId,
          status,
          periodId,
          periodStartDate,
          periodEndDate,
          taxTableId,
          taxYear,
          employeeCount,
          totalBasicPesewas,
          ssnitEmployeeBasisPoints,
          totalSsnitEmployeePesewas,
          ssnitEmployerBasisPoints,
          totalSsnitEmployerPesewas,
          totalSsnitPesewas,
          ssnitTier1BasisPoints,
          totalSsnitTier1Pesewas,
          ssnitTier2BasisPoints,
          totalSsnitTier2Pesewas,
          totalPayePesewas,
          generatedAt,
        ]
      properties:
        runId:
          type: string
          format: uuid
          description: The run these figures come from.
        status:
          $ref: "#/components/schemas/PayrollRunStatus"
        periodId:
          type: string
          format: uuid
          description: The payroll period the run calculates.
        periodStartDate:
          type: string
          format: date
          description: The period's first day.
        periodEndDate:
          type: string
          format: date
          description: The period's last day.
        taxTableId:
          type: string
          format: uuid
          description: The tax table version the percentages below come from.
        taxYear:
          type: integer
          minimum: 2020
          maximum: 2100
          description: The tax year of that version, like `2026`.
          examples: [2026]
        employeeCount:
          type: integer
          minimum: 0
          description: How many workers these figures cover.
        totalBasicPesewas:
          type: integer
          description: The basic pay every SSNIT percentage below is worked out from.
        ssnitEmployeeBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
          description: "The workers' own rate in basis points: 550 is 5.5%."
        totalSsnitEmployeePesewas:
          type: integer
          description: The workers' own SSNIT contributions, deducted from their pay.
        ssnitEmployerBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
          description: "The employer's rate in basis points: 1300 is 13%."
        totalSsnitEmployerPesewas:
          type: integer
          description: >-
            The employer's SSNIT contributions. A company cost, never deducted
            from anyone's pay.
        totalSsnitPesewas:
          type: integer
          description: >-
            The whole 18.5% that goes to SSNIT: the workers' 5.5% plus the
            employer's 13%.
        ssnitTier1BasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
          description: "The Tier 1 rate in basis points: 1350 is 13.5%."
        totalSsnitTier1Pesewas:
          type: integer
          description: The part of the 18.5% SSNIT keeps for Tier 1.
        ssnitTier2BasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
          description: "The Tier 2 rate in basis points: 500 is 5%."
        totalSsnitTier2Pesewas:
          type: integer
          description: >-
            The part paid into the workers' Tier 2 funds. Both percentages are
            of basic, so Tier 1 plus Tier 2 is the whole 18.5%; the 5% is not a
            slice of the employer's 13%.
        totalPayePesewas:
          type: integer
          description: The PAYE withheld from every line, due to the GRA.
        generatedAt:
          type: string
          format: date-time
          description: When these figures were worked out from the run's lines.

    Payslip:
      type: object
      description: >-
        One worker's pay for one period, frozen when the run locked. It carries
        every number needed to check the pay by hand — the pay terms that were
        used, the hours, the tax table version, and each step from gross to net
        — so nothing else has to be fetched, which matters because a guard may
        not read a run, its lines or the tax tables. There is one payslip per
        payroll line, so a correction raised in a later period has a payslip of
        its own. An adjustment payslip may carry negative amounts and minutes,
        so no money or minute field has a `minimum`. It never carries bank or
        mobile money details: those live only in the bank export.
      required:
        [
          id,
          lineId,
          runId,
          periodId,
          periodStartDate,
          periodEndDate,
          employee,
          runStatus,
          paidAt,
          basicMonthlyPesewas,
          daysInPeriod,
          daysEmployed,
          basicPesewas,
          scheduledMinutes,
          regularMinutes,
          overtimeMinutes,
          punchedMinutes,
          overtimeHourlyPesewas,
          overtimePesewas,
          taxableAllowancePesewas,
          nonTaxableAllowancePesewas,
          grossPesewas,
          taxableGrossPesewas,
          ssnitEmployeeBasisPoints,
          ssnitEmployeePesewas,
          ssnitEmployerBasisPoints,
          ssnitEmployerPesewas,
          chargeableIncomePesewas,
          payePesewas,
          otherDeductionsPesewas,
          netPayPesewas,
          taxTableId,
          taxYear,
          adjustsLineId,
          adjustmentNote,
          pdfGeneratedAt,
          pdfSizeBytes,
          pdfSha256,
        ]
      properties:
        id:
          type: string
          format: uuid
          description: The payslip's ID.
        lineId:
          type: string
          format: uuid
          description: The payroll line this payslip was made from. One payslip per line.
        runId:
          type: string
          format: uuid
          description: The run that produced it.
        periodId:
          type: string
          format: uuid
          description: The period the run covers.
        periodStartDate:
          type: string
          format: date
          description: The first day of the period.
        periodEndDate:
          type: string
          format: date
          description: >-
            The last day of the period. The pay terms and tax table in force on
            this day are the ones used.
        employee:
          $ref: "#/components/schemas/EmployeeRef"
        runStatus:
          description: >-
            `LOCKED` until an ADMIN marks the run paid, then `PAID`; no other
            value can ever appear on a payslip, because a payslip exists only
            once its run is locked. Read live from the run, so it can change
            after the PDF was made, as can `paidAt`; everything else here is the
            frozen snapshot.
          allOf:
            - $ref: "#/components/schemas/PayrollRunStatus"
        paidAt:
          type: [string, "null"]
          format: date-time
          description: >-
            When an ADMIN marked the run paid, or `null` while it is only
            locked.
        basicMonthlyPesewas:
          type: integer
          description: >-
            The full monthly salary from the pay terms used, before any
            pro-rating.
        daysInPeriod:
          type: integer
          minimum: 1
          description: "Calendar days in the period: the bottom of the pro-rating fraction."
        daysEmployed:
          type: integer
          minimum: 0
          description: >-
            Calendar days of the period the worker was employed for: the top of
            the pro-rating fraction.
        basicPesewas:
          type: integer
          description: >-
            Basic pay for the period: the monthly salary pro-rated by days
            employed. Hours worked never reduce it.
        scheduledMinutes:
          type: integer
          description: >-
            What the shift pattern scheduled on the days worked, so the overtime
            minutes below can be checked against something.
        regularMinutes:
          type: integer
          description: >-
            Confirmed minutes worked within the scheduled length of each day's
            shift. They are already covered by the basic.
        overtimeMinutes:
          type: integer
          description: >-
            Confirmed minutes worked beyond the scheduled length of each day's
            shift.
        punchedMinutes:
          type: integer
          description: >-
            Minutes the worker actually punched in the period, from confirmed
            work segments: `regularMinutes` plus `overtimeMinutes`.
        overtimeHourlyPesewas:
          type: integer
          description: The overtime rate for one hour, copied from the pay terms used.
        overtimePesewas:
          type: integer
          description: "Overtime pay: the overtime minutes at the overtime rate."
        taxableAllowancePesewas:
          type: integer
          description: >-
            The monthly allowance that is taxed, copied from the pay terms used.
        nonTaxableAllowancePesewas:
          type: integer
          description: >-
            The monthly allowance that is not taxed, copied from the pay terms
            used.
        grossPesewas:
          type: integer
          description: "Gross pay: basic plus overtime plus both allowances."
        taxableGrossPesewas:
          type: integer
          description: >-
            The part of gross that is taxed: basic plus overtime plus the
            taxable allowance, leaving the non-taxable allowance out.
        ssnitEmployeeBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            The employee SSNIT rate used, in basis points (550 means 5.5%).
        ssnitEmployeePesewas:
          type: integer
          description: >-
            The worker's own SSNIT contribution, worked out on the basic and
            deducted from their pay.
        ssnitEmployerBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            The employer SSNIT rate used, in basis points (1300 means 13%).
        ssnitEmployerPesewas:
          type: integer
          description: >-
            What the company pays SSNIT on top of the salary. Shown so the
            worker can see it; it is never deducted from their pay.
        chargeableIncomePesewas:
          type: integer
          description: >-
            The income PAYE was worked out on: taxable gross minus the worker's
            SSNIT contribution.
        payePesewas:
          type: integer
          description: >-
            Income tax, from the graduated monthly bands of the tax table named
            below.
        otherDeductionsPesewas:
          type: integer
          description: >-
            Other monthly deductions copied from the pay terms used, such as a
            uniform or a loan instalment.
        netPayPesewas:
          type: integer
          description: >-
            What the worker is paid: gross minus employee SSNIT, minus PAYE,
            minus other deductions. The employer's SSNIT is never in this sum.
        taxTableId:
          type: string
          format: uuid
          description: >-
            The frozen tax table version used, so the arithmetic can always be
            reproduced.
        taxYear:
          type: integer
          minimum: 2020
          maximum: 2100
          description: >-
            The tax year of that version, like `2026`, so the payslip names its
            own rates.
          examples: [2026]
        adjustsLineId:
          type: [string, "null"]
          format: uuid
          description: >-
            For a correction, the earlier payroll line this one puts right;
            `null` on an ordinary payslip.
        adjustmentNote:
          description: >-
            Why the correction exists, so the worker is told; `null` on an
            ordinary payslip.
          oneOf:
            - $ref: "#/components/schemas/ResolutionNote"
            - type: "null"
        pdfGeneratedAt:
          type: string
          format: date-time
          description: "When the PDF was made: the moment the run was locked."
        pdfSizeBytes:
          type: integer
          minimum: 1
          description: Size of the stored PDF in bytes.
        pdfSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: >-
            SHA-256 of the stored PDF bytes, so what was sent can be proved to
            be exactly what exists.

    PayslipList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Payslip"
        nextCursor:
          type: [string, "null"]
          description: Pass this as `cursor` to get the next page. It is `null` on the last page.

    TaxBand:
      type: object
      additionalProperties: false
      description: >-
        One step of the graduated PAYE table. Bands apply in order: each one
        taxes the next slice of chargeable monthly income. A band has no ID of
        its own, because bands are only ever read and written as a whole table.
      required: [ordinal, widthPesewas, rateBasisPoints]
      properties:
        ordinal:
          type: integer
          minimum: 1
          maximum: 20
          description: >-
            Its position in the table, starting at 1. Bands are applied in this
            order.
        widthPesewas:
          type: [integer, "null"]
          minimum: 1
          description: >-
            How much chargeable monthly income this band covers, in pesewas
            (the 2026 first band is 49000, GHS 490). `null` only on the last
            band, which has no upper limit.
        rateBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
          description: The tax rate on this slice as basis points (1750 is 17.5%).

    TaxTable:
      type: object
      description: >-
        One frozen version of Ghana's statutory rates: the four SSNIT
        percentages, the graduated PAYE monthly bands, and where the figures
        came from. A run copies the version in force on its period's last day,
        so a locked run's arithmetic can always be reproduced. A version is
        never edited or deleted — a rate change is a new version — which is why
        there is no `updatedAt` here.
      required:
        [
          id,
          taxYear,
          effectiveFrom,
          effectiveTo,
          ssnitEmployeeBasisPoints,
          ssnitEmployerBasisPoints,
          ssnitTier1BasisPoints,
          ssnitTier2BasisPoints,
          bands,
          sourceName,
          sourceUrl,
          sourceCheckedOn,
          createdAt,
          createdByUserId,
        ]
      properties:
        id:
          type: string
          format: uuid
          description: The tax table version's ID.
        taxYear:
          type: integer
          minimum: 2020
          maximum: 2100
          description: >-
            The tax year these rates belong to, like `2026`. Not unique on its
            own: a mid-year budget makes a second version for the same year.
          examples: [2026]
        effectiveFrom:
          type: string
          format: date
          description: The first day this version applies.
        effectiveTo:
          type: [string, "null"]
          format: date
          description: >-
            The last day it applies, or `null` when no end was set. A later
            version supersedes this one without changing it.
        ssnitEmployeeBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            The employee's SSNIT contribution as basis points of basic pay
            (550 is 5.5%). The only SSNIT amount ever deducted from a worker.
        ssnitEmployerBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            The employer's SSNIT contribution as basis points of basic pay
            (1300 is 13%). A company cost, never a deduction and never in the
            net pay sum.
        ssnitTier1BasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            The share of basic pay SSNIT keeps for Tier 1, as basis points
            (1350 is 13.5%). Part of the 18.5% total.
        ssnitTier2BasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            The share of basic pay that goes to the worker's Tier 2 fund, as
            basis points (500 is 5%). Part of the 18.5% total, not a slice of
            the employer's 13%.
        bands:
          type: array
          minItems: 1
          maxItems: 20
          description: >-
            The graduated PAYE monthly bands in order, from the first (0%) to
            the top, unbounded one.
          items:
            $ref: "#/components/schemas/TaxBand"
        sourceName:
          type: string
          description: What the figures were read from, like `GRA PAYE rates 2026`.
          examples: ["GRA PAYE rates 2026"]
        sourceUrl:
          type: string
          format: uri
          description: The published page or document the figures came from.
        sourceCheckedOn:
          type: string
          format: date
          description: >-
            The day a person last checked these figures against that source. A
            rate nobody can trace is a rate nobody can defend.
        createdAt:
          type: string
          format: date-time
          description: When this version was added.
        createdByUserId:
          type: string
          format: uuid
          description: >-
            The ADMIN who added it. Nothing here changes afterwards, so there is
            no updater.

    TaxTableList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TaxTable"
        nextCursor:
          type: [string, "null"]
          description: Pass this as `cursor` to get the next page. It is `null` on the last page.

    CreateTaxTableRequest:
      type: object
      additionalProperties: false
      description: >-
        A new version of the statutory rates. Only the last band may leave out
        its width; the server rejects a gap or a wrong order in `ordinal`, a
        band other than the last with `widthPesewas: null`, and a
        `sourceCheckedOn` in the future.
      required:
        [
          taxYear,
          effectiveFrom,
          ssnitEmployeeBasisPoints,
          ssnitEmployerBasisPoints,
          ssnitTier1BasisPoints,
          ssnitTier2BasisPoints,
          bands,
          sourceName,
          sourceUrl,
          sourceCheckedOn,
        ]
      properties:
        taxYear:
          type: integer
          minimum: 2020
          maximum: 2100
          description: The tax year these rates belong to, like `2026`.
        effectiveFrom:
          type: string
          format: date
          description: >-
            The first day this version applies. No other version of this company
            may start on the same day.
        effectiveTo:
          type: [string, "null"]
          format: date
          description: >-
            Leave it out unless this version is already known to stop on a given
            day: a later version supersedes this one on its own, because a
            period always uses the version with the latest `effectiveFrom` on or
            before its last day, and a frozen row can never be edited to close
            it. Must not be before `effectiveFrom`.
        ssnitEmployeeBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
          description: "The employee's rate in basis points: 550 is 5.5%."
        ssnitEmployerBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
          description: "The employer's rate in basis points: 1300 is 13%."
        ssnitTier1BasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
          description: "The Tier 1 rate in basis points: 1350 is 13.5%."
        ssnitTier2BasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            The Tier 2 rate in basis points: 500 is 5%. It is of basic pay, not
            a slice of the employer's 13%.
        bands:
          type: array
          minItems: 1
          maxItems: 20
          description: >-
            The graduated PAYE monthly bands in order. `ordinal` runs from 1
            with no gaps, and the last band **must** have `widthPesewas: null`
            while no earlier one may: without an open top band the highest
            earners would be silently untaxed.
          items:
            $ref: "#/components/schemas/TaxBand"
        sourceName:
          type: string
          minLength: 2
          maxLength: 200
          description: What the figures were read from.
        sourceUrl:
          type: string
          format: uri
          maxLength: 500
          description: The published page or document the figures came from.
        sourceCheckedOn:
          type: string
          format: date
          description: >-
            The day a person last checked these figures against that source. It
            may not be in the future.

    EmployeePayTerms:
      type: object
      description: >-
        One effective-dated row of what an employee is paid. Rows are never
        edited: each change is a new row, and a run reads the row with the
        latest `effectiveFrom` on or before the period's last day and copies
        every value into the payroll line. Hours worked never reduce
        `basicMonthlyPesewas` — absence is handled by the exception queue, not
        by docking pay.
      required:
        [
          id,
          employeeId,
          effectiveFrom,
          basicMonthlyPesewas,
          overtimeHourlyPesewas,
          taxableAllowancePesewas,
          nonTaxableAllowancePesewas,
          otherDeductionPesewas,
          createdAt,
          createdByUserId,
        ]
      properties:
        id:
          type: string
          format: uuid
          description: This pay terms row's ID.
        employeeId:
          type: string
          format: uuid
          description: The employee these terms belong to.
        effectiveFrom:
          type: string
          format: date
          description: >-
            The first day these terms apply. A row with a later date supersedes
            this one.
        basicMonthlyPesewas:
          type: integer
          minimum: 0
          description: >-
            The monthly salary in pesewas. Paid in full for a whole period, and
            pro-rated by calendar days employed when the worker joined or left
            inside it.
        overtimeHourlyPesewas:
          type: integer
          minimum: 0
          description: >-
            Paid per hour of overtime, in pesewas. Overtime is the confirmed
            minutes beyond what the shift pattern schedules for that date.
        taxableAllowancePesewas:
          type: integer
          minimum: 0
          description: A monthly allowance that is taxed, in pesewas.
        nonTaxableAllowancePesewas:
          type: integer
          minimum: 0
          description: A monthly allowance that is not taxed, in pesewas.
        otherDeductionPesewas:
          type: integer
          minimum: 0
          description: >-
            A monthly deduction taken after tax, in pesewas, such as a uniform
            or a loan instalment. It reaches the payroll line as
            `otherDeductionsPesewas`.
        createdAt:
          type: string
          format: date-time
          description: When this row was stored.
        createdByUserId:
          type: string
          format: uuid
          description: Who stored it. The row is never edited, so this never changes.

    EmployeePayTermsList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EmployeePayTerms"
        nextCursor:
          type: [string, "null"]
          description: Pass this as `cursor` to get the next page. It is `null` on the last page.

    SetEmployeePayTermsRequest:
      type: object
      additionalProperties: false
      description: >-
        What an employee is paid from a given date. Every field is required: the
        new row states the whole of the worker's pay from `effectiveFrom`, and
        nothing is carried over from the row before it. Storing it adds a row;
        it never changes one. Each money field is capped at 100000000 pesewas,
        GHS 1,000,000 a month, so that the four of them added together on a
        payroll line still fit the database's `INTEGER` column with room to
        spare. The database refuses anything above the cap as well.
      required:
        [
          effectiveFrom,
          basicMonthlyPesewas,
          overtimeHourlyPesewas,
          taxableAllowancePesewas,
          nonTaxableAllowancePesewas,
          otherDeductionPesewas,
        ]
      properties:
        effectiveFrom:
          type: string
          format: date
          description: >-
            The first day these terms apply. This employee may not already have
            a row starting on that day.
        basicMonthlyPesewas:
          type: integer
          minimum: 0
          maximum: 100000000
          description: The monthly salary in pesewas.
        overtimeHourlyPesewas:
          type: integer
          minimum: 0
          maximum: 100000000
          description: >-
            Paid per hour of overtime, in pesewas. Send `0` when the worker gets
            no overtime pay.
        taxableAllowancePesewas:
          type: integer
          minimum: 0
          maximum: 100000000
          description: A monthly allowance that is taxed, in pesewas. Send `0` for none.
        nonTaxableAllowancePesewas:
          type: integer
          minimum: 0
          maximum: 100000000
          description: >-
            A monthly allowance that is not taxed, in pesewas. Send `0` for
            none.
        otherDeductionPesewas:
          type: integer
          minimum: 0
          maximum: 100000000
          description: >-
            A monthly deduction taken after tax, in pesewas. Send `0` for none.

    EmployeePaymentDetails:
      type: object
      description: >-
        Where an employee's salary is paid: one row per employee, edited in
        place. **Personal data** — it is never logged, never put in an error
        message and never returned by a list endpoint, so it appears only here
        and inside the run's bank export. The row has no ID of its own: it is
        addressed by the employee, the way `EmployeeBiometrics` is.
      required:
        [employeeId, bankName, accountName, accountNumber, momoNumber, updatedAt, updatedByUserId]
      properties:
        employeeId:
          type: string
          format: uuid
          description: The employee these details belong to.
        bankName:
          type: [string, "null"]
          description: The bank the salary is paid into, or `null` if none is on file.
        accountName:
          type: [string, "null"]
          description: >-
            The name on the account, exactly as the bank holds it, or `null`.
        accountNumber:
          type: [string, "null"]
          description: The account number the bank export pays into, or `null`.
        momoNumber:
          description: >-
            The mobile money number, or `null`. Written `+233` and nine digits,
            like every other phone number in the contract.
          oneOf:
            - $ref: "#/components/schemas/GhanaPhoneNumber"
            - type: "null"
        updatedAt:
          type: string
          format: date-time
          description: When these details were last changed.
        updatedByUserId:
          type: string
          format: uuid
          description: Who last changed them.

    SetEmployeePaymentDetailsRequest:
      type: object
      additionalProperties: false
      description: >-
        Replaces an employee's payment details. All four fields are required:
        send `null` for anything the worker does not have, so a detail is only
        ever cleared on purpose. Nothing sent here is logged or echoed in an
        error message — a rejected field is named, never quoted.
      required: [bankName, accountName, accountNumber, momoNumber]
      properties:
        bankName:
          type: [string, "null"]
          minLength: 2
          maxLength: 100
          pattern: "^[^=+@\\t\\r\\n\"-][^\\t\\r\\n]*$"
          description: >-
            The bank the salary is paid into, or `null`. Because this value is
            written into the bank file, it may not contain a tab or a line
            break, and may not begin with `=`, `+`, `-`, `@` or a quote,
            which a spreadsheet would read as a formula.
        accountName:
          type: [string, "null"]
          minLength: 2
          maxLength: 100
          pattern: "^[^=+@\\t\\r\\n\"-][^\\t\\r\\n]*$"
          description: >-
            The name on the account, exactly as the bank holds it, or `null`.
            Because this value is written into the bank file, it may not contain
            a tab or a line break, and may not begin with `=`, `+`, `-`,
            `@` or a quote, which a spreadsheet would read as a formula.
        accountNumber:
          type: [string, "null"]
          pattern: "^[0-9]{5,20}$"
          description: The account number, digits only, or `null`.
        momoNumber:
          description: The mobile money number in `+233` form, or `null`.
          oneOf:
            - $ref: "#/components/schemas/GhanaPhoneNumber"
            - type: "null"



    DetectionRuleCode:
      type: string
      description: |
        The rule that fired (docs/plan/08-ghost-detection-engine.md).
        - `R1` duplicate enrollment · `R2` identity collision
        - `R3` paid without presence · `R4` bilocation
        - `R5` never seen · `R6` terminated but active
        - `R7` fallback abuse · `R8` robot regularity
        - `R9` device anomaly · `R10` orphan punches
        - `R11` conflicted decision
      enum: [R1, R2, R3, R4, R5, R6, R7, R8, R9, R10, R11]

    DetectionSeverity:
      type: string
      enum: [CRITICAL, HIGH, MEDIUM]

    DetectionAlertStatus:
      type: string
      description: |
        - `OPEN` — raised, nobody has looked yet.
        - `UNDER_REVIEW` — somebody is checking it.
        - `RESOLVED` — a person decided it was explained.
        - `CONFIRMED_FRAUD` — a person decided it was real. A record of what
          was found, never an action taken against anybody by the system.
      enum: [OPEN, UNDER_REVIEW, RESOLVED, CONFIRMED_FRAUD]

    DetectionAlert:
      type: object
      required:
        [id, ruleCode, severity, status, subject, windowFrom, windowTo, evidence, openedAt, resolution]
      properties:
        id:
          type: string
          format: uuid
        ruleCode:
          $ref: "#/components/schemas/DetectionRuleCode"
        severity:
          $ref: "#/components/schemas/DetectionSeverity"
        status:
          $ref: "#/components/schemas/DetectionAlertStatus"
        subject:
          $ref: "#/components/schemas/DetectionSubject"
        windowFrom:
          type: string
          format: date
          description: The first day the rule looked at.
        windowTo:
          type: string
          format: date
        evidence:
          type: object
          additionalProperties: true
          description: >-
            The rows and numbers this rule cited — punch IDs, segment IDs,
            payroll line IDs, counts, match scores. Its shape depends on the
            rule, and each rule's shape is pinned by a test. It never carries
            a template, an image or a Ghana Card number.
        openedAt:
          type: string
          format: date-time
        resolution:
          oneOf:
            - $ref: "#/components/schemas/DetectionResolution"
            - type: "null"

    DetectionSubject:
      type: object
      description: Who or what the alert is about. At least one field is set.
      required: [employee, device, siteId]
      properties:
        employee:
          oneOf:
            - $ref: "#/components/schemas/EmployeeRef"
            - type: "null"
          description: >-
            For a rule about a supervisor (R7), this is the supervisor.
        device:
          oneOf:
            - $ref: "#/components/schemas/DetectionDeviceRef"
            - type: "null"
        siteId:
          type: [string, "null"]
          format: uuid

    DetectionDeviceRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    DetectionResolution:
      type: object
      required: [decidedByUserId, decidedAt, note]
      properties:
        decidedByUserId:
          type: string
          format: uuid
        decidedAt:
          type: string
          format: date-time
        note:
          type: string

    DetectionAlertList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DetectionAlert"
        nextCursor:
          type: [string, "null"]
          description: Pass this as `cursor` to get the next page. It is `null` on the last page.

    ResolveDetectionAlertRequest:
      type: object
      additionalProperties: false
      required: [status, note]
      properties:
        status:
          type: string
          description: Only these two close an alert.
          enum: [RESOLVED, CONFIRMED_FRAUD]
        note:
          type: string
          minLength: 3
          maxLength: 500
          description: Why. Required, and audited.

    DetectionRule:
      type: object
      required: [code, name, description, severity, enabled, thresholds, updatedAt]
      properties:
        code:
          $ref: "#/components/schemas/DetectionRuleCode"
        name:
          type: string
        description:
          type: string
          description: One sentence a non-technical reader understands.
        severity:
          $ref: "#/components/schemas/DetectionSeverity"
        enabled:
          type: boolean
        thresholds:
          type: object
          additionalProperties: true
          description: >-
            The numbers this rule uses, named. Empty for a rule that has none
            (R1, R6 and R11 are facts, not gradients).
        updatedAt:
          type: string
          format: date-time

    DetectionRuleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DetectionRule"

    UpdateDetectionRuleRequest:
      type: object
      additionalProperties: false
      description: Send at least one field.
      properties:
        enabled:
          type: boolean
        thresholds:
          type: object
          additionalProperties: true
          description: Replaces the whole set. The server refuses a name the rule does not use.

    DetectionSweepResult:
      type: object
      required: [ranAt, raised, rulesRun, rulesSkipped]
      properties:
        ranAt:
          type: string
          format: date-time
        raised:
          type: integer
          description: New alerts. A finding already raised is not raised twice.
        rulesRun:
          type: array
          items:
            $ref: "#/components/schemas/DetectionRuleCode"
        rulesSkipped:
          type: array
          description: Rules switched off, or that failed and were skipped.
          items:
            $ref: "#/components/schemas/DetectionRuleCode"

    DailySweepResult:
      type: object
      required: [companiesSwept]
      properties:
        companiesSwept:
          type: integer
          minimum: 0
          description: Zero when every company was already swept in the last twenty hours.

    RiskScore:
      type: object
      required: [employee, score, openAlerts, topRule]
      properties:
        employee:
          $ref: "#/components/schemas/EmployeeRef"
        score:
          type: integer
          description: Severity times recurrence, added up over the open alerts.
        openAlerts:
          type: integer
        topRule:
          $ref: "#/components/schemas/DetectionRuleCode"

    RiskScoreList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RiskScore"
