openapi: 3.1.1

info:
  title: SAMTEC Security System API
  version: "0.1.0"
  summary: Biometric attendance and payroll for security companies.
  description: |
    This document is the **API contract**: the single agreement between the
    frontend (`apps/web`) and the backend (`apps/api`).

    **Golden rule:** change this file first, in its own pull request, and get
    both developers to approve it. Only then write the code. See
    `docs/guides/05-api-contract-workflow.md`.

    ## Conventions used by every endpoint

    - **Money** is an integer number of **pesewas** (GHS 1.00 = 100 pesewas).
      Money field names end in `Pesewas`.
    - **Timestamps** are UTC in ISO 8601 format, for example
      `2026-09-15T06:00:00Z`. The dashboard shows them in Ghana time
      (Africa/Accra).
    - **Calendar dates** without a time use `YYYY-MM-DD`.
    - **IDs** are UUIDs (version 7).
    - **Errors** use Problem Details (RFC 9457) with the content type
      `application/problem+json`.
    - **Lists** use cursor pagination. Send the `nextCursor` from one page as
      the `cursor` of the next request. `nextCursor: null` means there are no
      more pages.
  contact:
    name: Alpha Team
    url: https://github.com/TEAM-DEVV/samtec-security-system

servers:
  - url: /api/v1
    description: >-
      The API's own address, for example http://localhost:3000/api/v1 during
      development. The dashboard sets the full address in its configuration.

tags:
  - name: System
    description: Service health. Available from Phase 0.
  - name: Auth
    description: Sign-in, sessions and two-factor authentication. Built in Phase 1.
  - name: Users
    description: >-
      Sign-in accounts, managed by administrators: create, change, switch off
      and reset. Built in Phase 1.
  - name: Employees
    description: Guards and staff on the company payroll. Built in Phase 1.
  - name: Sites
    description: Client locations where guards are posted. Built in Phase 1.
  - name: Rosters
    description: >-
      Posts (named guard positions at a site, like "Main Gate") and shift
      patterns (working hours, like a night shift from 18:00 to 06:00).
      Built in Phase 1.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Check that the API and its database are working
      description: >-
        Public endpoint. The dashboard's System Status page calls it, and
        hosting platforms use it to decide whether the service is alive.
        Anyone on the internet can call it, so it deliberately reveals nothing
        else, such as the API version or environment. The database check is
        reused for 5 seconds, so frequent calls stay cheap.
      security: []
      responses:
        "200":
          description: The API and the database are working.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                healthy:
                  summary: Everything is up
                  value:
                    status: ok
                    time: "2026-09-15T08:30:00Z"
                    checks:
                      database: up
        "503":
          description: The API is running, but the database cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                databaseDown:
                  summary: Database is down
                  value:
                    status: degraded
                    time: "2026-09-15T08:30:00Z"
                    checks:
                      database: down

  /system/info:
    get:
      tags: [System]
      operationId: getSystemInfo
      summary: Get version details about the running API
      description: >-
        **Roles:** ADMIN. The public `/health` endpoint deliberately reveals
        nothing about the system, so administrators read the version,
        environment and uptime here instead.
      responses:
        "200":
          description: Details about the running API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
              examples:
                running:
                  summary: A healthy development API
                  value:
                    version: "0.1.0"
                    environment: development
                    uptimeSeconds: 42
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with email and password
      description: |
        On success, the response body holds a short-lived **access token**
        (15 minutes) and the API sets a long-lived **refresh token** in an
        `HttpOnly` cookie named `samtec_refresh`. JavaScript cannot read that
        cookie, which protects it from cross-site scripting.

        Accounts with the `ADMIN` or `HR_PAYROLL` role must use two-factor
        authentication. The response `status` tells the dashboard what to do
        next:

        - `AUTHENTICATED`: signed in, with no second step.
        - `TWO_FACTOR_REQUIRED`: call `POST /auth/2fa/verify` with the
          `challengeToken` and a code from the user's authenticator app.
        - `TWO_FACTOR_SETUP_REQUIRED`: the account has not set up two-factor
          authentication yet. Call `POST /auth/2fa/setup`, show the QR code,
          then call `POST /auth/2fa/enable` with the first code.

        **Protection against password guessing:** repeated failures for the
        same email are slowed down, then answered with `429` for 15 minutes.
        This happens whether or not an account exists, so the answers never
        reveal which emails have accounts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              supervisor:
                summary: A supervisor signs in
                value:
                  email: ama.boateng@samtec.example
                  password: correct-horse-battery-staple
      responses:
        "200":
          description: Signed in, or a second factor is required.
          headers:
            Set-Cookie:
              description: The refresh token cookie. Only sent when `status` is `AUTHENTICATED`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              examples:
                authenticated:
                  summary: Signed in with no second factor needed
                  value:
                    status: AUTHENTICATED
                    accessToken: example-access-token
                    expiresInSeconds: 900
                    user:
                      id: 01927c3e-2222-7ccc-9ddd-0e0e0e0e0e02
                      email: ama.boateng@samtec.example
                      fullName: Ama Boateng
                      role: SUPERVISOR
                      twoFactorEnabled: false
                      employeeId: 01927c3e-5a4b-7c8d-9e0f-1a2b3c4d5e70
                twoFactorRequired:
                  summary: Admin or HR account needs a second factor
                  value:
                    status: TWO_FACTOR_REQUIRED
                    challengeToken: example-challenge-token
                    expiresInSeconds: 300
                twoFactorSetupRequired:
                  summary: Admin or HR account must set up two-factor authentication first
                  value:
                    status: TWO_FACTOR_SETUP_REQUIRED
                    setupToken: example-setup-token
                    expiresInSeconds: 600
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/2fa/verify:
    post:
      tags: [Auth]
      operationId: verifyTwoFactor
      summary: Finish signing in with a two-factor code
      description: |
        Send the `challengeToken` from `POST /auth/login` and the 6-digit code
        from the user's authenticator app. On success the API responds like a
        normal sign-in and sets the refresh token cookie.

        Rules the API enforces:

        - A challenge token expires after 5 minutes, works only once, and
          belongs to the one account that signed in.
        - After 5 wrong codes the challenge is cancelled, and the user must
          sign in with their password again.
        - A code that was already accepted cannot be used a second time, even
          within its 30-second window (replay protection).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyTwoFactorRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The refresh token cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/2fa/setup:
    post:
      tags: [Auth]
      operationId: startTwoFactorSetup
      summary: Start setting up two-factor authentication
      description: |
        Send the `setupToken` from `POST /auth/login`. The API creates a new
        secret for the account and returns it as an `otpauth://` link, which
        the dashboard shows as a QR code for the authenticator app. Calling
        this again replaces the secret, so only the newest QR code works.

        The setup token expires after 10 minutes and belongs to one account.
        Two-factor authentication stays off until `POST /auth/2fa/enable`
        succeeds.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorSetupRequest"
      responses:
        "200":
          description: The new secret, ready to show as a QR code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorSetup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/2fa/enable:
    post:
      tags: [Auth]
      operationId: enableTwoFactor
      summary: Finish setting up two-factor authentication
      description: >-
        Send the `setupToken` and the first 6-digit code from the authenticator
        app. A correct code proves the app was set up properly. The API then
        switches two-factor authentication on, uses up the setup token and
        signs the user in. The rules of `POST /auth/2fa/verify` apply here too:
        5 wrong codes cancel the setup, and a code works only once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnableTwoFactorRequest"
      responses:
        "200":
          description: Two-factor authentication is on, and the user is signed in.
          headers:
            Set-Cookie:
              description: The refresh token cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Get a new access token using the refresh cookie
      description: |
        The browser sends the `samtec_refresh` cookie automatically. The API
        replaces it with a new one on every call (rotation).

        - **Reuse detection:** a refresh token that was already replaced must
          never arrive again. If it does, someone may have copied it, so the
          API signs that user out everywhere by revoking all of their refresh
          tokens.
        - **Origin check:** the request's `Origin` header must be one of the
          dashboard addresses in the API's `CORS_ORIGINS` setting. Otherwise
          the API answers `403`.
      security:
        - refreshCookie: []
      responses:
        "200":
          description: A new access token.
          headers:
            Set-Cookie:
              description: The rotated refresh token cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out and revoke the refresh token
      description: >-
        Like `POST /auth/refresh`, the request's `Origin` header must be one of
        the dashboard addresses in `CORS_ORIGINS`, so another website cannot
        sign the user out.
      security:
        - refreshCookie: []
      responses:
        "204":
          description: Signed out. The refresh cookie is cleared, even if it was already invalid.
          headers:
            Set-Cookie:
              description: Clears the refresh token cookie.
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the signed-in user
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/set-password:
    post:
      tags: [Auth]
      operationId: setPassword
      summary: Choose your password with a one-time link from an administrator
      description: >-
        Public: the one-time token is the proof. An administrator never sees
        or chooses anyone's password. They create the account (or reset its
        sign-in) and pass the person a one-time link, and the person picks
        their own password here. The link works once, for 72 hours. Afterwards
        the person signs in normally with `POST /auth/login`; ADMIN and
        HR_PAYROLL accounts then set up two-factor authentication as usual.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordRequest"
      responses:
        "204":
          description: The password is set. Sign in with it now.
        "400":
          description: >-
            The link has expired, was already used, or belongs to a switched-off
            account, or the password breaks the length rule.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change your own password
      description: >-
        **Roles:** any signed-in user. Needs the current password. On success
        every session of this account ends, including this browser's: the
        response clears the refresh cookie and the dashboard sends the person
        to sign in again with the new password. A wrong current password
        answers `400`, not `401`, so the dashboard does not try a refresh; it
        counts towards the same per-email lockout as signing in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: The password was changed, and every session ended.
          headers:
            Set-Cookie:
              description: Clears the refresh token cookie.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List sign-in accounts
      description: >-
        **Roles:** ADMIN. Every sign-in account of the company, including
        switched-off ones, oldest first. Sign-in accounts are separate from
        employee records: a guard's account is linked to their employee record.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccountList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a sign-in account
      description: >-
        **Roles:** ADMIN. SUPERVISOR and GUARD accounts must be linked to an
        employee of the company who has not left (`employeeId`); ADMIN and
        HR_PAYROLL accounts must not be. The account starts as
        `AWAITING_PASSWORD`. The response carries a one-time password link
        token, shown **only this once**: the dashboard turns it into a link
        (`/set-password#token=…`) for the admin to hand over in person or by
        private message, and the person chooses their own password with
        `POST /auth/set-password`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
            examples:
              guard:
                summary: A sign-in account for a guard
                value:
                  email: yaw.asante@samtec.example
                  fullName: Yaw Asante
                  role: GUARD
                  employeeId: 01927c3e-5a4b-7c8d-9e0f-1a2b3c4d5e6f
      responses:
        "201":
          description: The account was created, with its one-time password link.
          headers:
            Location:
              description: URL of the new account.
              schema:
                type: string
                format: uri-reference
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccountWithPasswordSetup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      operationId: getUser
      summary: Get one sign-in account
      description: "**Roles:** ADMIN."
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Change an account's name, email, role or employee link
      description: >-
        **Roles:** ADMIN. Send only the fields you want to change. The link rule
        is checked on the result: SUPERVISOR and GUARD need an employee,
        ADMIN and HR_PAYROLL must have none. Changing the role or the link ends
        every session of the account at once, so the person signs in again
        (and a new ADMIN or HR_PAYROLL sets up two-factor authentication).
        **On your own account only `fullName` may change** (`409` otherwise),
        so nobody can lock themselves out. A switched-off account answers `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/{userId}/deactivate:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Users]
      operationId: deactivateUser
      summary: Switch an account off
      description: >-
        **Roles:** ADMIN, never on your own account. The account can no longer
        sign in, every session and unfinished sign-in ends, and its current
        access token stops working on the very next request. Nothing is
        deleted. Terminating an employee switches their account off
        automatically.
      responses:
        "200":
          description: The account, now `DEACTIVATED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/{userId}/reactivate:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Users]
      operationId: reactivateUser
      summary: Switch an account back on
      description: >-
        **Roles:** ADMIN, never on your own account. Old sessions stay ended.
        An account whose linked employee has left the company cannot be
        switched back on (`409`).
      responses:
        "200":
          description: The account, now `ACTIVE` (or `AWAITING_PASSWORD` if no password was ever set).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/{userId}/reset-sign-in:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Users]
      operationId: resetUserSignIn
      summary: Reset a forgotten password or a lost authenticator
      description: >-
        **Roles:** ADMIN, never on your own account. Clears **both** the
        password and the two-factor authenticator, ends every session, and
        issues a new one-time password link (shown only this once). The person
        chooses a new password with the link; ADMIN and HR_PAYROLL accounts
        then set up a new authenticator at their next sign-in. Clearing both
        together stops a caller who knows the password from simply asking for
        "a new phone". A switched-off account answers `409`.
      responses:
        "200":
          description: The account, now `AWAITING_PASSWORD`, with its new link.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccountWithPasswordSetup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /employees:
    get:
      tags: [Employees]
      operationId: listEmployees
      summary: List employees
      description: >-
        **Roles:** ADMIN, HR_PAYROLL, SUPERVISOR (supervisors only see
        employees posted to their sites). Sorted by staff number. List items
        leave out sensitive identity fields on purpose (data minimisation).
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          description: Only return employees with this status.
          schema:
            $ref: "#/components/schemas/EmployeeStatus"
        - name: siteId
          in: query
          description: Only return employees currently posted to this site.
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          description: Case-insensitive match on staff number, first name or last name.
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        "200":
          description: One page of employees.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeList"
              examples:
                firstPage:
                  summary: First page, with more pages to follow
                  value:
                    items:
                      - id: 01927c3e-5a4b-7c8d-9e0f-1a2b3c4d5e6f
                        staffNumber: SMT-00042
                        fullName: Kwame Kofi Mensah
                        position: Security Guard
                        status: ACTIVE
                        biometricEnrolledAt: "2024-03-12T10:00:00Z"
                        currentSite:
                          id: 01927c3e-1111-7aaa-8bbb-0c0c0c0c0c01
                          code: ACC-01
                          name: Ridge Towers Office Complex
                        hireDate: "2024-03-11"
                      - id: 01927c3e-5a4b-7c8d-9e0f-1a2b3c4d5e71
                        staffNumber: SMT-00043
                        fullName: Abena Owusu
                        position: Senior Guard
                        status: PENDING_ENROLLMENT
                        biometricEnrolledAt: null
                        currentSite: null
                        hireDate: "2026-09-01"
                    nextCursor: U01ULTAwMDQz
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Employees]
      operationId: createEmployee
      summary: Register a new employee
      description: >-
        **Roles:** ADMIN, HR_PAYROLL. The API generates the staff number. New
        employees start as `PENDING_ENROLLMENT` and cannot clock in or be paid
        until their biometrics are enrolled (Phase 3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeRequest"
            examples:
              newGuard:
                summary: A new guard posted to Ridge Towers
                value:
                  firstName: Yaw
                  lastName: Asante
                  phone: "+233241234567"
                  ghanaCardNumber: GHA-123456789-0
                  position: Security Guard
                  hireDate: "2026-09-15"
                  siteId: 01927c3e-1111-7aaa-8bbb-0c0c0c0c0c01
      responses:
        "201":
          description: The employee was created.
          headers:
            Location:
              description: URL of the new employee.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /employees/{employeeId}:
    parameters:
      - $ref: "#/components/parameters/EmployeeId"
    get:
      tags: [Employees]
      operationId: getEmployee
      summary: Get one employee
      description: >-
        **Roles:** ADMIN, HR_PAYROLL, SUPERVISOR (own sites only), GUARD (own
        record only). Records the user may not see return `404`, not `403`, so
        nobody can discover which IDs exist. The Ghana Card number is only
        included for ADMIN, HR_PAYROLL and a guard viewing their own record.
      responses:
        "200":
          description: The employee.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
              examples:
                activeGuard:
                  summary: An active, enrolled guard, as seen by HR
                  value:
                    id: 01927c3e-5a4b-7c8d-9e0f-1a2b3c4d5e6f
                    staffNumber: SMT-00042
                    firstName: Kwame
                    lastName: Mensah
                    otherNames: Kofi
                    fullName: Kwame Kofi Mensah
                    phone: "+233201234567"
                    email: null
                    ghanaCardNumber: GHA-712345678-3
                    position: Security Guard
                    status: ACTIVE
                    biometricEnrolledAt: "2024-03-12T10:00:00Z"
                    hireDate: "2024-03-11"
                    terminationDate: null
                    currentSite:
                      id: 01927c3e-1111-7aaa-8bbb-0c0c0c0c0c01
                      code: ACC-01
                      name: Ridge Towers Office Complex
                    currentPost:
                      id: 01927c3e-2222-7bbb-8ccc-0d0d0d0d0d01
                      name: Main Gate
                    currentShiftPattern:
                      id: 01927c3e-3333-7ccc-8ddd-0e0e0e0e0e01
                      name: Day Shift
                      startTime: "06:00"
                      endTime: "18:00"
                    createdAt: "2024-03-08T09:15:00Z"
                    updatedAt: "2026-08-30T14:02:11Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Employees]
      operationId: updateEmployee
      summary: Update an employee's details
      description: >-
        **Roles:** ADMIN, HR_PAYROLL. Send only the fields you want to change,
        and send `null` to clear an optional field. The Ghana Card number cannot
        be changed here. Identity corrections need a separate, audited admin
        process, so they cannot be used to hide a ghost worker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRequest"
            examples:
              moveSite:
                summary: Post the guard to another site
                value:
                  siteId: 01927c3e-1111-7aaa-8bbb-0c0c0c0c0c02
      responses:
        "200":
          description: The updated employee.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /employees/{employeeId}/terminate:
    parameters:
      - $ref: "#/components/parameters/EmployeeId"
    post:
      tags: [Employees]
      operationId: terminateEmployee
      summary: Record that an employee has left
      description: >-
        **Roles:** ADMIN, HR_PAYROLL. The employee is never deleted. The record
        stays for audit and payroll history, and the ghost-detection engine
        flags any later clock-in or pay for this person.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminateEmployeeRequest"
            examples:
              resigned:
                summary: A guard resigns
                value:
                  effectiveDate: "2026-09-30"
                  reason: RESIGNED
                  note: Relocating to Tamale.
      responses:
        "200":
          description: The employee, now terminated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /sites:
    get:
      tags: [Sites]
      operationId: listSites
      summary: List client sites
      description: >-
        **Roles:** ADMIN, HR_PAYROLL, SUPERVISOR (supervisors only see their
        own sites). Sorted by site code.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          description: Only return sites with this status.
          schema:
            $ref: "#/components/schemas/SiteStatus"
        - name: region
          in: query
          description: Only return sites in this region.
          schema:
            $ref: "#/components/schemas/GhanaRegion"
      responses:
        "200":
          description: One page of sites.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteList"
              examples:
                twoSites:
                  summary: Two active sites, last page
                  value:
                    items:
                      - id: 01927c3e-1111-7aaa-8bbb-0c0c0c0c0c01
                        code: ACC-01
                        name: Ridge Towers Office Complex
                        clientName: Ridge Towers Management Ltd
                        region: GREATER_ACCRA
                        city: Accra
                        status: ACTIVE
                        activeGuardCount: 12
                        createdAt: "2024-01-15T08:00:00Z"
                        updatedAt: "2026-09-01T10:30:00Z"
                      - id: 01927c3e-1111-7aaa-8bbb-0c0c0c0c0c04
                        code: KSI-01
                        name: Adum Retail Centre
                        clientName: Asante Retail Holdings
                        region: ASHANTI
                        city: Kumasi
                        status: ACTIVE
                        activeGuardCount: 8
                        createdAt: "2024-06-02T08:00:00Z"
                        updatedAt: "2026-08-20T16:45:00Z"
                    nextCursor: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /sites/{siteId}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      tags: [Sites]
      operationId: getSite
      summary: Get one site
      description: "**Roles:** ADMIN, HR_PAYROLL, SUPERVISOR (own sites only)."
      responses:
        "200":
          description: The site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /sites/{siteId}/posts:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      tags: [Rosters]
      operationId: listPosts
      summary: List the posts of a site
      description: >-
        **Roles:** ADMIN, HR_PAYROLL, SUPERVISOR (own sites only). Sorted by
        name. A site a supervisor may not see answers `404`.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of posts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Rosters]
      operationId: createPost
      summary: Create a post at a site
      description: >-
        **Roles:** ADMIN, HR_PAYROLL. A post is a named guard position at the
        site, like "Main Gate" or "Reception", with the number of guards it
        needs per shift.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
            examples:
              mainGate:
                summary: The main gate, guarded by two people per shift
                value:
                  name: Main Gate
                  requiredGuards: 2
      responses:
        "201":
          description: The post was created.
          headers:
            Location:
              description: URL of the site's posts.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /posts/{postId}:
    parameters:
      - $ref: "#/components/parameters/PostId"
    patch:
      tags: [Rosters]
      operationId: updatePost
      summary: Update a post
      description: >-
        **Roles:** ADMIN, HR_PAYROLL. Send only the fields you want to change.
        A post is never deleted; set its status to `INACTIVE` when the client
        stops paying for it, so history keeps its meaning.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostRequest"
      responses:
        "200":
          description: The updated post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /shift-patterns:
    get:
      tags: [Rosters]
      operationId: listShiftPatterns
      summary: List shift patterns
      description: >-
        **Roles:** ADMIN, HR_PAYROLL, SUPERVISOR. Shift patterns belong to the
        whole company, not one site. Sorted by name.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of shift patterns.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftPatternList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Rosters]
      operationId: createShiftPattern
      summary: Create a shift pattern
      description: >-
        **Roles:** ADMIN, HR_PAYROLL. When the end time is not after the start
        time, the shift crosses midnight — a night shift from 18:00 to 06:00
        ends the next morning.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShiftPatternRequest"
            examples:
              nightShift:
                summary: A 12-hour night shift that crosses midnight
                value:
                  name: Night Shift
                  startTime: "18:00"
                  endTime: "06:00"
      responses:
        "201":
          description: The shift pattern was created.
          headers:
            Location:
              description: URL of the shift pattern list.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftPattern"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /shift-patterns/{shiftPatternId}:
    parameters:
      - $ref: "#/components/parameters/ShiftPatternId"
    patch:
      tags: [Rosters]
      operationId: updateShiftPattern
      summary: Update a shift pattern
      description: >-
        **Roles:** ADMIN, HR_PAYROLL. Send only the fields you want to change.
        Changing the times affects every employee assigned to this pattern
        from now on; past attendance is never rewritten.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShiftPatternRequest"
      responses:
        "200":
          description: The updated shift pattern.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftPattern"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        The access token from `POST /auth/login`, sent in the header
        `Authorization: Bearer <token>`.
    refreshCookie:
      type: apiKey
      in: cookie
      name: samtec_refresh
      description: >-
        The refresh token cookie set by the API, with the attributes
        `HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=604800`.
        JavaScript cannot read it, it lasts 7 days, and the browser sends it
        only over HTTPS, only to the auth endpoints, and never with requests
        started by another website. `SameSite=Strict` needs the dashboard and
        the API on the same site, as described in
        docs/plan/03-system-architecture.md.

  headers:
    NoStore:
      description: >-
        Always `no-store`: the response carries a one-time secret, so no
        browser or proxy may keep a copy.
      schema:
        type: string
        const: no-store

  parameters:
    Cursor:
      name: cursor
      in: query
      description: The `nextCursor` value from the previous page. Leave it out to get the first page.
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      description: How many items to return in one page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    EmployeeId:
      name: employeeId
      in: path
      required: true
      description: The employee's ID.
      schema:
        type: string
        format: uuid
    SiteId:
      name: siteId
      in: path
      required: true
      description: The site's ID.
      schema:
        type: string
        format: uuid
    PostId:
      name: postId
      in: path
      required: true
      description: The post's ID.
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      description: The sign-in account's ID.
      schema:
        type: string
        format: uuid
    ShiftPatternId:
      name: shiftPatternId
      in: path
      required: true
      description: The shift pattern's ID.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: The request is invalid. The `errors` list says which fields are wrong.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            validationError:
              summary: A field failed validation
              value:
                type: "urn:samtec:problem:validation-error"
                title: Validation failed
                status: 400
                detail: One or more fields are invalid.
                instance: /api/v1/employees
                traceId: 01927c3e-9f00-7abc-8def-000000000001
                errors:
                  - path: ghanaCardNumber
                    message: Must look like GHA-123456789-0.
    Unauthorized:
      description: No valid access token was sent, or it has expired. Refresh the session or sign in again.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            notSignedIn:
              summary: Missing or expired token
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Sign in to continue.
                traceId: 01927c3e-9f00-7abc-8def-000000000002
    InvalidCredentials:
      description: >-
        The sign-in details are wrong. The message never says whether the email
        or the password was wrong, so attackers cannot discover which emails
        have accounts.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            wrongPassword:
              summary: Wrong email or password
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Email or password is incorrect.
                traceId: 01927c3e-9f00-7abc-8def-000000000003
    Forbidden:
      description: You are signed in, but your role is not allowed to do this.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            wrongRole:
              summary: Role not allowed
              value:
                type: about:blank
                title: Forbidden
                status: 403
                detail: Your role does not allow this action.
                traceId: 01927c3e-9f00-7abc-8def-000000000004
    NotFound:
      description: >-
        Nothing was found with this ID, or you are not allowed to see it. Both
        cases look the same on purpose.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            unknownEmployee:
              summary: No such employee
              value:
                type: about:blank
                title: Not Found
                status: 404
                detail: No employee exists with this ID.
                traceId: 01927c3e-9f00-7abc-8def-000000000005
    Conflict:
      description: The request clashes with data that already exists.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            duplicateGhanaCard:
              summary: Ghana Card number already registered
              value:
                type: "urn:samtec:problem:conflict"
                title: Conflict
                status: 409
                detail: An employee with this Ghana Card number is already registered.
                traceId: 01927c3e-9f00-7abc-8def-000000000006
    TooManyRequests:
      description: Too many attempts in a short time. Wait before trying again.
      headers:
        Retry-After:
          description: How many seconds to wait before trying again.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            slowDown:
              summary: Rate limit reached
              value:
                type: about:blank
                title: Too Many Requests
                status: 429
                detail: Too many attempts. Try again in 60 seconds.
                traceId: 01927c3e-9f00-7abc-8def-000000000007

  schemas:
    HealthResponse:
      type: object
      description: >-
        The result of a health check. Public, so it holds only what a health
        check needs. Version details will come from an admin-only endpoint in
        Phase 1.
      required: [status, time, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: "`ok` when everything works, `degraded` when a dependency is down."
        time:
          type: string
          format: date-time
          description: The server's current time in UTC.
        checks:
          type: object
          required: [database]
          properties:
            database:
              type: string
              enum: [up, down]

    SystemInfo:
      type: object
      description: Details about the running API. Only administrators may read them.
      required: [version, environment, uptimeSeconds]
      properties:
        version:
          type: string
          description: The version of the API that is running.
          examples: ["0.1.0"]
        environment:
          type: string
          enum: [development, test, production]
        uptimeSeconds:
          type: integer
          minimum: 0
          description: Seconds since the API process started.

    ProblemDetails:
      type: object
      description: >-
        A standard error response (RFC 9457). Show `detail` to the user, and
        include `traceId` when reporting a bug so the backend developer can find
        the exact request in the logs.
      required: [type, title, status, traceId]
      properties:
        type:
          type: string
          format: uri-reference
          description: >-
            The kind of error. `about:blank` means a plain HTTP error.
            Values starting with `urn:samtec:problem:` are SAMTEC-specific.
          examples: ["urn:samtec:problem:validation-error"]
        title:
          type: string
          description: A short summary of the error type.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: The HTTP status code.
        detail:
          type: string
          description: A human-readable explanation of this specific error.
        instance:
          type: string
          format: uri-reference
          description: The request path that failed.
        traceId:
          type: string
          description: The ID of the request, also written to the server logs.
        errors:
          type: array
          description: Present on validation errors, with one entry per invalid field.
          items:
            $ref: "#/components/schemas/ValidationIssue"

    ValidationIssue:
      type: object
      required: [path, message]
      properties:
        path:
          type: string
          description: The invalid field as a dot path, for example `phone` or `address.city`.
        message:
          type: string
          description: What is wrong, written for the user.

    UserRole:
      type: string
      description: |
        What a user account is allowed to do.
        - `ADMIN` — full access, including user management and approving payroll.
        - `HR_PAYROLL` — manages employees and prepares payroll runs, but cannot approve a run they prepared.
        - `SUPERVISOR` — manages attendance and rosters for their assigned sites.
        - `GUARD` — sees only their own attendance and payslips.
      enum: [ADMIN, HR_PAYROLL, SUPERVISOR, GUARD]

    CurrentUser:
      type: object
      required: [id, email, fullName, role, twoFactorEnabled, employeeId]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        twoFactorEnabled:
          type: boolean
        employeeId:
          type: [string, "null"]
          format: uuid
          description: The linked employee record for guards and supervisors, or `null` for office-only accounts.

    UserAccountStatus:
      type: string
      description: |
        - `AWAITING_PASSWORD` — created or reset; waiting for the person to
          choose a password with their one-time link. Cannot sign in yet.
        - `ACTIVE` — can sign in.
        - `DEACTIVATED` — switched off by an administrator, or because the
          linked employee left. Cannot sign in. Kept for history.
      enum: [AWAITING_PASSWORD, ACTIVE, DEACTIVATED]

    UserAccount:
      type: object
      description: A sign-in account as administrators see it. Never contains a password or secret.
      required: [id, email, fullName, role, status, twoFactorEnabled, employeeId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          $ref: "#/components/schemas/UserAccountStatus"
        twoFactorEnabled:
          type: boolean
        employeeId:
          type: [string, "null"]
          format: uuid
          description: The linked employee for SUPERVISOR and GUARD accounts; `null` for ADMIN and HR_PAYROLL.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserAccountList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserAccount"
        nextCursor:
          type: [string, "null"]
          description: Pass this as `cursor` to get the next page. It is `null` on the last page.

    PasswordSetupToken:
      type: string
      minLength: 1
      maxLength: 512
      description: >-
        A one-time token that lets one person choose their password. It works
        once, for 72 hours. Hand it over only in person or by private message.

    PasswordSetup:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          $ref: "#/components/schemas/PasswordSetupToken"
        expiresAt:
          type: string
          format: date-time

    UserAccountWithPasswordSetup:
      type: object
      description: An account plus its one-time password link token, shown only in this one response.
      required: [user, passwordSetup]
      properties:
        user:
          $ref: "#/components/schemas/UserAccount"
        passwordSetup:
          $ref: "#/components/schemas/PasswordSetup"

    PersonFullName:
      type: string
      minLength: 2
      maxLength: 120
      examples: [Yaw Asante]

    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, fullName, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Stored lower-case. Unique within the company.
        fullName:
          $ref: "#/components/schemas/PersonFullName"
        role:
          $ref: "#/components/schemas/UserRole"
        employeeId:
          type: string
          format: uuid
          description: Required for SUPERVISOR and GUARD; not allowed for ADMIN and HR_PAYROLL.

    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Only the fields you send are changed.
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        fullName:
          $ref: "#/components/schemas/PersonFullName"
        role:
          $ref: "#/components/schemas/UserRole"
        employeeId:
          type: [string, "null"]
          format: uuid
          description: Link a different employee, or `null` to unlink (for ADMIN and HR_PAYROLL).

    NewPassword:
      type: string
      minLength: 12
      maxLength: 128
      writeOnly: true
      description: At least 12 characters. A short sentence is easy to remember and hard to guess.

    SetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          $ref: "#/components/schemas/PasswordSetupToken"
        newPassword:
          $ref: "#/components/schemas/NewPassword"

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        newPassword:
          $ref: "#/components/schemas/NewPassword"

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true

    LoginResponse:
      description: >-
        A finished sign-in, a request for a two-factor code, or a request to
        set up two-factor authentication. Check `status` to tell them apart.
      oneOf:
        - $ref: "#/components/schemas/AuthenticatedSession"
        - $ref: "#/components/schemas/TwoFactorChallenge"
        - $ref: "#/components/schemas/TwoFactorSetupRequired"
      discriminator:
        propertyName: status
        mapping:
          AUTHENTICATED: "#/components/schemas/AuthenticatedSession"
          TWO_FACTOR_REQUIRED: "#/components/schemas/TwoFactorChallenge"
          TWO_FACTOR_SETUP_REQUIRED: "#/components/schemas/TwoFactorSetupRequired"

    AuthenticatedSession:
      type: object
      required: [status, accessToken, expiresInSeconds, user]
      properties:
        status:
          type: string
          const: AUTHENTICATED
        accessToken:
          type: string
          description: Send it in the `Authorization` header. Keep it in memory only, never in localStorage.
        expiresInSeconds:
          type: integer
          minimum: 1
          examples: [900]
        user:
          $ref: "#/components/schemas/CurrentUser"

    TwoFactorChallenge:
      type: object
      required: [status, challengeToken, expiresInSeconds]
      properties:
        status:
          type: string
          const: TWO_FACTOR_REQUIRED
        challengeToken:
          $ref: "#/components/schemas/OneTimeToken"
        expiresInSeconds:
          type: integer
          minimum: 1
          examples: [300]

    TwoFactorSetupRequired:
      type: object
      required: [status, setupToken, expiresInSeconds]
      properties:
        status:
          type: string
          const: TWO_FACTOR_SETUP_REQUIRED
        setupToken:
          $ref: "#/components/schemas/OneTimeToken"
        expiresInSeconds:
          type: integer
          minimum: 1
          examples: [600]

    OneTimeToken:
      type: string
      minLength: 1
      maxLength: 512
      description: >-
        Proves the password was correct. It expires quickly, works for one
        account only, and is used up by the step it was issued for. Keep it in
        memory only.

    TwoFactorCode:
      type: string
      pattern: '^\d{6}$'
      description: The 6-digit code from the authenticator app.
      examples: ["492039"]

    VerifyTwoFactorRequest:
      type: object
      additionalProperties: false
      required: [challengeToken, code]
      properties:
        challengeToken:
          $ref: "#/components/schemas/OneTimeToken"
        code:
          $ref: "#/components/schemas/TwoFactorCode"

    TwoFactorSetupRequest:
      type: object
      additionalProperties: false
      required: [setupToken]
      properties:
        setupToken:
          $ref: "#/components/schemas/OneTimeToken"

    TwoFactorSetup:
      type: object
      description: >-
        The new two-factor secret. Both fields contain the secret itself, so
        show them only on the setup screen, and never store or log them.
      required: [otpauthUri, manualEntryKey]
      properties:
        otpauthUri:
          type: string
          description: Show this link as a QR code for the authenticator app to scan.
          examples: ["otpauth://totp/SAMTEC:ama.boateng%40samtec.example?secret=EXAMPLESECRET&issuer=SAMTEC"]
        manualEntryKey:
          type: string
          description: The same secret as text, for people who cannot scan the QR code.
          examples: [EXAMPLESECRET]

    EnableTwoFactorRequest:
      type: object
      additionalProperties: false
      required: [setupToken, code]
      properties:
        setupToken:
          $ref: "#/components/schemas/OneTimeToken"
        code:
          $ref: "#/components/schemas/TwoFactorCode"

    AccessTokenResponse:
      type: object
      required: [accessToken, expiresInSeconds]
      properties:
        accessToken:
          type: string
        expiresInSeconds:
          type: integer
          minimum: 1
          examples: [900]

    EmployeeStatus:
      type: string
      description: |
        Where the employee is in their working life with the company.
        - `PENDING_ENROLLMENT` — registered, but biometrics are not enrolled yet. Cannot clock in or be paid.
        - `ACTIVE` — enrolled and verified. Can clock in and appears on payroll.
        - `SUSPENDED` — temporarily blocked from clocking in and from payroll.
        - `TERMINATED` — has left the company. Kept for history and never deleted.
      enum: [PENDING_ENROLLMENT, ACTIVE, SUSPENDED, TERMINATED]

    TerminationReason:
      type: string
      description: |
        Why the employee left.
        - `RESIGNED` — the employee chose to leave.
        - `DISMISSED` — the company ended the employment.
        - `CONTRACT_ENDED` — a fixed-term contract finished.
        - `ABSCONDED` — stopped reporting for duty without notice.
        - `DECEASED` — the employee passed away.
        - `OTHER` — explain in `note`.
      enum: [RESIGNED, DISMISSED, CONTRACT_ENDED, ABSCONDED, DECEASED, OTHER]

    StaffNumber:
      type: string
      pattern: '^SMT-\d{5}$'
      description: The employee number printed on ID cards. Generated by the API.
      examples: [SMT-00042]

    GhanaCardNumber:
      type: string
      pattern: '^GHA-\d{9}-\d$'
      description: >-
        The personal ID number on the Ghana Card, issued by the National
        Identification Authority. It also serves as the SSNIT number.
        Sensitive, so show it only to roles that need it.
      examples: [GHA-123456789-0]

    GhanaPhoneNumber:
      type: string
      pattern: '^\+233\d{9}$'
      description: A Ghanaian phone number in international format, +233 followed by 9 digits.
      examples: ["+233241234567"]

    PersonName:
      type: string
      minLength: 1
      maxLength: 60

    SiteCode:
      type: string
      pattern: '^[A-Z]{3}-\d{2}$'
      description: A short site code made of three letters for the town and a two-digit number.
      examples: [ACC-01]

    SiteSummary:
      type: object
      description: The short form of a site, used inside other objects.
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          $ref: "#/components/schemas/SiteCode"
        name:
          type: string
          examples: [Ridge Towers Office Complex]

    EmployeeListItem:
      type: object
      description: The short form of an employee used in lists. Sensitive identity fields are left out on purpose.
      required: [id, staffNumber, fullName, position, status, biometricEnrolledAt, currentSite, hireDate]
      properties:
        id:
          type: string
          format: uuid
        staffNumber:
          $ref: "#/components/schemas/StaffNumber"
        fullName:
          type: string
          examples: [Kwame Kofi Mensah]
        position:
          type: string
          examples: [Security Guard]
        status:
          $ref: "#/components/schemas/EmployeeStatus"
        biometricEnrolledAt:
          $ref: "#/components/schemas/BiometricEnrolledAt"
        currentSite:
          description: The site the employee is posted to today, or `null` if unassigned.
          oneOf:
            - $ref: "#/components/schemas/SiteSummary"
            - type: "null"
        hireDate:
          type: string
          format: date

    EmployeeList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeListItem"
        nextCursor:
          type: [string, "null"]
          description: Pass this as `cursor` to get the next page. It is `null` on the last page.

    BiometricEnrolledAt:
      type: [string, "null"]
      format: date-time
      description: >-
        When fingerprint or face templates were enrolled and passed the
        duplicate check, or `null` if the employee is not enrolled.

    Employee:
      type: object
      description: The full employee record. Contains sensitive identity data.
      required:
        - id
        - staffNumber
        - firstName
        - lastName
        - otherNames
        - fullName
        - phone
        - email
        - position
        - status
        - biometricEnrolledAt
        - hireDate
        - terminationDate
        - currentSite
        - currentPost
        - currentShiftPattern
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        staffNumber:
          $ref: "#/components/schemas/StaffNumber"
        firstName:
          $ref: "#/components/schemas/PersonName"
        lastName:
          $ref: "#/components/schemas/PersonName"
        otherNames:
          description: Middle or other names, or `null`.
          oneOf:
            - $ref: "#/components/schemas/PersonName"
            - type: "null"
        fullName:
          type: string
          description: First, other and last names joined together, ready to display.
        phone:
          $ref: "#/components/schemas/GhanaPhoneNumber"
        email:
          type: [string, "null"]
          format: email
        ghanaCardNumber:
          $ref: "#/components/schemas/GhanaCardNumber"
          description: >-
            Only included for ADMIN and HR_PAYROLL, and for a guard viewing
            their own record. Missing for everyone else (data minimisation), so
            the dashboard must handle it being absent.
        position:
          type: string
          examples: [Security Guard]
        status:
          $ref: "#/components/schemas/EmployeeStatus"
        biometricEnrolledAt:
          $ref: "#/components/schemas/BiometricEnrolledAt"
        hireDate:
          type: string
          format: date
        terminationDate:
          type: [string, "null"]
          format: date
        currentSite:
          description: The site the employee is posted to today, or `null` if unassigned.
          oneOf:
            - $ref: "#/components/schemas/SiteSummary"
            - type: "null"
        currentPost:
          description: The post at that site, or `null` when none is set.
          oneOf:
            - $ref: "#/components/schemas/PostSummary"
            - type: "null"
        currentShiftPattern:
          description: The shift pattern they work, or `null` when none is set.
          oneOf:
            - $ref: "#/components/schemas/ShiftPatternSummary"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateEmployeeRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName, phone, ghanaCardNumber, position, hireDate]
      properties:
        firstName:
          $ref: "#/components/schemas/PersonName"
        lastName:
          $ref: "#/components/schemas/PersonName"
        otherNames:
          $ref: "#/components/schemas/PersonName"
        phone:
          $ref: "#/components/schemas/GhanaPhoneNumber"
        email:
          type: string
          format: email
          maxLength: 254
        ghanaCardNumber:
          $ref: "#/components/schemas/GhanaCardNumber"
        position:
          type: string
          minLength: 2
          maxLength: 60
        hireDate:
          type: string
          format: date
        siteId:
          type: string
          format: uuid
          description: Optional. Post the employee to this site straight away.
        postId:
          type: string
          format: uuid
          description: Optional, only with `siteId`. The post at that site.
        shiftPatternId:
          type: string
          format: uuid
          description: Optional, only with `siteId`. The shift pattern they work.

    UpdateEmployeeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Only the fields you send are changed. Send `null` to clear an optional field.
      properties:
        firstName:
          $ref: "#/components/schemas/PersonName"
        lastName:
          $ref: "#/components/schemas/PersonName"
        otherNames:
          oneOf:
            - $ref: "#/components/schemas/PersonName"
            - type: "null"
        phone:
          $ref: "#/components/schemas/GhanaPhoneNumber"
        email:
          type: [string, "null"]
          format: email
          maxLength: 254
        position:
          type: string
          minLength: 2
          maxLength: 60
        siteId:
          type: [string, "null"]
          format: uuid
          description: Move the employee to this site, or send `null` to unassign them.
        postId:
          type: [string, "null"]
          format: uuid
          description: >-
            Set or change the post. Only with `siteId`, because a posting
            change starts a fresh assignment. `null` clears the post.
        shiftPatternId:
          type: [string, "null"]
          format: uuid
          description: >-
            Set or change the shift pattern. Only with `siteId`, because a
            posting change starts a fresh assignment. `null` clears it.

    TerminateEmployeeRequest:
      type: object
      additionalProperties: false
      required: [effectiveDate, reason]
      properties:
        effectiveDate:
          type: string
          format: date
          description: The employee's last working day.
        reason:
          $ref: "#/components/schemas/TerminationReason"
        note:
          type: string
          minLength: 1
          maxLength: 500
          description: Extra detail. Required when `reason` is `OTHER`.

    SiteStatus:
      type: string
      description: |
        - `ACTIVE` — guards are currently posted here.
        - `INACTIVE` — the contract has ended or is paused. Kept for history.
      enum: [ACTIVE, INACTIVE]

    GhanaRegion:
      type: string
      description: One of Ghana's 16 administrative regions.
      enum:
        - AHAFO
        - ASHANTI
        - BONO
        - BONO_EAST
        - CENTRAL
        - EASTERN
        - GREATER_ACCRA
        - NORTH_EAST
        - NORTHERN
        - OTI
        - SAVANNAH
        - UPPER_EAST
        - UPPER_WEST
        - VOLTA
        - WESTERN
        - WESTERN_NORTH

    Site:
      type: object
      required: [id, code, name, clientName, region, city, status, activeGuardCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          $ref: "#/components/schemas/SiteCode"
        name:
          type: string
          examples: [Ridge Towers Office Complex]
        clientName:
          type: string
          description: The client company that pays for guarding this site.
          examples: [Ridge Towers Management Ltd]
        region:
          $ref: "#/components/schemas/GhanaRegion"
        city:
          type: string
          examples: [Accra]
        status:
          $ref: "#/components/schemas/SiteStatus"
        activeGuardCount:
          type: integer
          minimum: 0
          description: The number of ACTIVE employees posted here today.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SiteList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Site"
        nextCursor:
          type: [string, "null"]
          description: Pass this as `cursor` to get the next page. It is `null` on the last page.

    ShiftTime:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      description: A time of day in 24-hour form, like `06:00` or `18:30`.
      examples: ["18:00"]

    PostStatus:
      type: string
      description: |
        - `ACTIVE` — the client pays for this post; guards are assigned to it.
        - `INACTIVE` — no longer staffed. Kept for history, never deleted.
      enum: [ACTIVE, INACTIVE]

    PostSummary:
      type: object
      description: Just enough of a post to show on an employee.
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Main Gate]

    Post:
      type: object
      required: [id, siteId, name, requiredGuards, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        name:
          type: string
          description: What the position is called at the site. Unique per site.
          examples: [Main Gate]
        requiredGuards:
          type: integer
          minimum: 1
          maximum: 50
          description: How many guards this post needs on duty per shift.
        status:
          $ref: "#/components/schemas/PostStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PostList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        nextCursor:
          type: [string, "null"]
          description: Pass this as `cursor` to get the next page. It is `null` on the last page.

    CreatePostRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
        requiredGuards:
          type: integer
          minimum: 1
          maximum: 50
          default: 1

    UpdatePostRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Only the fields you send are changed.
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
        requiredGuards:
          type: integer
          minimum: 1
          maximum: 50
        status:
          $ref: "#/components/schemas/PostStatus"

    ShiftPatternSummary:
      type: object
      description: Just enough of a shift pattern to show on an employee.
      required: [id, name, startTime, endTime]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Night Shift]
        startTime:
          $ref: "#/components/schemas/ShiftTime"
        endTime:
          $ref: "#/components/schemas/ShiftTime"

    ShiftPattern:
      type: object
      required: [id, name, startTime, endTime, crossesMidnight, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: What the company calls this pattern. Unique per company.
          examples: [Night Shift]
        startTime:
          $ref: "#/components/schemas/ShiftTime"
        endTime:
          $ref: "#/components/schemas/ShiftTime"
        crossesMidnight:
          type: boolean
          description: >-
            `true` when the shift ends on the next calendar day, like 18:00 to
            06:00. Worked out by the API — the end time is not after the start.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ShiftPatternList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShiftPattern"
        nextCursor:
          type: [string, "null"]
          description: Pass this as `cursor` to get the next page. It is `null` on the last page.

    CreateShiftPatternRequest:
      type: object
      additionalProperties: false
      required: [name, startTime, endTime]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
        startTime:
          $ref: "#/components/schemas/ShiftTime"
        endTime:
          $ref: "#/components/schemas/ShiftTime"

    UpdateShiftPatternRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Only the fields you send are changed.
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
        startTime:
          $ref: "#/components/schemas/ShiftTime"
        endTime:
          $ref: "#/components/schemas/ShiftTime"
