ke-width="1"/><text x="890.0" y="555" font-family="Geist, Inter, 'Segoe UI', sans-serif" font-size="13.5" fill="#1d2433" font-weight="400" text-anchor="start">••••••••••••••</text></g><g id="button-Sign in"><rect x="878.0" y="596" width="304" height="36" fill="#223055" rx="9"/><text x="1030.0" y="619" font-family="Geist, Inter, 'Segoe UI', sans-serif" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="middle">Sign in</text></g></g></svg>