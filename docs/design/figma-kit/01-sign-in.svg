<svg id="01 Sign in" width="1440" height="1024" viewBox="0 0 1440 1024" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1440" height="1024" fill="#fafbfd" rx="0"/><g id="brand-panel"><rect x="0" y="0" width="620" height="1024" fill="#1c2743" rx="0"/><g transform="translate(40,36) scale(1.0)"><path fill="#13213a" d="M16 2 4 6.5v8.2c0 7.6 5.1 13.7 12 15.3 6.9-1.6 12-7.7 12-15.3V6.5L16 2Z"/><path fill="#e8b542" d="m16 7.5-6.5 2.4v4.8c0 4.4 2.8 8 6.5 9.1 3.7-1.1 6.5-4.7 6.5-9.1V9.9L16 7.5Z"/></g><text x="80" y="52" font-family="Geist, Inter, 'Segoe UI', sans-serif" font-size="17" fill="#f2f4f8" font-weight="600" text-anchor="start" letter-spacing="0.06em">SAMTEC</text><text x="40" y="416.0" font-family="Geist, Inter, 'Segoe UI', sans-serif" font-size="34" fill="#f2f4f8" font-weight="700" text-anchor="start">From ghost payroll</text><text x="40" y="456.0" font-family="Geist, Inter, 'Segoe UI', sans-serif" font-size="34" fill="#f2f4f8" font-weight="700" text-anchor="start">to proven presence.</text><g transform="translate(40,498.0) scale(1.0)" fill="none" stroke="#e8b542" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8 a5 5 0 0 1 10 0 v3 M7.5 8 a2.5 2.5 0 0 1 5 0 v4 c0 2-1 3.5-2.5 4.5 M10 8 v4"/></g><text x="72" y="512.0" font-family="Geist, Inter, 'Segoe UI', sans-serif" font-size="14.5" fill="#c9d0e0" font-weight="400" text-anchor="start">Every guard is enrolled once and proven unique.</text><g transform="translate(40,538.0) scale(1.0)" fill="none" stroke="#e8b542" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17.5 S4.5 12 4.5 8.2 A5.5 5.5 0 1 1 15.5 8.2 C15.5 12 10 17.5 10 17.5 Z"/><circle cx="10" cy="8.2" r="1.9"/></g><text x="72" y="552.0" font-family="Geist, Inter, 'Segoe UI', sans-serif" font-size="14.5" fill="#c9d0e0" font-weight="400" text-anchor="start">Every shift is a biometric clock-in at a known site.</text><g transform="translate(40,578.0) scale(1.0)" fill="none" stroke="#e8b542" s